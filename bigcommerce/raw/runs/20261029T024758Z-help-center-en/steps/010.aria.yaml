- heading "Locating Your Billing Cycle" [level=3]
- paragraph: You can locate your store’s billing period by viewing a past invoice.
- paragraph:
  - text: First,
  - link "log into the Account Dashboard":
    - /url: "#dashboard"
  - text: and on the home page, click on the
  - strong: store name
  - text: "to view the store details. In the browser’s URL bar, make a note of your store ID. It is the number at the end of the URL in the example below:"
- paragraph:
  - emphasis: https://manage.bigcommerce.com/account/stores/1234567890
- paragraph:
  - text: Next, click
  - strong: Account
  - text: in the upper left, then select
  - emphasis: Invoices
  - text: .
- paragraph:
  - img "Invoices highlighted in the Account drop-down menu"
- paragraph:
  - text: Click
  - strong: Download
  - text: next to a recent invoice with a positive value under
  - strong: Total (USD)
  - text: . If you have several recent invoices, we recommend downloading them all.
- paragraph:
  - text: Open the downloaded invoices and look for your store’s
  - strong: most recent
  - text: plan line item. The value under
  - strong: Store ID
  - text: should match the number previously noted and a plan charge such as
  - emphasis: Core Store Yearly
  - text: ", or"
  - emphasis: Scale Store Monthly
  - text: will appear under
  - strong: Charge Name
  - text: .
- paragraph:
  - text: Your billing period is the timeframe noted under
  - strong: Service Period
  - text: . For example, this invoice covers the period
  - strong: 2026-03-31
  - text: "-"
  - strong: 2027-03-30
  - text: . This means the annual cycle ends
  - strong: 2027-03-30
  - text: and the new billing period begins
  - strong: 2027-03-31.
- paragraph:
  - img "Service Period highlighted on an invoice"
- link:
  - /url: "#faq"
- heading "FAQ" [level=3]
- paragraph:
  - strong: When upgrading plans, why is there a prorated charge?
- paragraph:
  - text: Upgrades are processed immediately to allow you to access the new plan’s features without any delay. At the time of the upgrade, you are charged the price difference between plans for the remainder of the current cycle. You will be billed the new plan’s full amount on the
  - link "next cycle’s invoice":
    - /url: /s/article/How-do-I-make-a-payment-on-my-account
  - text: .
- paragraph: For an annual plan, this means the prorated amount will cover the difference between the upgrade date and the start of the next year’s cycle.
- paragraph: For example, if your billing cycle ends in November and you upgrade in April, you will be charged a prorated amount for the difference between plans for April through November.
- paragraph:
  - text: For an upgrade from the Growth plan to the Scale plan (299 - 79), this would be a prorated charge of around
  - strong: $1,760
  - text: (220 x 8).
