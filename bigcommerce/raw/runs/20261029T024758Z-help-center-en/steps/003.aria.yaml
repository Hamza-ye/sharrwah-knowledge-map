- paragraph:
  - strong: Why does certain content in my store remain untranslated after selecting a different default language?
- paragraph: When a new store is created, sample content is generated that cannot be automatically refreshed if the store's default language is changed. These must be manually translated in order to match the changed default language.
- paragraph: "Content that does not automatically change includes:"
- list:
  - listitem:
    - link "Payment methods":
      - /url: /s/article/Online-Payment-Methods
  - listitem:
    - link "Static shipping quotes":
      - /url: /s/article/Shipping-Methods
  - listitem:
    - link "Out of delivery zone messages":
      - /url: /s/article/How-do-I-change-the-Unable-to-Ship-to-this-Location-message-on-checkout
  - listitem:
    - link "Products":
      - /url: /s/article/Adding-Products-v3
  - listitem:
    - link "Categories":
      - /url: /s/article/Product-Categories
  - listitem:
    - link "Pre-order messages":
      - /url: /s/article/Product-Availability
  - listitem:
    - link "Return reasons and actions":
      - /url: /s/article/Processing-Returns
  - listitem:
    - link "Account signup fields":
      - /url: /s/article/Editing-Form-Fields
- paragraph:
  - strong: Can I specify a dialect when selecting my store's default language?
- paragraph: Yes, some languages have multiple dialects available. However, not all dialects are supported for seamless translation in the storefront.
- paragraph:
  - text: If there is no content available for a selected dialect, such as Canadian French (
  - strong: fr-CA
  - text: ), the parent language will be used instead, such as French (
  - strong: fr
  - text: ) in our example.
- paragraph:
  - strong: Are system notifications sent to my Store Profile email address?
- paragraph:
  - text: Unless otherwise specified, system notifications are sent to the email address in the
  - emphasis: Administrator Email
  - text: field, located in
  - link "Settings › Miscellaneous":
    - /url: https://login.bigcommerce.com/deep-links/settings/store/misc
    - strong: Settings › Miscellaneous
  - text: .
- paragraph:
  - strong: How do I verify my store's email address?
- paragraph:
  - text: When updating the email address in the
  - emphasis: Email
  - text: field, a verification email is sent to the new address from
  - emphasis: accounts@bigcommerce.com
  - text: . A notification will appear in the store profile until verification is complete or the 24 hour expiration window closes.
- paragraph:
  - img "The verification notice in Store Profile Settings"
- paragraph:
  - text: Click the
  - strong: Verify email
  - text: button in the email. If you are not currently logged into your control panel, you will be taken to the login page first. Once verified, the updated store email address will take effect.
- paragraph:
  - strong: Why am I receiving a "Failed to update store profile." error message?
- paragraph:
  - text: If you receive the "Failed to update store profile" error, check your
  - emphasis: Store display name
  - text: and remove spaces from the beginning or end, and any extra spaces between words.
