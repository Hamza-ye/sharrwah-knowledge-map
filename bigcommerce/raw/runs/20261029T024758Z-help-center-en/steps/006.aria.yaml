- paragraph:
  - text: Your BigCommerce trial store gives you 15-day access to almost all of our features, including some that are only available on specific BigCommerce plans. Start your free 15-day trial today from the
  - link "BigCommerce homepage":
    - /url: https://www.bigcommerce.com/
  - text: or by logging into the
  - link "Account Dashboard":
    - /url: /s/article/Account-Dashboard
  - text: if you already have a BigCommerce store.
- link:
  - /url: "#requirements"
- heading "Requirements" [level=3]
- list:
  - listitem:
    - text: To add a new trial to an
    - link "existing account":
      - /url: "#add-to-existing"
    - text: ", you must be the"
    - link "store owner":
      - /url: /s/article/Store-Owner
    - text: .
- link:
  - /url: "#features"
- heading "Features" [level=3]
- paragraph:
  - text: To help you in setting up your entire store and have it ready to start selling the moment you choose to launch,
  - link "customer groups":
    - /url: /s/article/Customer-Groupshttps://support.bigcommerce.com/s/article/Customer-Groups
  - text: and the
  - link "Abandoned Cart Saver":
    - /url: /s/article/Using-the-Abandoned-Cart-Saver
  - text: are available on your 15-day trial. These features are only available on certain BigCommerce plans.
- paragraph:
  - text: Once you decide to upgrade to a paid store, any features not available on your plan will become unavailable unless you upgrade to the appropriate plan. Review our
  - link "pricing page":
    - /url: https://www.bigcommerce.com/essentials/pricing/
  - text: for more information on BigCommerce plans and their features. BigCommerce does not take any payment until you are ready to upgrade.
- paragraph:
  - text: The following features will be unavailable on your trial store. They are only available after
  - link "upgrading your plan":
    - /url: /s/article/How-do-I-upgrade-my-stores-plan
  - text: ", if that store plan supports them:"
