  - /url: "#setup"
- heading "Setting up PayPal" [level=3]
- paragraph:
  - strong: "1."
  - text: To connect PayPal with your store, go to
  - link "Settings › Payments":
    - /url: http://login.bigcommerce.com/deep-links/settings/payment
    - strong: Settings
    - text: ›
    - strong: Payments
  - text: ", scroll down and expand"
  - strong: Online payment methods
  - text: ", then click"
  - strong: Set up
  - text: next to PayPal.
- paragraph:
  - img "PayPal setup button in the control panel"
- paragraph:
  - strong: "2."
  - text: On the
  - strong: PayPal
  - text: settings tab, click
  - strong: Connect with PayPal
  - text: to log into your existing PayPal business account or create a new one.
- text: 
- paragraph:
  - strong: "Existing PayPal accounts and Starting Order Number:"
  - text: If you are connecting an existing PayPal account that has past transactions, you will need to change your store's
  - link "Starting Order Number":
    - /url: /s/article/Order-ID
  - text: . For more information, see our
  - link "FAQ":
    - /url: "#duplicate-invoice"
  - text: .
- paragraph:
  - strong: "3."
  - text: Click
  - strong: Grant Permission
  - text: to allow BigCommerce to connect to your PayPal account and return to the BigCommerce control panel.
- paragraph:
  - strong: "4."
  - text: Configure your
  - link "desired settings":
    - /url: "#settings"
  - text: ", then click"
  - strong: Save
  - text: to complete setup.
- link:
  - /url: "#settings"
