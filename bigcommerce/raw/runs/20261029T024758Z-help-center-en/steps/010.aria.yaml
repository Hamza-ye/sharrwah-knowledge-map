    - link "store owner":
      - /url: /s/article/Store-Owner
    - text: can access the
    - link "Account Dashboard":
      - /url: /s/article/Account-Dashboard
    - text: .
  - listitem:
    - text: To change your plan or billing frequency in the Account Dashboard, your store must be on a
    - link "Core, Growth, or Scale plan":
      - /url: https://www.bigcommerce.com/pricing/
    - text: .
    - list:
      - listitem:
        - link "Trial stores":
          - /url: /s/article/Starting-a-Bigcommerce-Trial
        - text: may also manually perform plan upgrades.
