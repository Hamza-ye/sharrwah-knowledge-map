- heading "DOWNGRADE ELIGIBILITY" [level=4]
- paragraph:
  - text: Before downgrading your plan, review each plan’s
  - link "features and fees":
    - /url: https://www.bigcommerce.com/pricing/
  - text: ", and confirm your store’s eligibility."
- paragraph:
  - text: Self-serve plan downgrade eligibility is based on your store’s Inclusive GMV, which is the store’s trailing 12-month sales volume after a 10% reduction. For more information on Inclusive GMV calculations, fees, and viewing your sales volume, see
  - link "About BigCommerce Pricing":
    - /url: /s/article/Pricing
  - text: .
- list:
  - listitem:
    - text: To downgrade from the Growth plan to Core, your GMV must be
    - strong: below $30,000
    - text: .
  - listitem:
    - text: To downgrade from the Scale plan to Growth, your GMV must be
    - strong: below $100,000
    - text: .
- text: 
- paragraph:
  - strong: "Note:"
  - text: After downgrading, if your trailing 12-month Inclusive GMV exceeds your new plan’s threshold, your store will be automatically upgraded at the start of your next billing period. Keep this in mind if your sales volume is near the plan threshold.
- heading "DOWNGRADING SELF-SERVE PLANS" [level=4]
- paragraph:
  - text: If your store is currently on a Growth or Scale plan, you can downgrade directly from the
  - link "Account Dashboard":
    - /url: "#dashboard"
  - text: . Under
  - strong: Plan summary
  - text: ", click"
  - strong: Downgrade plan
  - text: .
- text: 
- paragraph:
  - strong: "Note:"
  - text: To ensure that a downgrade processes before your next
  - link "billing cycle":
    - /url: "#billing-cycle"
  - text: ", we require plan downgrades to be submitted"
  - strong: at least 2 business days
  - text: before your next billing date.
- paragraph:
  - img "Downgrade plan highlighted in Account Dashboard"
- paragraph:
  - text: On the next page, choose an available plan and select whether you will be billed monthly or annually. After reviewing the features that will be lost by moving to a lower plan, click
  - strong: Confirm downgrade
  - text: .
- paragraph:
  - text: Note that downgrades are
  - strong: not immediate
  - text: and will take effect at the start of your next
  - link "billing cycle":
    - /url: "#faq"
  - text: . This means when switching from annual to monthly billing, your change may not take effect for up to
  - strong: 11 months
  - text: .
- paragraph:
  - img "Downgrade plan page"
- paragraph:
  - text: If you need assistance,
  - link "contact our support team":
    - /url: https://support.bigcommerce.com/s/#contact
  - text: . You will need your
  - link "Support PIN":
    - /url: /s/article/What-is-my-support-PIN-and-where-do-I-find-it
  - text: .
