  - paragraph: Emkan, a subsidiary of Al Rajhi Bank, offers the Sharia-compliant "Pay Later" service, which provides a higher number of installments, increasing your sales by up to 25% compared to other service providers. This is achieved by allowing your customers to split their purchases into 5 equal installments at cash price, enhancing their purchasing power and increasing their cart value effortlessly! Boost your sales and encourage your customers by allowing them to split their bills into 5 installments with the "Pay Later" service from Emkan—a secure payment option for your store.
  - paragraph:
    - paragraph:
      - strong: "Benefits of the \"Pay Later\" Service:"
    - list:
      - listitem: Split customer bills into 5 equal installments.
      - listitem: Increase average cart value by up to 25%.
      - listitem: Improve checkout completion rates with higher approval rates for customers.
      - listitem: Ensure consistent cash flow with periodic transfers to your store.
      - listitem: Enhance customers' purchasing power through a flexible and easy payment option.
      - listitem: Emkan absorbs the risk associated with customer payments.
      - listitem: Collaborative marketing support through social media and advertising campaigns.
    - paragraph: Activate the "Pay Later" service and grow your store today!
