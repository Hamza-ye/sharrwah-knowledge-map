- paragraph: BigCommerce offers plans that grow to fit your business's needs, whether you're just starting out, or are ready for advanced features such as stored payment methods, product filtering, or price lists. On our self-serve plans, you can choose a monthly billing cycle, or save with an annual billing cycle.
- paragraph:
  - text: As your business grows, you may want to take advantage of the
  - link "advanced features":
    - /url: https://www.bigcommerce.com/pricing/
  - text: offered as part of our Growth and Scale plans, or save by switching from monthly to annual billing. If you are interested in upgrading to the Performance plan,
  - link "contact our sales team":
    - /url: https://bigcommerce.com/contact-sales/
  - text: .
- paragraph:
  - text: BigCommerce makes it easy for stores on our
  - link "self-serve plans":
    - /url: https://www.bigcommerce.com/pricing/
  - text: to upgrade, downgrade, and change billing frequency directly in the Account Dashboard.
- text: 
- paragraph:
  - strong: Using a “Powered By” store?
  - text: If you were onboarded to BigCommerce through a partner, you must change your store plan through the account provider.
