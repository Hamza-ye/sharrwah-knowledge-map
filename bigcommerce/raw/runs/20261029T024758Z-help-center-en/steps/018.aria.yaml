- heading "FAQ" [level=3]
- paragraph:
  - strong: How many tax zones can I create?
- paragraph: There is no limit to the number of tax zones you can create on your store.
- paragraph:
  - strong: How many postal codes can I add to a tax zone?
- paragraph:
  - text: The
  - strong: Postal codes
  - text: field is limited to
  - strong: 200 characters
  - text: . If you need to add more, we recommend
  - link "creating additional tax zones":
    - /url: "#adding-zones"
  - text: .
- paragraph:
  - strong: Do I have to create zones for everywhere I don’t charge tax?
- paragraph:
  - text: No. There is a zone called “Default Zone (everywhere else).
  - strong: Do not create tax rates for this zone.
  - text: This ensures that, by default, locations that you haven’t set up a zone for will not be charged taxes.
- paragraph:
  - strong: Why am I unable to select customer groups when specifying which groups a tax zone applies to?
- paragraph:
  - text: When
  - link "assigning customer groups to a tax zone":
    - /url: "#adding-zones"
  - text: ", up to 1,000 customer groups are displayed in the list. If you see a “You have exceeded the limit of customer groups for this option.” message, your store has over 1,000 customer groups."
- paragraph:
  - text: Existing customer group selections are still applied to the tax zone, but updates are not able to be made within the control panel. To update the zone, reduce the number of customer groups below 1,000 or use the
  - link "Tax Zones API":
    - /url: https://docs.bigcommerce.com/developer/api-reference/rest/admin/management/tax/tax-zones
  - text: .
- paragraph:
  - img "Alert advising to use Tax Zones API."
- paragraph:
  - strong: How do I collect a combination of local, state, and federal tax rates?
- paragraph:
  - text: You may need to charge additional rates for a local jurisdiction in addition to a county, state, provincial or federal tax.
  - strong: However, an order will only be charged the rates of the zone it most closely corresponds to.
  - text: In other words, if a customer’s postal code matches your city zone, it will take the city zone rates but not your state zone rates, even if the city is within that state.
- paragraph:
  - text: To charge a combination of city and state rates, you will need to set up
  - strong: all applicable rates
  - text: within each zone. So if customers within a certain city need to be charged both city and state rates, you will add both.
- paragraph: "For example, if you are based in Dallas, Texas and had to charge both city and state taxes, you would create the following zones and rates:"
- list:
  - listitem:
    - text: Texas (zone)
    - list:
      - listitem: State tax (rate)
  - listitem:
    - text: Dallas (zone)
    - list:
      - listitem: State tax (rate)
      - listitem: City tax (rate)
- paragraph: "This way, a customer based in Texas outside of Dallas will be charged the Texas zone rates: a state tax. A customer based inside of Dallas will be charged the Dallas zone rates: the state and city tax."
- table:
  - rowgroup:
    - row "Example of Texas state zone with a single state tax rate Example of Dallas city tax zone, with two tax rates (city and state taxes).":
      - cell "Example of Texas state zone with a single state tax rate":
        - strong:
          - strong:
            - img "Example of Texas state zone with a single state tax rate"
      - cell "Example of Dallas city tax zone, with two tax rates (city and state taxes).":
        - img "Example of Dallas city tax zone, with two tax rates (city and state taxes)."
- paragraph:
  - strong: Can I restore my basic tax setup to its original values?
- paragraph:
  - text: Yes, this can be done from the
  - strong: General
  - text: tab in the basic tax settings area. Click the
  - strong: Reset Configuration
  - text: button to restore tax classes, rates, and zones to their default values.
- paragraph:
  - img "Reset basic tax configuration to default values."
- paragraph:
  - strong: My sales tax amount is off by a cent. Is something wrong?
- paragraph:
  - text: Basic tax calculation is done at the item line level. This can cause discrepancies when compared with tax calculated at the order level. See
  - link "Tax Overview":
    - /url: /s/article/Tax-Overview
  - text: for more information.
