- heading "Available Payment Gateways" [level=1]
- heading "What We'll Cover" [level=2]
- list:
  - listitem:
    - link "Embedded Payment Providers":
      - /url: "#embedded-providers"
  - listitem:
    - link "Open Payment Providers":
      - /url: "#open-providers"
  - listitem:
    - link "Alternative payment methods and digital wallets":
      - /url: "#apm"
  - listitem:
    - link "Accelerated Checkout solutions":
      - /url: "#accelerated-checkout"
  - listitem:
    - link "FAQ":
      - /url: "#faq"
- paragraph: BigCommerce supports a broad range of payment gateway integrations, serving numerous countries and currencies.
- paragraph: Select gateways support Alternative Payment Methods (APMs) like Alipay, Klarna, and SEPA along with leading digital wallets such as Amazon Pay, Apple Pay, and Google Pay. These options allow you to offer increased payment flexibility and popular regional methods.
- paragraph: Accelerated Checkout solutions, Fastlane by PayPal and Stripe Link, provide shoppers with low-friction, passwordless checkout experiences that reduce cart abandonment and improve conversion.
- link:
  - /url: "#embedded-providers"
- heading "Embedded Payment Providers" [level=3]
- paragraph:
  - text: Processing payments through BigCommerce gateway integrations on the
  - link "Embedded Payment Provider list":
    - /url: https://www.bigcommerce.com/payments/embedded-payment-providers/
  - strong: do not
  - text: incur
  - link "Open Payment Provider fees":
    - /url: /s/article/Pricing
  - text: . Note that custom integrations to processors on the Embedded Payment Provider list, including those connected via third-party apps, will incur Open Payment Provider fees.
- paragraph: See each gateway’s documentation for details such as requirements, limitations, setup instructions, supported countries and currencies, and additional features.
- text: 
- paragraph:
  - strong: Using a “Powered By” store?
  - text: If you were onboarded to BigCommerce through a partner, you may not have access to all listed payment gateways.
