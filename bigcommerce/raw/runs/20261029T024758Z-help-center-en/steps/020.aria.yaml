- heading "Setup" [level=4]
- paragraph: When you first create your store, your default currency is assigned based on your location. You can enable additional currencies to display prices and allow transactions where your frequent customers live.
- paragraph: If a currency code is already set up, it will not be available in the list of currency codes when setting up a new currency. Existing currencies can be edited at any time. Use the following steps to add a currency.
- text: 
- paragraph:
  - strong: "Localized Store Experiences:"
  - text: Local currency tokens are available for display in all of our supported languages. For more information on the default language store setting, see
  - link "Store Profile Settings":
    - /url: /s/article/Store-Profile-Settings
  - text: .
- paragraph:
  - strong: "1."
  - text: Go to
  - link "Settings › Currencies":
    - /url: http://login.bigcommerce.com/deep-links/settings/currencies
    - strong: Settings
    - text: ›
    - strong: Currencies
  - text: ", then click"
  - strong: Add new currency
  - text: .
- paragraph:
  - img "Click the Add new currency button to enable a currency for the store"
- paragraph:
  - strong: "2."
  - text: Select the currency code that corresponds to the currency you want to set up, then click
  - strong: Next
  - text: .
- paragraph:
  - strong: "3."
  - text: Configure your currency’s
  - link "display":
    - /url: "#display-config"
  - text: and
  - link "transactional":
    - /url: "#transactions"
  - text: settings.
- paragraph:
  - strong: "4."
  - strong: Save
  - text: your changes.
- heading "Currency Display Configurations" [level=4]
- list:
  - listitem:
    - strong: Display Name
    - text: — used to identify his currency on the storefront. For example, Canadian Dollar.
  - listitem:
    - strong: Default to [Currency Code] in these countries
    - text: — visitors in these countries will have this currency selected by default. For example, Canada.
- paragraph:
  - img "Fields to specify how the currency is named on the storefront and which countries should default to this currency"
- heading "Transactions" [level=4]
- list:
  - listitem:
    - strong: Transacting currency
    - text: — determines if the currency will be transactional or display-only. To learn more about the difference between display and transactional currencies, see our article on
    - link "Using Multiple Currencies":
      - /url: /s/article/Using-Multiple-Currencies
  - listitem:
    - strong: Exchange rate
    - text: — Currencies that are display-only have the option of having their exchange rate be static or dynamic. Transactional currencies use static conversion rates, while display-only currencies can use either static or dynamic conversion rates.
    - list:
      - listitem:
        - strong: Static
        - text: — Set the exchange rate to automatically convert your prices and shipping quotes for this currency. The rate is measured against your configured default currency. For example, 1 USD equals 1.3475 CAD. Click
        - strong: Get current rate
        - text: to retrieve the current exchange rate.
      - listitem:
        - strong: Dynamic
        - text: — BigCommerce will automatically check and update the exchange rate for this currency every 4 hours.
- paragraph:
  - img "Specify whether this should be a display or a transactional currency"
- heading "Additional Display Settings" [level=4]
- paragraph: The currency display settings affect how your store’s prices will appear when the currency is selected. The example price gives you a preview of any changes made to these settings.
- list:
  - listitem:
    - strong: Symbol
    - text: — the symbol or word for the currency. For example, $.
  - listitem:
    - strong: Symbol placement
    - text: — display the symbol to the left ($10) or the right (10$) of the price
  - listitem:
    - strong: Decimal token
    - text: — the symbol used to indicate a decimal point
  - listitem:
    - strong: Thousand token
    - text: — the symbol that denotes groups of thousands
  - listitem:
    - strong: Decimal places
    - text: — the number of decimal places that display for prices in this currency. You can display up to four decimal places.
- paragraph:
  - img "Customize how your currency displays on the storefront"
