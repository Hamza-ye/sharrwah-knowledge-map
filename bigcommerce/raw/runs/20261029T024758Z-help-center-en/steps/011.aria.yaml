  - img "Edit settings"
- heading "Disconnecting a Channel" [level=4]
- paragraph:
  - text: If you decide you no longer want to use a particular channel, from the Channel Manager overview page, click the ⋯ next to it and select
  - strong: Disconnect
  - text: .
