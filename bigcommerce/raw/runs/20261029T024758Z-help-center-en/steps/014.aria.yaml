- heading "FAQ" [level=3]
- paragraph:
  - strong: If I enable the Multi-storefront Payments page, am I able to switch back to the previous experience?
- paragraph:
  - text: Yes, to return to the legacy version of the Payments page, click the
  - strong: Switch back
  - text: button displayed in the banner at the top of
  - strong: Settings
  - text: ›
  - strong: Payments
  - text: .
- paragraph:
  - text: However, before you can switch back, you
  - strong: must
  - text: delete any additional configurations so that only one configuration exists per currency, per provider.
- paragraph:
  - img "Switch back button highlighted."
- paragraph:
  - strong: Why is the Switch back button grayed out when trying to return to the legacy Payments page?
- paragraph:
  - text: The previous experience only supports one payment configuration per currency, per provider. Ensure that you have deleted
  - strong: all
  - text: additional configurations before attempting to switch back.
- paragraph:
  - strong: Can I assign more than one configuration of the same provider and currency to a channel?
- paragraph: No. While some providers allow for multiple configurations using the same currency, you cannot assign more than one to the same channel.
- paragraph: For example, if you have two Authorize.net configurations for USD, they both cannot be assigned to the same storefront channel. You can, however, assign them to different channels.
- paragraph:
  - strong: Why is a payment configuration not appearing on my storefront?
- paragraph: By default, payment configurations are not automatically assigned to any channels and must be manually assigned. This prevents them from appearing on unintended storefronts by mistake.
- paragraph:
  - text: Ensure that you’ve
  - link "assigned the configuration":
    - /url: "#manage-configurations"
  - text: to the correct channel, then empty your storefront cart and test again.
