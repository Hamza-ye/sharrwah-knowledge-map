- heading "ACCOUNT INFORMATION" [level=4]
- paragraph:
  - img "Account information section of PayPal settings"
- list:
  - listitem:
    - strong: Account connected
    - text: — Displays the PayPal business account connected to your store.
  - listitem:
    - strong: Transaction type
    - text: — Select
    - emphasis: Authorize and capture
    - text: to automatically charge customers or
    - emphasis: Authorize only
    - text: to manually capture funds.
    - list:
      - listitem:
        - text: To learn more, see
        - link "Manually Capturing Transactions (Authorize Only)":
          - /url: /s/article/Manually-Capturing-Transactions-Authorize-Only
        - text: .
  - listitem:
    - strong: Enable Stored PayPal Accounts
    - text: — When enabled, customers can
    - link "save their PayPal account credentials":
      - /url: /s/article/Enabling-Stored-Payment-Methods
    - text: to streamlate future purchases.
    - list:
      - listitem:
        - text: Your store must be on a
        - link "Growth plan or higher":
          - /url: https://www.bigcommerce.com/pricing/
        - text: .
      - listitem:
        - text: Your store must use a supported
        - link "country and currency combination":
          - /url: https://developer.paypal.com/docs/checkout/advanced/eligibility/
        - text: .
      - listitem:
        - text: Note that enabling stored PayPal accounts will disable
        - link "Pay Later":
          - /url: "#pay-later"
        - text: .
- heading "PAYPAL WALLET" [level=4]
- paragraph:
  - img "PayPal Wallet section in PayPal settings"
- list:
  - listitem:
    - strong: Enable PayPal Checkout
    - text: — Check to add PayPal a button to product, cart, and checkout pages.
    - list:
      - listitem:
        - emphasis: PayPal
        - text: will also appear as a payment option on the payment step of checkout.
      - listitem: When enabled, shoppers will be able to pay using their PayPal account.
      - listitem:
        - text: PayPal buttons on product pages may need to be
        - link "enabled in your theme":
          - /url: "#quick-payment"
        - text: ", if supported."
  - listitem:
    - strong: Enable Pay Later button
    - text: — Check to add a
    - link "Pay Later button":
      - /url: "#pay-later"
    - text: to product, cart, and checkout pages.
    - list:
      - listitem:
        - text: Control whether the button proceeds to or bypasses the checkout page through the
        - link "Wallet button experience options":
          - /url: "#wallet-button"
        - text: .
      - listitem: Enabled by default for new stores.
      - listitem:
        - text: Note that Pay Later is disabled if
        - link "Enable Stored PayPal Accounts":
          - /url: "#account-info"
          - emphasis: Enable Stored PayPal Accounts
        - text: is checked.
        - list:
          - listitem: PayPal Business Accounts that have Billing Agreements enabled with PayPal are unable to use PayPal Pay Later method.
- heading "PAYPAL PAY LATER MESSAGING" [level=4]
- paragraph:
  - text: You can customize the appearance and location of PayPal Pay Later storefront messaging. For more information, see
  - link "PayPal Pay Later":
    - /url: "#pay-later"
  - text: .
- paragraph:
  - img "Pay Later Messaging section in PayPal settings"
- heading "CREDIT/DEBIT CARD" [level=4]
- paragraph:
  - img "Credit-debit card section in PayPal settings"
- list:
  - listitem:
    - strong: Enable credit/debit card payments through PayPal
    - text: — Check to enable credit/debit card payments at checkout.
    - list:
      - listitem:
        - text: Your store must use a supported
        - link "country and currency combination":
          - /url: https://developer.paypal.com/docs/checkout/advanced/eligibility/
        - text: .
      - listitem: If you have multiple payment gateways set up for a currency, we recommend only using one to accept credit/debit payments.
  - listitem:
    - strong: Display name
    - text: — Enter how the payment method is labeled at checkout, customer invoices, and order details.
  - listitem:
    - strong: Require card security code (CVV) for Manual orders
    - text: — Check to require CVV/CVV2/CVSD code during
    - link "manual order creation":
      - /url: /s/article/Manual-Orders
    - text: in the BigCommerce control panel.
    - list:
      - listitem: Note that this setting must be enabled to process manual orders using credit cards through PayPal.
- heading "FASTLANE BY PAYPAL" [level=4]
- paragraph: Fastlane by PayPal provides merchants with a fast, passwordless checkout solution for guest shoppers. With Fastlane, shoppers create a payment profile after making a credit card or PayPal payment, then use that profile on future orders to complete checkout with a single click.
- paragraph:
  - text: To learn more about Fastlane, its requirements, and setup instructions, see
  - link "Fastlane by PayPal":
    - /url: /s/article/Fastlane-by-PayPal
  - text: .
- paragraph:
  - img "Fastlane by PayPal section in PayPal settings"
- heading "3D SECURE" [level=4]
- paragraph:
  - img "#D Secure section in PayPal settings"
- list:
  - listitem:
    - strong: Use 3D Secure
    - text: – Check to enable
    - link "3D Secure":
      - /url: /s/article/3D-Secure
    - text: ", a payment processing security feature that requires customers to enter a password that is tied to their credit card when making a purchase."
    - list:
      - listitem:
        - text: Note that when enabled, 3d Secure will also apply to
        - link "Fastlane by PayPal":
          - /url: /s/article/Fastlane-by-PayPal
        - text: .
  - listitem:
    - strong: Strong Customer Authentication When Required
    - text: — Selecting this option only enforces Strong Customer Authentication (SCA) based on local regulations.
  - listitem:
    - strong: Strong Customer Authentication Always
    - text: — Selecting this option enforces SCA on all credit/debit card and Fastlane by PayPal transactions.
- heading "STORED CREDIT CARDS" [level=4]
- paragraph:
  - img "Stored credit cards section in PayPal settings"
- list:
  - listitem:
    - strong: Enable stored credit cards
    - text: — Check to allow customers with a
    - link "storefront account":
      - /url: /s/article/Customer-Account-Creation
    - text: to
    - link "securely save their card information":
      - /url: /s/article/Enabling-Stored-Payment-Methods
    - text: for future purchases.
    - list:
      - listitem:
        - text: Your store must be on a
        - link "Growth plan or higher":
          - /url: https://www.bigcommerce.com/pricing/
        - text: .
      - listitem:
        - text: Your store must use a supported
        - link "country and currency combination":
          - /url: https://developer.paypal.com/docs/checkout/advanced/eligibility/
        - text: .
      - listitem:
        - strong: Enable real-time account updater
        - text: — When stored credit cards are enabled, check to enable
        - link "real-time account updater":
          - /url: https://www.paypal.com/us/cshelp/article/what-is-real-time-account-updater-and-what-do-i-need-to-do-to-prepare-my-integration--ts2271
        - text: ", an optional paid service that automatically updates stored card information, such as new numbers, new expiration dates, and closed accounts."
        - list:
          - listitem: Your store must be located in the United States.
          - listitem:
            - text: Real-time account updater must first be activated in your PayPal account
            - link "Payment Preferences":
              - /url: https://www.paypal.com/businessmanage/account/paymentPreferences
            - text: .
          - listitem: Only stored Mastercard and Visa cards with United States billing addresses are supported.
          - listitem:
            - text: Real-time account updater cannot be used with
            - link "stored PayPal accounts":
              - /url: "#account-info"
            - text: .
      - listitem:
        - strong: Enable automated card delete
        - text: — When real-time account updater is enabled, check to automatically delete closed customer cards from a customer’s list of saved payment methods.
- heading "WALLET BUTTON EXPERIENCE" [level=4]
- text: 
- paragraph:
  - strong: "Note:"
  - text: PayPal wallet is limited to
  - strong: 10 shipping options
  - text: during checkout, including
  - link "BOPIS options":
    - /url: https://docs.bigcommerce.com/developer/docs/integrations/platform-solutions/buy-online-pick-up-in-store/overview
  - text: . If you offer
  - strong: more than 10 shipping and pickup options
  - text: ", select"
  - emphasis: Redirect to checkout
  - text: instead.
- paragraph:
  - img "Wallet button experience section in PayPal settings"
- list:
  - listitem:
    - strong: Pay Now
    - text: — Check to allow shoppers to bypass the checkout page when they click any PayPal button including PayPal Checkout, Pay Later, and Venmo.
    - list:
      - listitem: The shopper is redirected to the PayPal modal window to select a shipping method based on the shipping address in their PayPal account and complete payment.
      - listitem: After completing payment, shoppers are taken directly to the order confirmation page.
      - listitem: Pay Now is enabled by default for new stores.
  - listitem:
    - strong: Redirect to checkout
    - text: — Check to redirect shoppers to the checkout page when they click any PayPal button including PayPal Checkout, Pay Later, and Venmo.
- heading "POST PURCHASE" [level=4]
- text: 
- paragraph:
  - strong: "Note:"
  - text: Post purchase features are only available for stores located in Australia, Canada, France, Germany, Italy, Spain, the United Kingdom, or the United States and are enabled by default.
- paragraph:
  - img "Post purchase section in PayPal settings"
- list:
  - listitem:
    - strong: Sync order transaction statuses with PayPal
    - text: — Shares order actions and statuses in PayPal with BigCommerce.
  - listitem:
    - strong: Sync shipping and item info with PayPal
    - text: — Shares shipping and product details with PayPal.
    - list:
      - listitem:
        - text: This setting can help to shorten fund hold times, lowers your minimum account reserve, and enables
        - link "Seller Protection":
          - /url: https://www.paypal.com/us/legalhub/paypal/seller-protection
        - text: against chargebacks and claims.
      - listitem:
        - strong: Let PayPal provide package tracking to customers
        - text: — When
        - emphasis: Sync shipping and item info with PayPal is enabled
        - text: ", check to provide customers who pay with PayPal and use the"
        - link "PayPal app":
          - /url: https://www.paypal.com/us/digital-wallet
        - text: with automatic live shipping updates on packages.
  - listitem:
    - strong: Send order IDs to PayPal
    - text: — Associates a PayPal transaction to a BigCommerce order, allowing customers to provide their order ID during post-purchase communications.
    - list:
      - listitem: Note that PayPal requires order IDs to be unique.
      - listitem:
        - text: If the provided order ID has been used for a prior transaction, PayPal will
        - link "decline payments":
          - /url: "#duplicate-invoice"
        - text: .
- heading "PAYPAL SANDBOX" [level=4]
- paragraph: The PayPal sandbox can be used to test transactions on your store without using a live PayPal account.
- paragraph:
  - text: To get started, click
  - strong: Connect PayPal Sandbox
  - text: and log into your PayPal sandbox account. Note that this account is separate from your PayPal business account. If you don’t have one already, you’ll need to
  - link "create one":
    - /url: https://developer.paypal.com/tools/sandbox/accounts/
  - text: .
- paragraph:
  - img "PayPal sandbox section in PayPal settings"
- list:
  - listitem:
    - strong: Enable test mode on store
    - text: — Check to use PayPal’s sandbox to test transactions on your store.
    - list:
      - listitem:
        - text: To return to processing live transactions, uncheck the box and click
        - strong: Save
        - text: .
- paragraph:
  - text: If you need to switch to a different PayPal sandbox account, click
  - strong: Change PayPal sandbox account
  - text: .
- link:
  - /url: "#pay-later"
- heading "PayPal Pay Later" [level=3]
- paragraph: PayPal Pay Later lets customers buy now and pay over time. This feature means that the shopper will owe the money to PayPal while you, the merchant, always get paid. PayPay Pay Later also includes messaging banners that inform your customers of the installment options available at checkout. This can encourage larger purchases and increase your average order value (AOV).
- paragraph:
  - text: Note that PayPal Pay Later is displayed as
  - emphasis: PayPal Pay in 4
  - text: for AU stores,
  - emphasis: PayPal Pay in 4X
  - text: for FR stores,
  - emphasis: PayPal Pay in 3
  - text: for UK, IT, and ES stores, and
  - emphasis: PayPal Ratenzahlung
  - text: for DE stores.
- paragraph:
  - img "Example Pay Later messaging banner"
- list:
  - listitem:
    - link "Requirements":
      - /url: "#pay-later-requirements"
  - listitem:
    - link "Pay Later button":
      - /url: "#pay-later-button"
  - listitem:
    - link "Customizing Pay Later messaging":
      - /url: "#customize-messaging"
- heading "REQUIREMENTS" [level=4]
- list:
  - listitem:
    - strong: Store requirements
    - list:
      - listitem: Your store must be located in Australia, France, Germany, Italy, Spain, the United Kingdom, or the United States.
      - listitem:
        - text: Note that some activities involving PayPal Pay Later in the United Kingdom are regulated.
        - list:
          - listitem:
            - text: Before activating PayPal Pay Later buttons on your website, speak to
            - link "PayPal Business customer support":
              - /url: https://www.paypal.com/uk/business
            - text: or your PayPal Customer Success Manager for more information and to obtain the 4-digit code to unlock PayPal Pay Later for your store.
      - listitem:
        - text: "Your store must use a supported country and currency combination:"
        - list:
          - listitem: US (USD)
          - listitem: UK (GBP)
          - listitem: DE (EUR)
          - listitem: ES (EUR)
          - listitem: FR (EUR)
          - listitem: IT (EUR)
          - listitem: AU (AUD)
  - listitem:
    - strong: Shopper requirements
    - list:
      - listitem: Shoppers must use an address in Australia, France, Germany, Italy, Spain, the United Kingdom, or the United States.
      - listitem:
        - text: The shopper’s order value must be within PayPal’s supported range for their selected currency.
        - list:
          - listitem:
            - text: See “Pay Later Offers” in PayPal’s
            - link "documentation":
              - /url: https://developer.paypal.com/studio/checkout/pay-later
            - text: for each currency’s order value range.
- heading "PAY LATER BUTTON" [level=4]
- paragraph:
  - text: When
  - emphasis: Enable Pay Later button
  - link "is checked":
    - /url: "#paypal-wallet"
  - text: ", a"
  - strong: PayPal Pay Later
  - text: button will display on product, cart, and checkout pages allowing your shoppers to quickly pay using Pay Later. While the dedicated button offers a convenient option, shoppers can still select PayPal Pay Later at checkout.
- paragraph:
  - text: You can control whether the button proceeds to or bypasses the checkout page through the
  - link "options":
    - /url: "#wallet-button-experience"
  - text: under
  - strong: Wallet button experience
  - text: .
- paragraph:
  - img "Pay Later button on cart page."
- paragraph:
  - text: If you are using
  - link "Cornerstone":
    - /url: /s/article/Cornerstone-Theme-Manual
  - strong: 6.13.0
  - text: or newer, you can adjust the color, shape, and text of the PayPal Pay Later button on storefront product pages, cart page, the top of the checkout page, and the Payment step of checkout. These settings can be found in
  - link "Page Builder":
    - /url: /s/article/Page-Builder
  - text: under
  - strong: Theme Styles › Payment buttons
  - text: .
- paragraph:
  - img "Payment buttons section of Theme Styles"
- paragraph: If you are using a different theme, check your theme’s documentation to see if it supports payment button customization.
- heading "CUSTOMIZING PAY LATER MESSAGING" [level=4]
- paragraph:
  - text: The
  - strong: PayPal Pay Later Messaging
  - link "settings section":
    - /url: "#pay-later-messaging"
  - text: allows you to select which pages the messaging will appear on, as well as customize the PayPal logo type, text color, and text size to match your theme design. In the preview pane, view changes to your banners in real-time for desktops and mobile devices, and in dark mode.
- paragraph:
  - img "PayPal Pay Later Messaging settings and preview pane."
- paragraph: Note that the banner location in the preview pane provides a demonstration of how the banner may look on a specific page. The actual location will vary, depending on your theme.
- text: 
- paragraph:
  - strong: Not seeing the PayPal Pay Later messaging settings?
  - text: If you do not meet all of the eligibility
  - link "requirements":
    - /url: "#pay-later-requirements"
  - text: ", the messaging settings will not be displayed. Instead, you will see a list of requirements that still need to be met on your store before this feature will be available for use."
