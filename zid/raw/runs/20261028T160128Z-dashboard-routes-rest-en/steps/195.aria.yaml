  - img
  - heading "No ad sells like a friend" [level=4]
  - paragraph: Referred customers spend more and stay longer. Your customers gets a code, and when a friend they invite orders, both get rewarded.
  - paragraph: Referrals convert at 4.2%, compared to 1.1% for paid social
  - paragraph: Rewarding both parties lifts sharing by 20%
  - paragraph: A referred customer costs ~40% less than one acquired through paid search
  - link "Activate":
    - /url: /en-sa/stores/127604/marketing/referrals/program
  - heading "Main advantages" [level=6]
  - paragraph: Your customers become marketers automatically
  - separator
  - paragraph: Every customer gets a referral code tied to their account, with zero manual setup. The code appears right on the order confirmation page, the moment they're most excited to recommend you, lifting sharing rates by over 30%.
  - paragraph: You decide the reward and when it pays out
  - separator
  - paragraph: "Cashback as a percentage of the order, a fixed amount, or custom loyalty points, for both the referrer and their friend. And crucially: you choose when the reward is released, with a holding period that protects you against returns."
  - paragraph: Rules that protect you from abuse
  - separator
  - paragraph: Referral fraud is the most overlooked risk, it quietly destroys conversion rates and inflates your rewards bill. Set a minimum order value, limit rewards to a new customer's first order only, and cap referrals per customer or overall.
  - paragraph: Fully tracked and connected to your store data
  - separator
  - paragraph: A dashboard showing your latest referrals, top referrers, and performance metrics, with referral details surfaced inside each customer profile and order page. And your customers get notified the moment their reward lands.
