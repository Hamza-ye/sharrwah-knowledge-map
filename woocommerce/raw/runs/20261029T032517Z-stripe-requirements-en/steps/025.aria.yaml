      - button
    - paragraph:
      - text: Government entities follow a specialized onboarding and verification process that differs from standard company verification. For eligibility criteria, required documentation, and step-by-step onboarding instructions, see
      - link "Business verification requirements for government entities":
        - /url: https://support.stripe.com/questions/business-verification-requirements-for-government-entities
      - text: .
    - heading "Communicate rejection reasons" [level=4]:
      - text: Communicate rejection reasons
      - button
    - paragraph: If your platform owns onboarding and has UK-based connected accounts, you must notify your UK-based connected accounts without delay when their payments capabilities are rejected for terms of service violations or credit risk reasons.
    - paragraph: If the rejection reason is unacceptable credit risk, you must advise the connected account that they can continue accepting payments for 90 days and that we’ll hold funds in reserve to help cover any disputes or refunds.
    - paragraph:
      - text: Learn how to
      - link "determine the rejection reason and communicate it":
        - /url: /connect/risk-management/best-practices#rejection-reasons
      - text: to the affected account promptly.
