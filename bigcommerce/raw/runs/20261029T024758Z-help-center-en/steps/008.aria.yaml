- heading "Accessing the Account Dashboard" [level=3]
- paragraph:
  - text: To view invoices and make payments in the
  - link "Account Dashboard":
    - /url: /s/article/Account-Dashboard
  - text: ", navigate to"
  - link "manage.bigcommerce.com":
    - /url: http://manage.bigcommerce.com
  - text: and log into your account.
- paragraph:
  - text: If you are already logged into the control panel as the
  - link "store owner":
    - /url: /s/article/Store-Owner
  - text: ", click your"
  - strong: store name
  - text: and select
  - emphasis: Manage store account
  - text: from the drop-down menu.
- paragraph:
  - img "Store name and Manage store account highlighted"
- text: 
- paragraph:
  - strong: "Note:"
  - text: If you are unable to log into the control panel and your website is displaying a “Store Unavailable - This store is currently unavailable due to maintenance. It should be available again shortly” message, your store may be down due to unpaid invoices. To add a new payment method and pay any overdue charges, see
  - link "Paying an Invoice":
    - /url: "#paying"
  - text: .
- link:
  - /url: "#viewing"
- heading "Viewing Invoices" [level=3]
- paragraph:
  - text: In the Account Dashboard, click
  - strong: Account
  - text: and select
  - emphasis: Invoices
  - text: from the drop-down menu.
- paragraph:
  - img "Invoices highlighted in Account drop-down menu"
- text: 
- paragraph:
  - strong: Using a “Powered By” store?
  - text: If you were onboarded to BigCommerce through a partner, you will not have an invoice section in the Account Dashboard and will not receive invoices from BigCommerce.
- paragraph:
  - text: Click
  - strong: Download
  - text: next to an invoice to save it as a PDF file on your device. Open the file to view or print for your records.
- paragraph:
  - text: If your store was migrated from our legacy billing system, older invoices can be found by clicking
  - strong: Archived Invoices
  - text: .
- paragraph:
  - img "Download and Archived Invoices highlighted"
