- paragraph: The store profile provides basic information about your business, which the store uses for various features. It can affect which payment gateways are available, how your contact information appears on order invoices, and the name of your store in your BigCommerce account. Due to the wide scope of how this information is used, it is important to fill out these fields accurately for your store.
- link:
  - /url: "#how"
- heading "How It Works" [level=3]
- paragraph:
  - text: When you
  - link "create a new store":
    - /url: /s/article/Starting-a-Bigcommerce-Trial
  - text: ", the basic contact information you provide, such as the store name and email address, is added to the store profile. You can manage store information globally from"
  - link "Settings › Store profile":
    - /url: https://login.bigcommerce.com/deep-links/settings/store-profile
    - strong: Settings
    - text: ›
    - strong: Store profile
  - text: ", or you can add unique information to"
  - link "individual storefronts":
    - /url: /s/article/Multi-Storefront
  - text: from
  - link "Channels › Channel Manager":
    - /url: http://login.bigcommerce.com/deep-links/channel-manager
    - strong: Channels
    - text: ›
    - strong: Channel Manager
  - text: by clicking the storefront’s name and going to
  - strong: Storefront settings
  - text: ›
  - strong: Contact information
  - text: .
- paragraph:
  - text: If your store has
  - strong: 100,00 or more products
  - text: or you have not
  - link "enabled multi-language":
    - /url: /s/article/Localization-Settings
  - text: ", you can also"
  - link "manage locale information":
    - /url: "#locale"
  - text: for your store, such as the country where your store is located and the default language used for storefront content. These settings allow you to access region-specific payment methods and also automatically translate storefront content in
  - link "supported languages":
    - /url: "#faq"
  - text: .
- link:
  - /url: "#requirements"
- heading "Requirements" [level=3]
- list:
  - listitem:
    - text: To view and manage store profile settings, the
    - strong: Manage Settings
    - link "permission":
      - /url: /s/article/User-Permissions
    - text: must be enabled on your user account.
- link:
  - /url: "#contact-info"
- heading "Contact Information" [level=3]
- paragraph:
  - text: Go to
  - link "Settings › Store profile":
    - /url: https://login.bigcommerce.com/deep-links/settings/store-profile
    - strong: Settings
    - text: ›
    - strong: Store profile
  - text: to update or change your store's contact information. If you are using
  - link "Multi-Storefront":
    - /url: /s/article/Multi-Storefront
  - text: ", go to"
  - link "Channels › Channel Manager":
    - /url: http://login.bigcommerce.com/deep-links/channel-manager
    - strong: Channels
    - text: ›
    - strong: Channel Manager
  - text: ", click on the name of your storefront, and navigate to"
  - strong: Storefront settings
  - text: ›
  - strong: Contact information
  - text: .
- paragraph:
  - img "Contact Information in Store Profile Settings"
- list:
  - listitem:
    - strong: Store display name
    - text: — The name of your store as you want it to appear in all emails, invoices, order confirmation page, the header of your store, and on your BigCommerce account.
    - list:
      - listitem:
        - text: A blank space either before or after the store name
        - strong: cannot
        - text: be used.
  - listitem:
    - strong: Address
    - text: — The physical address of your store or place of business; appears on printed invoices and in the footer of most themes.
    - list:
      - listitem:
        - text: This field does
        - strong: not
        - text: "support HTML, and the following special characters cannot be used:"
        - strong: "< > { } ( ) \\ / '"
  - listitem:
    - strong: Address type
    - text: — Specifies whether the above address is a home or commercial office, retail store, or warehouse.
  - listitem:
    - strong: Email
    - text: — The email address used by all emails sent by the store, such as invoices and order status updates.
    - list:
      - listitem:
        - text: This should be an email using the same domain as your store, not a third-party email service like Yahoo, Gmail, or AOL. See
        - link "Customer Order Notifications":
          - /url: /s/article/Customer-Order-Notifications
        - text: for more details.
  - listitem:
    - strong: Phone
    - text: — The phone number as you wish it to appear on your storefront.
    - list:
      - listitem: If left blank, no phone number will appear.
- text: 
- paragraph:
  - strong: Pro Tip!
  - text: Stores with a visible contact number get higher conversion rates; we recommend adding your store's phone number to your homepage and contact page.
- link:
  - /url: "#locale"
- heading "Locale" [level=3]
- paragraph: The Locale settings determine your store's country and customer-facing language.
- text: 
- paragraph:
  - strong: Look different?
  - text: Stores with multiple languages enabled, including those with
  - link "Catalyst storefronts":
    - /url: /s/article/Creating-a-Catalyst-Storefront
  - text: ", configure their default country and storefront language under"
  - link "Settings › Localization":
    - /url: http://login.bigcommerce.com/deep-links/settings/localization
    - strong: Settings › Localization
  - text: . For more information, see
  - link "Localization Settings":
    - /url: /s/article/Localization-Settings
  - text: .
- paragraph:
  - img "Locale in Store Profile Settings"
- list:
  - listitem:
    - strong: Default country
    - text: — The country your store is run from, which determines the payment methods that are available for use with your store.
  - listitem:
    - strong: Default language
    - text: — The language used on the storefront; includes system messages (such as
    - link "out of stock messages":
      - /url: /s/article/Inventory-Tracking
    - text: ),
    - link "checkout payment error messages":
      - /url: /s/article/Optimized-Single-Page-Checkout
    - text: ", and"
    - link "transactional":
      - /url: /s/article/Customizing-Emails
    - text: and
    - link "abandoned cart emails":
      - /url: /s/article/Using-the-Abandoned-Cart-Saver
    - text: .
    - list:
      - listitem:
        - text: If you are using a theme based on
        - strong: Cornerstone 5.7.0 or higher
        - text: ", its language will update as well."
  - listitem:
    - strong: Enable automatic translation based on shopper's browser language
    - text: — Language is selected according to shopper's browser settings.
    - list:
      - listitem:
        - text: This overrides your selection in the
        - strong: Default language
        - text: dropdown.
- link:
  - /url: "#faq"
- heading "FAQ" [level=3]
- paragraph:
  - strong: Which countries support seamless translation in the storefront?
- paragraph:
  - text: If you create a new store based in one of the following countries, the store's content will be in your country's native language by default. All other countries and languages require theme
  - link "lang file customization":
    - /url: https://docs.bigcommerce.com/developer/docs/storefront/stencil/themes/localization/stores
  - text: .
