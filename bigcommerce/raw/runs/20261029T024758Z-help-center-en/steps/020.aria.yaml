- heading "Managing Currencies" [level=1]
- heading "What We'll Cover" [level=2]
- list:
  - listitem:
    - link "Requirements":
      - /url: "#requirements"
  - listitem:
    - link "Adding a currency":
      - /url: "#add"
  - listitem:
    - link "Changing your default currency":
      - /url: "#default"
  - listitem:
    - link "FAQ":
      - /url: "#faq"
- paragraph: Your store’s currency settings influence how your product prices appear on the storefront, which payment methods are available at checkout, and how shipping, tax, and discounts are calculated on orders. Displaying product prices and the checkout in your customers’ local currencies provides a more familiar shopping experience and can increase conversion when expanding your store to a new region.
- paragraph:
  - text: In this article, you’ll learn how to add currencies to your store, update your store’s default currency, and manage how prices appear on your storefront when a specific currency is selected. For more information on how multicurrency works in BigCommerce, see
  - link "Using Multiple Currencies":
    - /url: /s/article/Using-Multiple-Currencies
  - text: .
- link:
  - /url: "#requirements"
- heading "Requirements" [level=3]
- paragraph:
  - text: In order to manage the currency settings in your store, you must have the
  - strong: Manage Settings
  - link "permission":
    - /url: /s/article/User-Permissions
  - text: enabled on your user account. This is enabled by default for users with the
  - strong: Store Administrator
  - text: or
  - link "Store Owner":
    - /url: /s/article/Store-Owner
    - strong: Store Owner
  - text: role.
- paragraph:
  - text: To learn more about the requirements for offering multiple transactional currencies in your store, see
  - link "Using Multiple Currencies":
    - /url: /s/article/Using-Multiple-Currencies
  - text: .
- link:
  - /url: "#add"
