- heading "WEBSITE" [level=4]
- paragraph:
  - text: Configure your physical dimension settings, default SEO metadata, sitewide HTTPS, and robots.txt file under
  - strong: Settings › Website.
- paragraph:
  - strong: Physical Dimension Settings
- paragraph:
  - text: Physical dimension settings allow you to specify the measurement units your store uses for product weight and volume, choose the display style for decimals, and assign a factoring dimension for calculating shipping costs. For more information, see
  - link "Physical Dimension Settings and the Shipping Calculator":
    - /url: /s/article/Physical-Dimension-Settings
  - text: .
- text: 
- paragraph:
  - strong: Look different?
  - text: Stores with multiple languages enabled configure their physical dimensions under
  - strong: Settings › Localization
  - text: . For more information, see
  - link "Localization Settings":
    - /url: /s/article/Localization-Settings
  - text: .
- paragraph:
  - strong: Search Engine Optimization
- paragraph:
  - text: Under Search engine optimization settings, enter the SEO metadata for your store’s homepage as well as your custom domain’s www redirect preference. For more information, see
  - link "SEO Fields":
    - /url: /s/article/SEO-Fields
  - text: .
- text: 
- paragraph:
  - strong: "Multi-Storefront:"
  - text: If you have
  - link "Multi-Storefront":
    - /url: /s/article/Multi-Storefront
  - text: (MSF) enabled on your store, the storefront SEO settings found in Channel Manager will take priority and override global SEO store settings. This allows each storefront to have its own SEO strategy.
- paragraph:
  - strong: HTTPS
- paragraph:
  - text: By default, BigCommerce stores have sitewide HTTPS already enabled. For more information, see
  - link "Sitewide HTTPS":
    - /url: /s/article/Site-Wide-HTTPS
  - text: .
- paragraph:
  - strong: Search Engine Robots
- paragraph:
  - text: The robots.txt file is a tool that helps improve your SEO and reduce server load by providing instructions to search engine and AI bot crawlers on when and where they can crawl your site. For more information, see
  - link "Robots.txt File":
    - /url: /s/article/Understanding-the-Robots-txt-File
  - text: .
- heading "DISPLAY" [level=4]
- paragraph:
  - text: Configure your storefront, control panel, category, and product display settings under
  - strong: Settings › Display.
- paragraph:
  - strong: Display Settings
- paragraph:
  - text: Manage the general display behavior of multiple areas of the storefront, such as the cart page, customer account pages, and product listings. For more information, see
  - link "Display Settings":
    - /url: /s/article/Display-Settings
  - text: .
- paragraph:
  - strong: Control Panel
- paragraph: Configure the display options for the control panel text editor and product thumbnails in your product list.
- paragraph: "For more information, see:"
- list:
  - listitem:
    - link "Using the WYSIWYG Editor":
      - /url: /s/article/Using-the-WYSIWYG-Editor
  - listitem:
    - link "Product List":
      - /url: /s/article/Product-List
- paragraph:
  - strong: Category Settings
- paragraph:
  - text: The Category Settings section allows you to manage which products are displayed on category pages, how they are sorted, and the display depth in your store’s navigation menu. For more information, see the “Category Settings” section of
  - link "Product Categories":
    - /url: /s/article/Product-Categories
  - text: .
- paragraph:
  - strong: Product Settings
- paragraph:
  - text: Configure options for product attributes, including pricing presentation, SKU, weight, customer rating visibility, and more. For more information, see
  - link "Product Display Settings":
    - /url: /s/article/Product-Display-Settings
  - text: .
- heading "IMAGE" [level=4]
- paragraph:
  - text: Image settings allows you to set image sizes and related settings for Blueprint themes. To navigate to your store's Image settings go to
  - strong: Settings
  - text: ›
  - strong: Images
  - text: . For a complete list of Blueprint image settings, see
  - link "Blueprint Themes":
    - /url: /s/article/Blueprint-Themes
  - text: .
- text: 
- paragraph:
  - strong: Don't see the Images tabs?
  - text: Stencil themes control product image sizes in
  - link "Page Builder":
    - /url: /s/article/Page-Builder
  - text: . Stores with a Stencil theme enabled won't see the Images tab.
- heading "SHARE" [level=4]
- paragraph:
  - text: Under
  - strong: Settings › Share
  - text: ", manage the displayed social media icons on product and blog pages as well as enable or disable Pinterest Rich Pins."
- paragraph: "For more information, see:"
- list:
  - listitem:
    - link "Adding Social Media Links":
      - /url: /s/article/Social-Media-Links
  - listitem:
    - link "Advertising with Pinterest":
      - /url: /s/article/Advertising-with-Pinterest
- text: 
- paragraph:
  - strong: Looking to connect to a sales or marketing channel?
  - text: Channel Manager allows you to connect and manage different sales and marketing channels. For more details, including the available options, see
  - link "Selling Everywhere with Channel Manager":
    - /url: /s/article/Selling-Everywhere-with-Channel-Manager
  - text: .
- heading "DATE & TIMEZONE" [level=4]
- paragraph:
  - text: Manage the internal time tracking used in your store's control panel under
  - strong: Settings › Date & Timezone
  - text: . These settings affect time-related features, such as order timestamps and promotion start or end dates. For more information, see
  - link "Date and Timezone Settings":
    - /url: /s/article/Date-and-Timezone-Settings
  - text: .
- text: 
- paragraph:
  - strong: Look different?
  - text: Stores with multiple languages enabled configure their date and timezone under
  - strong: Settings › Localization
  - text: . For more information, see
  - link "Localization Settings":
    - /url: /s/article/Localization-Settings
  - text: .
- heading "URL STRUCTURE" [level=4]
- paragraph:
  - text: Adjust your store’s URL structures for products, categories, and web pages under
  - strong: Settings › URL Structure
  - text: . For more information, see the “URL Structure” section of
  - link "SEO Fields":
    - /url: /s/article/SEO-Fields
  - text: .
- heading "SEARCH" [level=4]
- paragraph:
  - text: Configure the built-in storefront search results sort order and search logic under
  - strong: Settings
  - text: ›
  - strong: Search
  - text: . For more information see
  - link "Configuring Store Search":
    - /url: /s/article/Store-Search
  - text: .
- paragraph:
  - text: Stores using Stencil themes can customize the search results page appearance in
  - link "Page Builder":
    - /url: /s/article/Page-Builder
  - text: . Additional options are also available for themes based on
  - link "Cornerstone":
    - /url: /s/article/Cornerstone-Theme-Manual
  - text: .
- text: 
- paragraph:
  - strong: Stores using a legacy Blueprint theme will see additional search display settings.
  - text: For more information on these settings, see
  - link "Blueprint Themes":
    - /url: /s/article/Blueprint-Themes
  - text: .
- heading "SECURITY & PRIVACY" [level=4]
- paragraph:
  - text: Manage various aspects of your store such as shopper password complexity, inactivity thresholds, reCAPTCHA, and privacy under
  - strong: Settings › Security & Privacy
  - text: .
- paragraph:
  - text: For a detailed overview of the security settings available for your store, see
  - link "Security and Privacy Settings":
    - /url: /s/article/Security-and-Privacy-Settings
  - text: .
- heading "MISCELLANEOUS" [level=4]
- paragraph:
  - text: Various additional store settings can be accessed under
  - strong: Settings
  - text: ›
  - strong: Miscellaneous
  - text: .
- paragraph:
  - strong: Email Settings
- paragraph: Manage several email related features, including product reviews, order invoice forwarding, custom SMTP settings, system notification address, and Abandoned Cart Saver.
- paragraph: "For information on the supported features, see:"
- list:
  - listitem:
    - link "Managing Reviews":
      - /url: /s/article/Managing-Reviews
  - listitem:
    - link "Order Notifications":
      - /url: /s/article/Order-Notifications
  - listitem:
    - link "Email in BigCommerce":
      - /url: /s/article/Email-in-BigCommerce
  - listitem:
    - link "Using the Abandoned Cart Saver":
      - /url: /s/article/Using-the-Abandoned-Cart-Saver
- paragraph:
  - strong: Advanced Store Settings
- paragraph:
  - text: Enable and disable cart and checkout availability on your storefront using the
  - emphasis: Allow Purchasing
  - text: checkbox under
  - strong: Advanced Store Settings
  - text: . For more information on product purchasability and availability, see
  - link "Managing Product Availability":
    - /url: /s/article/Product-Availability
  - text: .
- paragraph:
  - strong: Order Settings
- paragraph:
  - text: Set your store’s starting order number, controlling the values of the next and subsequent orders. For more information, see
  - link "Understanding Order IDs":
    - /url: /s/article/Order-ID
  - text: .
- paragraph:
  - strong: Product review rate limiting
- paragraph:
  - text: Manage the allowed frequency of customer product reviews. For more information, see
  - link "Managing Reviews":
    - /url: /s/article/Managing-Reviews
  - text: .
