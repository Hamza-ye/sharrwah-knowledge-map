- heading "Using Wildcards" [level=4]
- paragraph: The Postal Codes field supports the use of the wildcards * and ?.
- paragraph: Using an asterisk (*) will capture all numbers from its position in the postal code all the way to the right. For example, entering 335* will capture all postal codes ranging from 33500 through 33599.
- paragraph:
  - text: Using a question mark (?) will capture numbers 0-9
  - strong: only
  - text: in the position that the question mark is placed. For example, entering 335?1 will capture 33501 through 33591.
- paragraph: "To capture all variations of a specific postal code, such as for ZIP+4 postal codes, enter the base code on one line, then the base code with an asterisk on the next line, like so:"
- list:
  - listitem: "53927"
  - listitem: 53927*
  - listitem: "53934"
  - listitem: 53934*
  - listitem: "53910"
  - listitem: 53910*
