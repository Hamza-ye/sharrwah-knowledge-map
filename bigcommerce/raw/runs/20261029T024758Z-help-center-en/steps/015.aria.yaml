- paragraph: Choosing a checkout configuration that matches your business needs can help enhance the shopper experience and improve conversion rates. Depending on your storefront setup, there are several different checkout configurations options available to you.
- paragraph:
  - img "Chart showing checkout configurations for Stencil and headless storefronts."
- paragraph: Use this article to guide you and your development team in selecting the best configuration for your store’s checkout environment.
- link:
  - /url: "#comparison"
- heading "Checkout Comparison" [level=3]
- paragraph: This section compares the various checkout configurations available for storefronts, and highlights the benefits and potential limits associated with each checkout option.
- paragraph:
  - text: We recommend determining which type of storefront you will be using (
  - link "Stencil":
    - /url: /s/article/The-Stencil-Theme-Platform
  - text: versus
  - link "headless":
    - /url: https://docs.bigcommerce.com/docs/storefront/headless
  - text: or
  - link "composable":
    - /url: https://docs.bigcommerce.com/docs/storefront
  - text: ), before reviewing the available checkout configurations so you can select the one that best matches your store’s technical requirements.
- table:
  - rowgroup:
