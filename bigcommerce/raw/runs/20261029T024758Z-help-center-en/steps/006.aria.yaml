- heading "Creating a Trial Store" [level=3]
- paragraph:
  - text: If you are new to BigCommerce, create a trial store by going to the
  - link "BigCommerce homepage":
    - /url: https://www.bigcommerce.com/essentials/
  - text: and clicking
  - strong: Try for free
  - text: in the upper right. If you have an existing BigCommerce account, add your new store from the
  - link "Account Dashboard":
    - /url: "#add-to-existing"
  - text: .
- paragraph:
  - img "Try for free button on the BigCommerce homepage"
- paragraph: Fill out the form by providing your name, email address, a password, store name, the size of your business, and the region your store should be hosted. Note that the store name can be changed at any time after starting your trial.
- text: 
- paragraph:
  - strong: Once you have selected a hosting region for your trial store, it cannot be changed.
  - text: To ensure optimal site speed and performance, select the region nearest to your prospective customers.
- paragraph:
  - img "The BigCommerce new trial store form"
- paragraph:
  - text: When you're ready, click
  - strong: Start your free trial
  - text: . Before you can
  - link "log into your new store":
    - /url: /s/article/Logging-Into-Your-Store
  - text: ", you’ll need to enter a security code sent to your email address."
- link:
  - /url: "#login"
- heading "First Login" [level=3]
- paragraph:
  - text: On your first login to your store’s
  - link "control panel":
    - /url: /s/article/Getting-Started-with-the-New-Control-Panel
  - text: ", you'll be prompted to answer some questions about your business in order to personalize an onboarding checklist."
- paragraph:
  - img "Onboarding questions in the BigCommerce control panel"
- paragraph: After submitting your answers, you will be taken to your store’s dashboard, which will list the next steps to get your store up and running.
- paragraph:
  - img "The onboarding checklist in the dashboard"
- paragraph:
  - text: You can work on other store setup tasks before completing the onboarding checklist by navigating to other areas of the control panel. To return to the checklist on the dashboard, click
  - link "Home":
    - /url: https://login.bigcommerce.com/deep-links/dashboard
    - strong: Home
  - text: .
- paragraph:
  - text: See our
  - link "Store Launch Guide":
    - /url: /s/article/Getting-Started-Introduction
  - text: for more information on preparing your store for launch. If you're more interested in getting your trial up and running quickly for testing, refer to our
  - link "Quickstart Guide":
    - /url: /s/article/Quickstart-Guide
  - text: .
- link:
  - /url: "#add-to-existing"
- heading "Adding a New Trial Store to an Existing Account" [level=3]
- paragraph:
  - text: If you already have a paid store or trial, you can add a new trial to your existing account directly from your
  - link "BigCommerce Account Dashboard":
    - /url: /s/article/Account-Dashboard
  - text: . Note that only the
  - link "store owner":
    - /url: /s/article/Store-Owner
  - text: can access the Account Dashboard.
- paragraph:
  - text: To reach the dashboard from within the
  - link "control panel":
    - /url: /s/article/Getting-Started-with-the-New-Control-Panel
  - text: ", click your"
  - strong: store name
  - text: in the top left and select
  - emphasis: Manage store account
  - text: . The BigCommerce Account Dashboard can also be accessed directly by going to
  - link "manage.bigcommerce.com":
    - /url: https://manage.bigcommerce.com/
  - text: .
- paragraph:
  - img "Store name and Manage store account highlighted"
- paragraph:
  - text: Once you're in the account dashboard, click
  - strong: New Store
  - text: .
- paragraph:
  - img "The New Store button in the BigCommerce Account Dashboard"
- paragraph:
  - text: Enter details about the new trial store, then click
  - strong: Save
  - text: . After a few seconds, your new trial store will be created. From here, you can log into the new store's control panel or view its details.
- paragraph:
  - img "Once your new trial is created, you can log in or view its details"
- text: 
- paragraph:
  - strong: New store login issues.
  - text: If you are unable to log into your newly created trial store,
  - link "contact our support team":
    - /url: https://support.bigcommerce.com/s/#contact
  - text: .
- link:
  - /url: "#launch-store"
- heading "Launching Your Store" [level=3]
- paragraph:
  - text: All BigCommerce trials are not visible to the public when they are created. This keeps search engines and other bots from indexing your store and people from browsing your store before it is ready. However, store admins and select visitors can view the storefront before launch. For more details, see
  - link "Previewing a Store Before Launch":
    - /url: /s/article/Previewing-a-Store-Before-Launch
  - text: .
- paragraph:
  - text: When you’re ready to make your store live, go to
  - link "Channels":
    - /url: http://login.bigcommerce.com/deep-links/channel-manager
    - strong: Channels
  - text: and select
  - strong: Make active
  - text: from the
  - strong: Action
  - text: menu (
  - strong: ⋯
  - text: ) next to your storefront.
- paragraph:
  - img "Select Make active for your storefront to make your store go live."
- link:
  - /url: "#cancelling"
- heading "Cancelling a Trial Store" [level=3]
- paragraph: There is no action needed to cancel a trial store. The trial will automatically expire after the 15-day trial period. You will never be billed for a trial store.
- paragraph: After your trial expires, BigCommerce will keep your store data for a period of 30 days before it is automatically deleted. If you want to restore your trial store before it is deleted, log in to the store and reactivate it by upgrading to a paid plan.
- paragraph:
  - text: To start a new trial on an account with no stores available,
  - link "contact our support team":
    - /url: https://support.bigcommerce.com/s/#contact
  - text: for assistance. If you have active stores on the same account as your deleted trial store, it will no longer appear in the account’s list of stores on the login page.
- link:
  - /url: "#troubleshooting"
- heading "Troubleshooting Failed Trial Creation" [level=3]
- list:
  - listitem:
    - link "Common causes for trial failure":
      - /url: "#common-causes"
  - listitem:
    - link "Common errors":
      - /url: "#common-errors"
- heading "COMMON CAUSES FOR TRIAL FAILURE" [level=4]
- paragraph: The trial store form may fail to send if there is an issue with your device or the data you provided. If you are unable to create a new trial, review the potential causes below to determine if it is responsible for your issue.
- list:
  - listitem: If you have an active VPN on your device, make sure you disable it before filling out and submitting your form. This is the most common reason for failed trial creation.
  - listitem: Make sure that you are entering your actual business information in the form instead of placeholder data.
  - listitem: If you have an existing BigCommerce account, you must enter the same email and password you currently use if you are creating a new trial with the form.
  - listitem: Complete all steps from a single device. For example, if you begin the trial creation process on your mobile device and then switch to a laptop to finish, the trial creation will fail.
- paragraph:
  - text: If you are having issues with logging in to your trial store after creating it successfully, see the “Troubleshooting” section of
  - link "Logging in to Your Store":
    - /url: /s/article/Logging-Into-Your-Store
  - text: for guidance.
