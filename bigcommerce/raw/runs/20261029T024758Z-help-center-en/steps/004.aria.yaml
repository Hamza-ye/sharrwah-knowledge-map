- heading "STORE PROFILE" [level=4]
- paragraph:
  - text: Provide basic information about your business, such as the store name, contact information, default country, and the default storefront language under
  - strong: Settings › Store profile
  - text: . For more information, see
  - link "Store Profile Settings":
    - /url: /s/article/Store-Profile-Settings
  - text: .
- text: 
- paragraph:
  - strong: Look different?
  - text: Stores with multiple languages enabled configure their default country and storefront language under
  - strong: Settings › Localization
  - text: . For more information, see
  - link "Localization Settings":
    - /url: /s/article/Localization-Settings
  - text: .
- heading "LOCALIZATION SETTINGS" [level=4]
- paragraph:
  - text: Stores with multiple languages enabled configure their default country, storefront language, physical dimensions, and date and timezone under
  - strong: Settings › Localization
  - text: . For more information, see
  - link "Localization Settings":
    - /url: /s/article/Localization-Settings
  - text: .
- heading "CURRENCIES" [level=4]
- paragraph:
  - text: Configure which currencies appear on your store, their exchange rates, storefront channels, and display settings under
  - strong: Settings › Currencies.
  - text: For instructions on enabling currencies in your store, see
  - link "Managing Currencies":
    - /url: /s/article/Managing-Currencies
  - text: . To learn more about how multicurrency works in your store, see
  - link "Using Multiple Currencies":
    - /url: /s/article/Using-Multiple-Currencies
  - text: .
- heading "PAYMENTS" [level=4]
- paragraph:
  - text: Manage payment integration connections, offline payment methods, and select digital wallets under
  - strong: Settings › Payments
  - text: .
- paragraph: "For more information, see:"
- list:
  - listitem:
    - link "Available Payment Gateways":
      - /url: /s/article/Available-Payment-Gateways
  - listitem:
    - link "Introduction to Alternative Payment Methods":
      - /url: /s/article/Intro-to-APMs
  - listitem:
    - link "Offline Payment Methods":
      - /url: /s/article/Offline-Payment-Methods
- heading "LOCATIONS" [level=4]
- paragraph:
  - text: Manage Buy Online, Pick up in Store (BOPIS) physical location details under
  - strong: Settings › Locations
  - text: . For more information, see
  - link "Multi-Location":
    - /url: /s/article/Multi-Location
  - text: .
- heading "PICK UP METHODS" [level=4]
- paragraph:
  - text: Configure Buy Online, Pick up in Store (BOPIS) pick up methods and assign to locations under
  - strong: Settings › Pick up methods
  - text: . For more information, see
  - link "Multi-Location":
    - /url: /s/article/Multi-Location
  - text: .
- heading "SHIPPING" [level=4]
- paragraph:
  - text: Enter your shipping origin address as well as configure and manage shipping zones, methods, and rates under
  - strong: Settings › Shipping
  - text: .
- paragraph: "For more information, see:"
- list:
  - listitem:
    - link "Shipping Setup":
