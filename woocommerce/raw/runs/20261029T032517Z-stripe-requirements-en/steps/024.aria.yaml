    - heading "Additional information" [level=2]
    - heading "Additional tax information" [level=4]:
      - text: Additional tax information
      - button
    - paragraph:
      - text: If Stripe can’t verify the
      - code: company.tax_id
      - text: ", upload a copy of"
      - link "an IRS Letter 147C document or an IRS SS-4 confirmation letter":
        - /url: https://support.stripe.com/questions/using-irs-documentation-as-reference-when-entering-business-name-and-tax-id-number-tin-for-us-based-businesses
      - text: using the
      - link "company.verification.document.front":
        - /url: /api/accounts/object#account_object-company-verification-document-front
      - text: parameter. The document must include the connected account’s
      - code: company.name
      - text: and
      - code: company.tax_id
      - text: .
    - heading "Additional information on the account" [level=4]:
      - text: Additional information on the account
      - button
    - paragraph:
      - text: Enabling card payments requires a validated city, state, and postal code for
      - code: company.address
      - text: . It also requires the
      - code: company.tax_id
      - text: (EIN) within 30 days or before 1,500 USD in payments, whichever comes first. If Stripe can’t verify the EIN before the deadline, we disable card payments.
    - paragraph:
      - text: Enabling
      - link "payouts":
        - /url: /payouts
      - text: ", requires a validated full"
      - code: company.address
      - text: and
      - code: company.tax_id
      - text: (EIN) within 30 days. Stripe disables payouts if we haven’t verified the full address or the
      - code: company.tax_id
      - text: before the deadline.
    - heading "Additional information on the representative" [level=4]:
      - text: Additional information on the representative
      - button
    - paragraph:
      - text: A
      - link "Person":
        - /url: /api/persons
      - text: known as a representative must activate this connected account. The representative must have significant responsibility to control, manage, or direct the organization, and must be authorized by the organization to agree to Stripe’s terms. The representative must be either
      - link "an owner or an executive":
        - /url: https://support.stripe.com/questions/beneficial-owner-and-director-definitions
      - text: ", which you specify by setting"
      - link "relationship.owner":
        - /url: /api/persons/object#person_object-relationship-owner
      - text: or
      - link "relationship.executive":
        - /url: /api/persons/object#person_object-relationship-executive
      - text: to true.
    - paragraph:
      - text: If the representative fails verification with
      - code: ssn_last_4
      - text: ", then enabling card payments requires verifying their full SSN and their identity. Upload their full SSN using the"
      - link "person.id_number":
        - /url: /api/persons/update#update_person-id_number
      - text: parameter.
    - paragraph:
      - text: If Stripe can’t verify the representative, or if the person doesn’t have an SSN, then enabling card payments requires you to provide a scan of an
      - link "ID document":
        - /url: /connect/handling-api-verification#acceptable-verification-documents
      - text: . Upload the front and back of the document using the
      - link "verification.document.front":
        - /url: /api/persons/object#person_object-verification-document-front
      - text: and
      - link "verification.document.back":
        - /url: /api/persons/object#person_object-verification-document-back
      - text: parameters.
    - heading "Additional information for minors" [level=4]:
      - text: Additional information for minors
      - button
    - paragraph:
      - text: If the account representative is a minor, you must verify the minor’s legal guardian. A legal guardian is a
      - link "Person":
        - /url: /api/persons
      - text: object on the account with
      - link "relationship.legal_guardian":
        - /url: /api/persons/create#create_person-relationship-legal_guardian
      - text: set to
      - code: "true"
      - text: . Additionally, the legal guardian must provide their information and sign the Stripe terms of service, which we store on the
      - code: Person
      - text: object that represents the guardian. Store the legal guardian’s terms of service acceptance in the
      - link "additional_tos_acceptances":
        - /url: /api/persons/create#create_person-additional_tos_acceptances
      - text: hash.
    - paragraph:
      - text: If the legal guardian fails verification with their
      - code: ssn_last_4
      - text: ", then enabling card payments requires verifying their full SSN and their identity. Upload their full SSN using the"
      - link "person.id_number":
        - /url: /api/persons/update#update_person-id_number
      - text: parameter.
    - paragraph:
      - text: If Stripe can’t verify the legal guardian, or if the person doesn’t have an SSN, then enabling card payments requires you to provide a scan of an
      - link "ID document":
        - /url: /connect/handling-api-verification#acceptable-verification-documents
      - text: . Upload the front and back of the document using the
      - link "verification.document.front":
        - /url: /api/persons/object#person_object-verification-document-front
      - text: and
      - link "verification.document.back":
        - /url: /api/persons/object#person_object-verification-document-back
      - text: parameters.
    - heading "Additional information on owners" [level=4]:
      - text: Additional information on owners
      - button
    - paragraph:
      - text: You must collect information on all
      - link "owners":
        - /url: https://support.stripe.com/questions/beneficial-owner-and-director-definitions
      - text: who have 25% or more ownership of the company, represented by
      - link "Person":
        - /url: /api/persons
      - text: objects on the account. When you finish collecting the required owner information, you must set
      - link "company.owners_provided":
        - /url: /api/accounts/update#update_account-company-owners_provided
      - text: to true.
    - paragraph: "If the company has any unverified 25% owners, Stripe can disable payouts on the connected account when it reaches 750,000 USD in charges. To avoid disabling payouts, you must collect the following information for all 25% owners:"
    - list:
      - listitem:
        - link "address":
          - /url: /api/persons/update#update_person-address
      - listitem:
        - link "dob.day":
          - /url: /api/persons/update#update_person-dob-day
      - listitem:
        - link "dob.month":
          - /url: /api/persons/update#update_person-dob-month
      - listitem:
        - link "dob.year":
          - /url: /api/persons/update#update_person-dob-year
      - listitem:
        - link "id_number":
          - /url: /api/persons/update#update_person-id_number
      - listitem:
        - link "phone":
          - /url: /api/persons/update#update_person-phone
    - paragraph:
      - text: If Stripe can’t verify an owner, or if an owner doesn’t have an SSN, you must provide a scan of an
      - link "ID document":
        - /url: /connect/handling-api-verification#acceptable-verification-documents
      - text: for them. Upload the front and back of the document using the
      - link "verification.document.front":
        - /url: /api/persons/object#person_object-verification-document-front
      - text: and
      - link "verification.document.back":
        - /url: /api/persons/object#person_object-verification-document-back
      - text: parameters.
    - paragraph:
      - text: Optionally, you can collect company ownership information by setting
      - link "relationship.owner":
        - /url: /api/persons/object#person_object-relationship-owner
      - text: to true and
      - link "relationship.percent_ownership":
        - /url: /api/persons/object#person_object-relationship-percent_ownership
      - text: to the person’s ownership percentage. If you don’t specify
      - code: relationship.percent_ownership
      - text: ", it defaults to 25%."
    - heading "Supported business structures" [level=4]:
      - text: Supported business structures
      - button
    - paragraph:
      - text: Optionally, you can provide information on the
      - link "legal structure":
        - /url: /connect/identity-verification#business-structure
      - text: of your connected account’s business using the
      - link "company.structure":
        - /url: /api/accounts/create#create_account-company-structure
      - text: parameter.
    - paragraph: "Stripe supports the following business structures for privately held companies:"
    - list:
      - listitem:
        - code: multi_member_llc
      - listitem:
        - code: single_member_llc
      - listitem:
        - code: private_partnership
      - listitem:
        - code: private_corporation
      - listitem:
        - code: unincorporated_association
    - paragraph:
      - text: Stripe supports the following business structures for publicly traded companies. If you assign either of these structures to the business, then the
      - link "representative":
        - /url: "#additional-company-card-representative-us"
      - text: doesn’t need to be an owner or an executive, and you don’t need to provide information on additional owners.
    - list:
      - listitem:
        - code: public_corporation
      - listitem:
        - code: public_partnership
    - heading "Tax reporting information" [level=4]:
      - text: Tax reporting information
      - button
    - paragraph:
      - text: By default, the requirements for
      - code: transfers
      - text: don’t collect all information at the appropriate thresholds to file IRS Form 1099-K or Form 1099-MISC. If your business has US federal 1099 filing requirements and plans to file these through Stripe, request the
      - link "appropriate tax reporting capability":
        - /url: /connect/account-capabilities?accounts-namespace=v1#tax-reporting
      - text: and make sure to collect the
      - link "necessary information":
        - /url: /connect/required-verification-information-taxes
      - text: from your users.
    - heading "Threshold information" [level=4]:
      - text: Threshold information
      - button
    - paragraph:
      - text: In addition to the onboarding requirements, payouts require that you provide your connected account’s
      - code: company.tax_id
      - text: (EIN) before its charges reach a certain threshold. The threshold is either 10,000 USD or 3,000 USD, depending on your industry and Stripe’s review of your platform profile. If Stripe can’t verify your connected account’s EIN before it reaches the threshold, we disable payouts.
    - heading "Payments threshold information" [level=4]:
      - text: Payments threshold information
      - button
    - paragraph:
      - text: When a connected account with
      - code: card_payments
      - text: reaches 500,000 USD in lifetime charges, we’ll collect the last four digits of their SSN or ITIN for US-resident owners and attempt to programmatically obtain the full nine digit SSN for them. If we’re unable to obtain the full number using information provided, the User will need to provide the full nine digits. If the full number has already been provided, it isn’t needed again.
    - paragraph:
      - text: For connected accounts with
      - code: business_type
      - text: set to
      - code: individual
      - text: ", and where the owner isn’t a minor, update the"
      - code: Account
      - text: ’s
      - link "individual.id_number":
        - /url: /api/accounts/update#update_account-individual-id_number
      - text: . For other accounts, which have persons with
      - code: relationship.legal_guardian
      - text: ","
      - code: relationship.representative
      - text: ", or"
      - code: relationship.owner
      - text: set to true, update the appropriate
      - code: Person
      - text: ’s
      - link "id_number":
        - /url: /api/persons/update#update_person-id_number
      - text: .
    - heading "Support phone number" [level=4]:
      - text: Support phone number
      - button
    - paragraph:
      - text: For accounts without access to a Stripe-hosted dashboard, and where Stripe is responsible for negative balances, activating
      - code: card_payments
      - text: requires
      - code: business_profile.support_phone
      - text: .
