- link:
  - /url: "#fastlane"
- heading "Fastlane by PayPal" [level=3]
- paragraph: Fastlane by PayPal provides merchants with a fast, passwordless checkout solution for guest shoppers. With Fastlane, shoppers create a payment profile after making a credit card or PayPal payment, then use that profile on future orders to complete checkout with a single click.
- paragraph:
  - img "The toggle for shoppers to save their payment information in a Fastlane profile"
- paragraph: After completing the order, the shopper will receive an email confirming that their Fastlane profile has been created. When they enter their email address during subsequent checkouts, they will be prompted to enter a verification code sent to their mobile device.
- paragraph:
  - img "The verification popup for shoppers to use their Fastlane profile at checkout"
- paragraph: If a shopper has a PayPal account associated with their email address and has not yet created a Fastlane profile, they will be prompted to create one when entering their email address at the beginning of checkout, rather than after selecting PayPal as their payment method.
- paragraph: After receiving a verification code to the mobile number associated with their PayPal account, the checkout page will be pre-filled with the shipping, billing, and payment information saved in their PayPal account.
- heading "CUSTOMIZING FASTLANE’S APPEARANCE" [level=4]
- paragraph:
  - text: Once you have
  - link "enabled Fastlane and made your privacy selection":
    - /url: "#cards"
  - text: ", you can customize how Fastlane appears to shoppers."
- paragraph:
  - text: Fastlane by PayPal allows you to customize the colors of the pop-up elements that your shoppers interact with at checkout. Check the box next to
  - emphasis: Customize Fastlane’s appearance
  - text: to view the style settings.
- paragraph:
  - img "Fastlane’s appearance settings in BigCommerce Payments settings"
- paragraph:
  - strong: General appearance
- list:
  - listitem:
    - strong: Background Color
    - text: — Enter a
    - link "hex code":
      - /url: https://www.w3schools.com/colors/colors_hexadecimal.asp
    - text: to specify the color of the pop-up background.
  - listitem:
    - strong: Error Color
    - text: —Enter a hex code to specify the color of error messaging.
- paragraph:
  - strong: Form fields
- list:
  - listitem:
    - strong: Background Color
    - text: — Enter a hex code to specify the color of input fields.
  - listitem:
    - strong: Text Color Base
    - text: — Enter a hex code to specify the color of input text.
  - listitem:
    - strong: Border Color
    - text: — Enter a hex code to specify the color of the input field borders.
  - listitem:
    - strong: Focus Border Base
    - text: — Enter a hex code to specify the color of the input field borders when highlighted.
- link:
  - /url: "#pay-later"
- heading "PayPal Pay Later" [level=3]
- list:
  - listitem:
    - link "Customizing Pay Later messaging":
      - /url: "#customize-pay-later"
  - listitem:
    - link "Pay Later messaging preview":
      - /url: "#pay-later-preview"
- paragraph: PayPal Pay Later lets customers buy now and pay over time. This feature means that the shopper will owe the money to PayPal while you, the merchant, always get paid. PayPay Pay Later also includes messaging banners that inform your customers of the installment options available at checkout. This can encourage larger purchases and increase your average order value (AOV).
- paragraph:
  - img "PayPal Pay Later banner on a product page"
- text: 
- paragraph:
  - strong: Did you know?
  - text: On stores based in the United Kingdom, PayPal Pay Later will be displayed to shoppers as
  - strong: PayPal Pay in 3
  - text: .
- paragraph:
  - text: Under
  - link "Buy Now, Pay Later":
    - /url: "#bnpl"
    - strong: Buy Now, Pay Later
  - text: ", click"
  - strong: Configure Pay Later messaging
  - text: to customize the appearance of the Pay Later banners and the storefront pages on which they appear. You can also view how your changes affect the banner’s appearance using the
  - link "preview pane":
    - /url: "#pay-later-preview"
  - text: .
- heading "CUSTOMIZING PAY LATER MESSAGING" [level=4]
- paragraph:
  - text: For each page type, click the
  - strong: down arrow
  - text: to view the drop-down lists that controls how aspects of the PayPal Pay Later banner appear on the specific page.
- paragraph: For product, cart, and checkout pages, you can customize the banner’s logo type, logo position (full logo only), text color, and text size.
- paragraph:
  - img "Product, cart, and checkout page Pay Later messaging settings"
- paragraph: For the home page, you can customize the banner’s color and size.
- paragraph:
  - img "Home page Pay Later messaging settings"
- heading "PAY LATER MESSAGING PREVIEW" [level=4]
- paragraph: The preview pane allows you to review your message banner customizations before saving your changes.
- paragraph:
  - img "Pay Later banner preview pane"
- list:
  - listitem:
    - strong: Preview selector
    - text: — In the upper left, the preview icons allow you to switch between viewing just the banner itself or the banner as it will appear on desktop and mobile displays.
  - listitem:
    - strong: Dark mode
    - text: — In the upper right, toggle between viewing the preview pane in light or dark mode.
  - listitem:
    - strong: Preview pane
    - text: — In the center, the preview pane displays the banner based on your other preview selections.
  - listitem:
    - strong: Page selector
    - text: — At the bottom, use the navigation arrows to switch between previewing the banner on the product, cart, checkout, or home page.
