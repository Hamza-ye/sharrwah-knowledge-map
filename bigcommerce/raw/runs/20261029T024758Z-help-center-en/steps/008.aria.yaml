  - /url: "#errors"
- heading "Troubleshooting Payment Errors" [level=3]
- list:
  - listitem:
    - link "Billing address mismatch":
      - /url: "#address-mismatch"
  - listitem:
    - link "MAX 7 error":
      - /url: "#max-7"
  - listitem:
    - link "Card blocked for too many failed attempts":
      - /url: "#too-many-attempts"
  - listitem:
    - link "Other errors":
      - /url: "#other-errors"
- heading "BILLING ADDRESS MISMATCH" [level=4]
- paragraph: If the billing address associated with your card does not match your BigCommerce account's address, the payment will fail. To update your account address, use the steps below.
- paragraph:
  - text: In the BigCommerce Account Dashboard, click
  - strong: Account
  - text: and select
  - emphasis: Account details
  - text: from the drop-down menu, then click
  - strong: Edit
  - text: to the right of the contact listed as the billing contact.
- heading "MAX 7 ERROR" [level=4]
- paragraph: A “MAX 7” error occurs when the geographic distance between your billing address and the location you are attempting to make a payment from is too great. For example, attempting to pay an invoice while in a different country or using a VPN can result in a MAX 7 error.
- paragraph: Our system uses your device's IP address to determine the zip code of your location when attempting to make a payment. To avoid this error, only attempt to process the payment while in the same zip code as your billing address.
- heading "CARD BLOCKED FOR TOO MANY FAILED ATTEMPTS" [level=4]
- paragraph:
  - text: Multiple failed payment attempts will cause your card to be blocked for
  - strong: 24 - 48 hours
  - text: . If this occurs, you will not be able to use that card for payment until it has been unblocked.
- heading "OTHER ERRORS" [level=4]
- paragraph:
  - text: If you have further issues with an error not listed or wish to pay an invoice for a closed account and are unable to
  - link "log in to the Account Dashboard":
    - /url: "#dashboard"
  - text: ","
  - link "contact our support team":
    - /url: https://support.bigcommerce.com/s/#contact
  - text: or
  - link "create a Billing Case":
    - /url: /s/article/Creating-Viewing-Support-Cases
  - text: .
- link:
  - /url: "#faq"
- heading "FAQ" [level=3]
- paragraph:
  - strong: Can I remove the past-due payment notification from my control panel after I have paid the invoice?
- paragraph: The past-due notification is automatically removed from the control panel. This usually occurs the day after your payment is received and verified.
- paragraph:
  - strong: I switched from a monthly to an annual billing cycle. Why am I not being billed for the full year?
- paragraph:
  - text: The
  - link "annual billing cycle":
    - /url: https://www.bigcommerce.com/pricing
  - text: begins on the date of your store account creation rather than the plan change date. After switching the billing frequency, your first invoice covers the difference from the date of upgrade to the creation anniversary date.
- paragraph: For example, if your account was created in January and the plan is changed in May, the first annual charge is prorated for May through January. In January, you will then be charged for a full year.
- paragraph:
  - strong: I just upgraded my store plan. Why is there a prorated charge?
- paragraph: Plan upgrades are processed immediately to allow you to access the new plan’s features without any delay. At the time of the upgrade, you are charged the price difference between plans for the remainder of the current cycle. You will be billed the new plan’s full amount on the next cycle’s invoice.
- paragraph: For an annual plan, this means the prorated amount will cover the difference between the upgrade date and the start of the next year’s cycle.
- paragraph: For example, if your billing cycle ends in November and you upgrade in April, you will be charged a prorated amount for the difference between plans for April through November.
- paragraph:
  - text: For an upgrade from the Growth plan to the Scale plan (299 - 79), this would be a prorated charge of around
  - strong: $1,760
  - text: (220 x 8).
- text: 
- paragraph:
  - strong: Purchasing a storefront seat also incurs a prorated charge.
  - text: Additional storefronts use the same billing cycle as your store plan. You will be charged the price of the storefront for the remainder of the current cycle, and then you will be billed for the full amount on the next cycle’s invoice.
- paragraph:
  - strong: Why am I seeing app purchases and subscriptions on my BigCommerce invoice?
- paragraph:
  - text: BigCommerce partners
  - link "participating in Unified Billing":
    - /url: https://www.bigcommerce.com/apps/categories/?compatibleWith=unified-billing
  - text: use BigCommerce Payment APIs to charge for app purchases and subscriptions.
- paragraph:
  - text: This allows app purchases and subscriptions to be charged to the payment method on file in your
  - link "Account Dashboard":
    - /url: /s/article/Account-Dashboard
  - text: ", using BigCommerce’s"
  - link "PCI compliant":
    - /url: https://security.bigcommerce.com/
  - text: payment system.
- paragraph:
  - text: While payments are processed using BigCommerce’s payment systems, you should still contact the app developer if you have any questions or need troubleshooting assistance. You can find their contact information by clicking
  - strong: Contact Partner
  - text: on the app’s listing page in the App Marketplace.
- paragraph:
  - strong: I cancelled my app subscription after a free trial period, why do I have a prorated charge on my invoice?
- paragraph: For app subscriptions charged via Unified Billing, if you cancel a subscription after a free trial period ends, you will be charged a prorated amount for the time between the trial end date and cancellation date. This prorated charge will appear on the next invoice following your store’s billing cycle.
- paragraph:
  - text: For example, if an app’s free trial period ends on
  - strong: 1/15
  - text: ", but the subscription was cancelled on"
  - strong: 1/17
  - text: ", a prorated charge for"
  - strong: two days
  - text: would be applied to the store’s next invoice.
- paragraph:
  - strong: Why am I not getting monthly or yearly payment warning notifications in my email?
- paragraph:
  - text: Confirm that your billing contact email address in the
  - link "Account Dashboard":
    - /url: /s/article/Account-Dashboard
  - text: is correct.
- paragraph: If the contact email is correct, check your email spam folder or search your inbox for an email with the subject line “Upcoming Annual/Monthly Plan charge for your BigCommerce Account”.
- paragraph:
  - text: To help ensure you receive emails from BigCommerce, add
  - strong: accounts@bigcommerce.com
  - text: and
  - strong: noreply@bigcommerce.com
  - text: to your contacts or allowed senders list.
- paragraph:
  - strong: What happens if I don't pay my invoice by its due date?
- paragraph:
  - text: While unpaid invoices will ultimately cause your storefront and control panel to become unavailable, no action is taken on your store until your invoice is
  - strong: 28 days
  - text: past due. This grace period allows your store to continue operating while billing related issues are being resolved.
