        - /url: /api/accounts/update#update_account-company-verification-document-back
      - text: parameters.
    - heading "Additional information on the representative" [level=4]:
      - text: Additional information on the representative
      - button
    - paragraph:
      - text: A person known as a representative must activate this connected account. The representative must be a
      - link "beneficial owner":
        - /url: https://support.stripe.com/questions/beneficial-owner-and-director-definitions
      - text: who is authorized to sign for the company. Indicate this relationship to Stripe by setting
      - link "relationship.executive":
        - /url: /api/persons/object#person_object-relationship-executive
      - text: to true, or, if the representative owns more than 25% of the company, by setting
      - link "relationship.owner":
        - /url: /api/persons/object#person_object-relationship-owner
      - text: to true.
    - paragraph:
      - text: You might need to collect a scan of an
      - link "ID document":
        - /url: /connect/handling-api-verification#acceptable-verification-documents
      - text: and an
      - link "address document":
        - /url: /connect/handling-api-verification#acceptable-verification-documents
      - text: to enable payouts. That can happen if Stripe can’t verify the representative’s provided information or if there are possible concerns about
      - link "sanctions":
        - /url: /connect/risk-management/best-practices#sanctions-concerns
      - text: . In some cases, depending on various calculated risk factors, Stripe can use Simplified Due Diligence and request only one document for verification at a later time.
    - paragraph:
      - text: Additionally, for partnerships you must provide a
      - link "relationship.percent_ownership":
        - /url: /api/persons/object#person_object-relationship-percent_ownership
      - text: value.
    - paragraph:
      - text: You can collect ID information with the
      - link "verification.document.front":
        - /url: /api/persons/object#person_object-verification-document-front
      - text: and
      - link "verification.document.back":
        - /url: /api/persons/object#person_object-verification-document-back
      - text: parameters.
    - heading "Relationship verification for UBOs and directors" [level=4]:
      - text: Relationship verification for UBOs and directors
      - button
    - paragraph:
      - text: European regulations require verification of the relationship of ultimate beneficial owners (UBOs) and directors to the legal entity. Stripe attempts to verify each person’s relationship using third-party sources. If automatic verification fails, the account can upload an
      - link "official document":
        - /url: /connect/handling-api-verification#acceptable-verification-documents
      - text: or sign a digital attestation.
    - heading "Who needs to be verified" [level=5]:
      - text: Who needs to be verified
      - button
    - paragraph:
      - strong: "UBOs:"
      - text: Verify the relationship of
      - link "ultimate beneficial owners":
        - /url: https://support.stripe.com/questions/beneficial-owner-and-director-definitions
      - text: —individuals who own or control (directly or indirectly) more than 25% of the legal entity. Provide each UBO’s
      - code: first_name
      - text: ","
      - code: last_name
      - text: ","
      - code: dob
      - text: ","
      - code: address
      - text: ", and"
      - code: email
      - text: .
    - paragraph:
      - strong: "Directors:"
      - text: Verify the relationship of
      - link "directors":
        - /url: https://support.stripe.com/questions/beneficial-owner-and-director-definitions
      - text: —board members or senior persons responsible for managing the business (for example, CEO, COO, managing director). Provide each director’s
      - code: first_name
      - text: ","
      - code: last_name
      - text: ","
      - code: dob
      - text: ","
      - code: address
      - text: ","
      - code: email
      - text: ", and"
      - code: title
      - text: . Provide information for all of your directors; if you have more than 5, you only need to provide 5.
    - heading "If automatic verification fails" [level=5]:
      - text: If automatic verification fails
      - button
    - paragraph:
      - text: "If Stripe can’t verify the provided information or if there are possible concerns about sanctions, you might need to provide additional information to enable payouts. The additional documentation can either be a digital attestation or an official document upload:"
      - strong: "Digital attestation:"
      - text: "Use the following document templates:"
    - list:
      - listitem:
        - link "Ultimate beneficial owner digital attestation template":
          - /url: https://docs.stripecdn.com/6e82842bfc01bd0b1c46d77f7d46b69673a9ca965ed2ad9ef53139f98abdbbaf.pdf
        - text: —submit using
        - code: documents.proof_of_ultimate_beneficial_ownership
      - listitem:
        - link "Director digital attestation template":
          - /url: https://docs.stripecdn.com/715ffef45157ff700bc368a4011659ee23bc8ba3c68746c5c15948a6eee1591f.pdf
        - text: —submit using
        - code: documents.proof_of_registration
    - paragraph:
      - text: When submitting an attestation, you must also provide a
      - code: signer.person
      - text: parameter identifying the authorized person who signed the document. The signer must be an existing person associated with the account (for example, the account representative, a business owner, or a director).
    - paragraph:
      - text: For the full API implementation details (including digital attestation integration, signer validation, and error handling), see
      - link "Relationship verification for UBOs and directors":
        - /url: /connect/upcoming-requirements-updates#ubo-director-verification
      - text: .
    - paragraph:
      - strong: Upload additional documents
      - text: ":"
    - list:
      - listitem:
        - strong: "Directors:"
        - text: See
        - link "Additional information on directors":
          - /url: "#EU--additional-information-on-directors"
    - list:
      - listitem:
        - strong: "UBOs:"
        - text: See
        - link "Additional information on beneficial owners":
          - /url: "#EU--additional-information-on-beneficial-owners-for-both-executives-and-owners"
    - heading "Additional information on directors" [level=4]:
      - text: Additional information on directors
      - button
    - paragraph:
      - text: For companies, excluding partnerships, you must collect information on all
      - link "directors":
        - /url: https://support.stripe.com/questions/beneficial-owner-and-director-definitions
      - text: . Directors are members of the governing board of the company. If you have more than 5 directors, you only need to provide information on 5. When you’ve finished collecting the required information from all directors, or if your company doesn’t have any directors, you must inform Stripe by setting
      - link "company.directors_provided":
        - /url: /api/accounts/object#account_object-company-directors_provided
      - text: to true.
    - paragraph:
      - text: You might need to collect a scan of an
      - link "ID document":
        - /url: /connect/handling-api-verification#acceptable-verification-documents
      - text: and an
      - link "address document":
        - /url: /connect/handling-api-verification#acceptable-verification-documents
      - text: to enable payouts. That can happen if Stripe can’t verify the director’s provided information or if there are possible concerns about
      - link "sanctions":
        - /url: /connect/risk-management/best-practices#sanctions-concerns
      - text: . In some cases, depending on various calculated risk factors, Stripe can use Simplified Due Diligence and request only one document for verification at a later time.
    - paragraph:
      - text: You can collect ID information using the
      - link "verification.document.front":
        - /url: /api/persons/object#person_object-verification-document-front
      - text: and
      - link "verification.document.back":
        - /url: /api/persons/object#person_object-verification-document-back
      - text: parameters, and address information using the
      - link "verification.additional_document.front":
        - /url: /api/persons/object#person_object-verification-additional_document-front
      - text: and
      - link "verification.additional_document.back":
        - /url: /api/persons/object#person_object-verification-additional_document-back
      - text: parameters.
    - heading "Additional information on beneficial owners (for both executives and owners)" [level=4]:
      - text: Additional information on beneficial owners (for both executives and owners)
      - button
    - paragraph:
      - text: You must collect information on all
      - link "beneficial owners":
        - /url: https://support.stripe.com/questions/beneficial-owner-and-director-definitions
      - text: . Beneficial owners are persons who exercise significant management control over the company (executives) or who own more than 25% of the company (owners). When you’ve finished collecting the required information from all beneficial owners, you must inform Stripe by setting both
      - link "company.owners_provided":
        - /url: /api/accounts/object#account_object-company-owners_provided
      - text: and
      - link "company.executives_provided":
        - /url: /api/accounts/object#account_object-company-executives_provided
      - text: to true.
    - paragraph:
      - text: You might need to collect a scan of an
      - link "ID document":
        - /url: /connect/handling-api-verification#acceptable-verification-documents
      - text: and an
      - link "address document":
        - /url: /connect/handling-api-verification#acceptable-verification-documents
      - text: to enable payouts. That can happen if Stripe can’t verify the beneficial owner’s provided information or if there are possible concerns about
      - link "sanctions":
        - /url: /connect/risk-management/best-practices#sanctions-concerns
      - text: . In some cases, depending on various calculated risk factors, Stripe can use Simplified Due Diligence and request only one document for verification at a later time.
    - paragraph:
      - text: You can collect ID information using the
      - link "verification.document.front":
        - /url: /api/persons/object#person_object-verification-document-front
      - text: and
      - link "verification.document.back":
        - /url: /api/persons/object#person_object-verification-document-back
      - text: parameters, and address information using the
      - link "verification.additional_document.front":
        - /url: /api/persons/object#person_object-verification-additional_document-front
      - text: and
      - link "verification.additional_document.back":
        - /url: /api/persons/object#person_object-verification-additional_document-back
      - text: parameters.
    - paragraph:
      - text: Optionally, you can collect ownership information on each person who owns more than 25% of the company with
      - link "relationship.owner":
        - /url: /api/persons/object#person_object-relationship-owner
      - text: and
      - link "relationship.percent_ownership":
        - /url: /api/persons/object#person_object-relationship-percent_ownership
      - text: .
    - paragraph:
      - text: Additionally, for partnerships you need to provide a
      - link "relationship.percent_ownership":
        - /url: /api/persons/object#person_object-relationship-percent_ownership
      - text: value for any owners added to the account.
    - heading "Onboarding as a government entity" [level=4]:
      - text: Onboarding as a government entity
      - button
    - paragraph:
      - text: Government entities follow a specialized onboarding and verification process that differs from standard company verification. For eligibility criteria, required documentation, and step-by-step onboarding instructions, see
      - link "Business verification requirements for government entities":
