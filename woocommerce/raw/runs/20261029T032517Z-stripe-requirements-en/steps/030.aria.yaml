    - heading "Provide ID document for the representative" [level=4]:
      - text: Provide ID document for the representative
      - button
    - paragraph:
      - text: You must provide a scan of an
      - link "ID document":
        - /url: /connect/handling-api-verification#acceptable-verification-documents
      - text: for the representative. To collect this scan, use the
      - link "verification.document.front":
        - /url: /api/persons/object#person_object-verification-document-front
      - text: and
      - link "verification.document.back":
        - /url: /api/persons/object#person_object-verification-document-back
      - text: arguments.
    - paragraph: Identity verification documents must be issued in Japan and show the representative’s residency status.
    - heading "Special considerations" [level=4]:
      - text: Special considerations
      - button
    - paragraph:
      - text: Collecting information for Japanese accounts is unique in that both
      - emphasis: kana
      - text: and
      - emphasis: kanji
      - text: "language variations are required for a number of parameters:"
    - list:
      - listitem:
        - code: first_name_kana
      - listitem:
        - code: first_name_kanji
      - listitem:
        - code: last_name_kana
      - listitem:
        - code: last_name_kanji
      - listitem:
        - code: name_kana
      - listitem:
        - code: name_kanji
      - listitem:
        - code: address_kana
      - listitem:
        - code: address_kanji
    - paragraph:
      - text: You need to submit information for these parameters instead of their counterparts (that is, instead of
      - code: first_name
      - text: ","
      - code: last_name
      - text: ", and so forth). It might seem counterintuitive to provide two arguments that represent the same onboarding requirement, but Stripe can’t verify a Japanese account until we’ve received information for both language variations. These variations might be composed of full- or half-width hiragana, katakana, or Latin characters, with kanji-specific API parameters also allowing for kanji characters."
    - heading "Japanese addresses" [level=4]:
      - text: Japanese addresses
      - button
    - paragraph: Both kana and kanji language variations apply to Japanese address requirements as well.
    - paragraph:
      - code: postal_code
      - text: is always required when providing a Japanese address of either language variation. Stripe validates submitted addresses, and for a valid
      - code: postal_code
      - text: ", we attempt to automatically fill attributes for matching"
      - code: state
      - text: ","
      - code: city
      - text: ", and"
      - code: town
      - text: for
      - emphasis: both
      - code: address_kana
      - text: and
      - code: address_kanji
      - text: .
    - paragraph:
      - text: Requests with address details that are incompatible with the provided
      - code: postal_code
      - text: fail.
    - paragraph:
      - code: line2
      - text: should contain the building name in addition to the room number if applicable. This attribute can be omitted when the address doesn’t contain building details.
    - paragraph: "Here’s an example representation of a Japanese address, with explanations for how each part maps to its corresponding Stripe API attribute:"
