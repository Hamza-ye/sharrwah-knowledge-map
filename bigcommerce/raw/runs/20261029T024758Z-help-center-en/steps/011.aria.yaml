- paragraph: "Channel Manager is where you can discover, connect to, and manage all the different sales and marketing channels available for your store. Extending your reach beyond your BigCommerce storefront can create new sales opportunities and help promote your brand. Channel Manager provides a centralized area in your control panel where you can:"
- list:
  - listitem:
    - strong: Discover new channels.
    - text: The partners and solutions featured in Channel Manager all represent best-in-class functionality and worked closely with BigCommerce to ensure you receive all the channel's benefits and functionality without ever leaving your control panel. Channels/channel providers sometimes offer special benefits or promotions for signing up in Channel Manager.
  - listitem:
    - strong: Manage channel status.
    - text: Check the status of all connected channels in one place. Turn off existing channels and/or enable new ones.
  - listitem:
    - strong: Configure channel settings.
    - text: Set up or change channel-specific settings for things like catalog syncing, account details, and preferences.
- paragraph:
  - img "Channel Manager main page showing the default storefront and some connected marketplaces"
- link:
  - /url: "#types"
- heading "Channel types" [level=3]
- paragraph: "There are five channel types:"
- list:
  - listitem:
    - strong: Storefronts
    - text: — This channel type lists all of your storefront channels, including your default storefront, additional native (Stencil) storefronts, and headless storefronts.
  - listitem:
    - strong: Marketplaces
    - text: — This type of channel makes your product available for purchase on a separate platform. Orders from marketplace channels come into your control panel the same way storefront orders do.
  - listitem:
    - strong: Point of Sale
    - text: — These apps are used to connect and sync your store with popular third-party POS systems. Stock numbers are synchronized between the two systems.
  - listitem:
    - strong: Ads and Social
    - text: — This type of channel is used to advertise your brand and/or products on different platforms. Unlike marketplaces, marketing feeds are not a direct order source but drive awareness, traffic, and sales via promotion and advertising on other platforms.
  - listitem:
    - strong: Affiliate and Influencer
    - text: — This channel type includes apps that connect you with affiliate and influencer partners to help you reach new customers on various social platforms and web publications.
- link:
  - /url: "#availability"
- heading "Channel Availability" [level=3]
- paragraph: The channels that you see available to set up in Channel Manager are based on your store’s country and currency settings.
- list:
  - listitem:
    - text: If you don’t see a particular channel, it could be because that channel is not available in your
    - link "country":
      - /url: /s/article/Store-Profile-Settings
    - text: ", or for your store’s"
    - link "default currency":
      - /url: /s/article/Managing-Currencies
    - text: .
  - listitem: If your store isn’t eligible for any offerings of a particular channel category, then that category panel won’t appear in your control panel.
  - listitem:
    - text: Some channels are installed as apps in the
    - link "App Marketplace":
      - /url: https://www.bigcommerce.com/apps/
    - text: . For this reason, you should be logged in as the
    - link "store owner":
      - /url: /s/article/Store-Owner
    - text: . Only the store owner has the ability to install apps.
