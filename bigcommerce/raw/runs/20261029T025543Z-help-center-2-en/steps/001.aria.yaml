- heading "ADDITIONAL FEATURES" [level=4]
- paragraph:
  - strong: Is 3D Secure supported?
- paragraph:
  - text: Yes,
  - link "3D Secure":
    - /url: /s/article/3D-Secure
  - text: is supported by BigCommerce Payments. See the
  - link "Transaction settings section":
    - /url: "#transaction-settings"
  - text: for setup details and more information.
- paragraph:
  - strong: Is Level 2 and Level 3 data supported?
- paragraph: Yes, Level 2 and Level 3 data fields are supported for corporate and purchase credit card transactions placed by commercial shoppers. Note that Level 2 and Level 3 cost optimization benefits are not applicable to debit cards.
- paragraph:
  - text: See
  - link "PayPal's documentation":
    - /url: https://developer.paypal.com/docs/checkout/advanced/customize/processing/
  - text: for more information on supported card networks and data field mapping.
- paragraph:
  - strong: Is multicurrency supported?
- paragraph:
  - text: Yes, multicurrency is supported by our integration. To learn more about setting up multiple currencies, see
  - link "Using Multiple Currencies":
    - /url: /s/article/Using-Multiple-Currencies
  - text: .
- paragraph:
  - strong: Is cryptocurrency supported?
- paragraph: No, cryptocurrency is not supported.
- paragraph:
  - strong: Can I place payment buttons at the top of my checkout page?
- paragraph:
  - text: You can place payment buttons at the top of checkout by checking
  - emphasis: Show wallet buttons at the top of checkout
  - text: located under
  - link "Settings › Checkout":
    - /url: http://login.bigcommerce.com/deep-links/settings/checkout
    - strong: Settings
    - text: ›
    - strong: Checkout
  - text: . Note that buttons will appear above the Customer step for
  - link "guest shoppers":
    - /url: /s/article/Guest-Customers-and-Checkout
  - text: only.
- heading "TRANSACTIONS" [level=4]
- paragraph:
  - strong: How long until a transaction’s funds are available for payout?
- paragraph:
  - text: Funds are typically available in your
  - link "Balance dashboard":
    - /url: "#balance-dashboard"
  - text: shortly after a payment is captured.
- text: 
- paragraph:
  - strong: "Note:"
  - text: For new BigCommerce Payments accounts, initial payments are held for
  - strong: up to 21 days
  - text: before being available for payout. For more information, see PayPal’s
  - link "New PayPal account – payments on hold and accessing your money quicker":
    - /url: https://www.paypal.com/us/cshelp/article/new-paypal-account-%E2%80%93-payments-on-hold-and-accessing-your-money-quicker-help848
  - text: .
- paragraph:
  - strong: Are delayed or manual capture payments supported?
- paragraph:
  - text: Yes, BigCommerce Payments supports manual capture when using the
  - emphasis: Authorize only
  - link "Transaction type":
    - /url: "#transaction-settings"
  - text: .
- paragraph:
  - strong: Are recurring or subscription payments supported?
- paragraph:
  - text: Yes, recurring payments through
  - link "stored PayPal accounts":
    - /url: "#account-info"
  - text: or
  - link "stored credit cards":
    - /url: "#stored-cards"
  - text: functionality is supported. Note that your store must be on a
  - link "Growth plan or higher":
    - /url: https://www.bigcommerce.com/pricing/
  - text: .
- heading "REFUNDS" [level=4]
- paragraph:
  - strong: How soon after a transaction can I perform a refund?
- paragraph:
  - text: Once a payment is captured, there is no delay before you can
  - link "issue a refund":
    - /url: /s/article/Processing-Refunds
  - text: .
- paragraph:
  - text: Note that refunds are issued from your BigCommerce Payments balance,
  - strong: not
  - text: from linked bank accounts. Before performing a refund, check the
  - link "Balance dashboard":
    - /url: "#balance-dashboard"
  - text: to ensure that you have sufficient funds.
- heading "PAYMENT DISPUTES" [level=4]
- paragraph:
  - strong: How are payment disputes handled?
- paragraph:
  - text: Payment disputes can be addressed by clicking
  - strong: Manage disputes
  - link "above Actions":
    - /url: "#actions"
    - text: above
    - strong: Actions
  - text: or in the
  - link "Balance dashboard":
    - /url: "#balance-dashboard"
  - text: to be redirected to PayPal’s
  - strong: Resolution Center
  - text: page. For more information, see PayPal’s
  - link "merchant guide on dispute transactions":
    - /url: https://www.paypal.com/us/brc/article/customer-disputes-claims-chargebacks-bank-reversals
  - text: .
- heading "TROUBLESHOOTING AND SUPPORT" [level=4]
- paragraph:
  - strong: Why are payment methods, such as credit/debit cards or APMs not available to be enabled?
- paragraph:
  - text: If payment methods are not available to be enabled, your BigCommerce Payments account or PayPal business profile may be incomplete. Check the
  - link "Actions section":
    - /url: "#actions"
    - strong: Actions
    - text: section
  - text: and your
  - link "PayPal dashboard":
    - /url: https://www.paypal.com/myaccount/home
  - text: for any notifications regarding account setup.
- paragraph:
  - text: You may also see an “Account verification pending” banner above the
  - strong: Actions
  - text: section. Once you have completed your account or business profile, the payment methods are usually available within
  - strong: one business day
  - text: .
- paragraph:
  - text: If you need additional assistance with setting up your account,
  - link "contact PayPal support":
    - /url: https://paypal.com/smarthelp/contact-us
  - text: .
- paragraph:
  - strong: Why did my refund fail?
- paragraph: Insufficient funds are a common cause for failed refunds. As refunds are issued from your BigCommerce Payments balance rather than linked bank accounts, your balance may have been too low for the refund to be successful.
- paragraph:
  - text: Note that failed refunds
  - strong: cannot
  - text: be retried in the BigCommerce control panel and must be
  - link "completed in the PayPal dashboard":
    - /url: https://www.paypal.com/us/cshelp/article/how-do-i-issue-a-refund-help101
  - text: .
- paragraph:
  - strong: Why are some of my funds held or otherwise unavailable for payout?
- paragraph:
  - text: Funds may be held or blocked for several reasons, depending on different factors. Check the
  - link "Actions section":
    - /url: "#actions"
    - strong: Actions
    - text: section
  - text: for any notifications and complete any requests for documents or verification.
- paragraph:
  - text: For new BigCommerce Payments accounts, initial payments are held for
  - strong: up to 21 days
  - text: before being available for payout. For more information, see
  - link "PayPal’s New PayPal account – payments on hold and accessing your money quicker":
    - /url: https://www.paypal.com/us/cshelp/article/new-paypal-account-%E2%80%93-payments-on-hold-and-accessing-your-money-quicker-help848
  - text: .
- paragraph:
  - text: If you have added the requested account details and the funds are still held or blocked,
  - link "contact PayPal support":
    - /url: https://paypal.com/smarthelp/contact-us
  - text: .
- paragraph:
  - strong: Why do I see different balances in the BigCommerce Payments Balance dashboard and my PayPal account?
- paragraph:
  - text: The balance in the BigCommerce control panel displays funds from your BigCommerce Payments account while your PayPal business account contains any other funds, including funds transferred by
  - link "automatic payout":
    - /url: "#auto-payouts"
  - text: .
- paragraph:
  - text: To access your BigCommerce Payments funds, go to
  - link "Finance › BigCommerce Payments":
    - /url: http://login.bigcommerce.com/deep-links/balance
    - strong: Finance › BigCommerce Payments
  - text: in the BigCommerce control panel. To access your PayPal funds, log into the
  - link "PayPal dashboard":
    - /url: https://www.paypal.com/myaccount/home
  - text: and go to
  - strong: Finance › Money
  - text: .
- paragraph:
  - strong: What does the “Something went wrong” error message mean when trying to connect BigCommerce Payments with an existing PayPal Business account?
- paragraph:
  - text: If you receive this error, ensure that the email address you entered is correct and matches the one on your PayPal Business account. Next, log into your
  - link "PayPal dashboard":
    - /url: https://www.paypal.com/myaccount/home
  - text: and confirm that your account has been fully set up.
- paragraph:
  - text: If you need additional assistance,
  - link "contact PayPal support":
    - /url: https://paypal.com/smarthelp/contact-us
  - text: .
- paragraph:
  - strong: What do I do if a bank account won’t link or the pop-up window goes blank or reloads?
- paragraph:
  - text: If the linking window goes blank or reloads, your account may still have linked successfully. Close the pop-up window and refresh your Balance dashboard to check the
  - link "Banks section":
    - /url: "#link-bank"
    - strong: Banks
    - text: section
  - text: . If your bank isn’t displayed, try the linking process again.
- paragraph:
  - text: If you need additional assistance linking a bank account,
  - link "contact PayPal support":
    - /url: https://paypal.com/smarthelp/contact-us
  - text: .
- paragraph:
  - strong: What do I do if I don’t see my funds after a completed payout?
- paragraph:
  - text: If the funds from a payout marked
  - emphasis: Completed
  - text: in the Balance dashboard are missing or reversed,
  - link "contact PayPal support":
    - /url: https://paypal.com/smarthelp/contact-us
  - text: .
- paragraph:
  - strong: Why did my customer receive a “Duplicate Invoice ID detected. To avoid a potential duplicate transaction your account setting requires that Invoice Id be unique for each transaction” error when trying to check out?
- paragraph:
  - text: When starting a new BigCommerce store, if you link an existing PayPal Business account that has past
  - link "PayPal":
    - /url: /s/article/Connecting-with-PayPal
  - text: or BigCommerce Payments transactions and elect to
  - link "sync your order IDs with PayPal":
    - /url: "#post-purchase"
  - text: ", you will need to change your store's Starting Order Number."
- paragraph: For example, if you have an existing PayPal Invoice ID "100" and your next BigCommerce order ID will also be “100”, the transaction will fail with the error message, "Duplicate Invoice ID detected. To avoid a potential duplicate transaction your account setting requires Invoice ID to be unique for each transaction."
- paragraph:
  - text: To avoid these errors, update your store’s
  - link "Starting Order Number":
    - /url: /s/article/Order-ID
  - text: to a number higher than any of your existing PayPal Invoice IDs.
- paragraph: Once the Starting Order Number is updated, future shoppers should not encounter the error. However, shoppers with items in their cart prior to the update may still receive the error at checkout. These shoppers should delete all items from their cart and start over to successfully check out.
- paragraph:
  - strong: Who should I contact for support with my BigCommerce Payments integration?
- paragraph:
  - text: Unless otherwise noted above, if you need assistance,
  - link "contact the BigCommerce support team":
    - /url: https://support.bigcommerce.com/s/#contact
  - text: .
