- paragraph:
  - text: The Balance dashboard, located by navigating to
  - link "Finance › BigCommerce Payments":
    - /url: http://login.bigcommerce.com/deep-links/balance
    - strong: Finance
    - text: ›
    - strong: BigCommerce Payments
  - text: ", provides a real-time overview of your BigCommerce Payments account balance. From here, you can also link bank accounts, manage currencies, perform currency conversions, add additional funds to your balance, and manage payouts to linked accounts"
- paragraph:
  - img "Money section of the BigCommerce Payments Balance dashboard"
- paragraph:
  - text: In the upper left of the page, you can select which BigCommerce Payments configuration to view from the
  - strong: Payment profile
  - text: drop-down list.
- paragraph:
  - text: In the upper right are links to your account’s portal pages on PayPal’s website where you can manage payment disputes, view insights, and view reports. For more information about disputes and PayPal’s Resolution Center, see PayPal’s
  - link "merchant guide on dispute transactions":
    - /url: https://www.paypal.com/us/brc/article/customer-disputes-claims-chargebacks-bank-reversals
  - text: .
- paragraph:
  - img "Links to portal pages in the BigCommerce Payments dashboard"
- heading "VIEWING AND LINKING BANKS" [level=4]
- paragraph:
  - text: In the
  - strong: Banks
  - text: section at the bottom of the dashboard, you can view bank accounts linked to your BigCommerce Payments account. Click an existing bank to open a pop-up window where you can set it as your preferred bank or unlink and remove it from your list of banks.
- paragraph:
  - img "Banks section in the BigCommerce Payments dashboard"
- paragraph:
  - text: To connect a new bank, click
  - strong: Link a bank
  - text: . In the pop-up window, click on the tile for your bank or use the search bar to locate a bank. Quickly link your account using Mastercard Data Connect or manually by entering your account details. Note that manual connection can take up to
  - strong: three business days
  - text: to complete.
- paragraph: If your bank cannot be found in the search results, you can also manually enter your bank details.
- paragraph:
  - img "Bank selection pop-up window"
- paragraph:
  - text: You can also perform these functions directly in your PayPal dashboard by clicking
  - strong: Manage banks from your PayPal account
  - text: .
- heading "MANAGING CURRENCIES AND CONVERTING BALANCES" [level=4]
- paragraph:
  - text: In the
  - strong: Currencies
  - text: section, you can view and manage your configured currencies, as well as the existing balance per currency.
- paragraph:
  - text: Expand your primary currency to view the linked bank account and set up
  - link "automatic payouts":
    - /url: "#auto-payouts"
  - text: to your bank or PayPal account.
- paragraph:
  - img "Currencies section in the BigCommerce Payments dashboard"
- paragraph: On the right side of the section, you can perform currency and balance actions, such as using the currency calculator to review balance exchanges, add additional currencies, mark a currency as primary, remove (close) a currency, and convert existing balances from one currency to another.
- paragraph:
  - img "Currency and balance actions highlighted"
- paragraph:
  - text: To change existing balance from one enabled currency to another, click
  - strong: Convert currency
  - text: . In the pop-up window, select your
  - strong: From
  - text: and
  - strong: To
  - text: currencies from their respective drop-down lists. The available balances for each currency and the conversion rate will update upon your selections.
- paragraph:
  - text: Click the
  - strong: pencil
  - text: icon to enter the amount that you want to convert, then click
  - strong: Convert
  - text: .
- paragraph:
  - img "Currency conversion in the BigCommerce Payments dashboard"
- paragraph:
  - text: If you do not have enough funds in your desired
  - strong: From
  - text: currency, you will need to
  - link "add more":
    - /url: "#add-balance"
  - text: .
- heading "ADDING MONEY TO YOUR BALANCE" [level=4]
- paragraph:
  - text: To add money to your BigCommerce Payments balance, click
  - strong: Add Money
  - text: in the upper-right of the page.
- paragraph:
  - img "Add Money highlighted in the BigCommerce Payments dashboard"
- paragraph:
  - text: In the pop-up window, click the
  - strong: pencil
  - text: icon to enter the amount to add to your primary currency’s balance. Click
  - strong: Change
  - text: to switch the source bank or link a new one. When you are ready, click
  - strong: Add
  - text: .
- paragraph:
  - text: Note that most transfers are completed within
  - strong: three to five business days
  - text: .
- paragraph:
  - img "Add Money pop-up window in the BigCommerce Payments dashboard"
- heading "VIEWING PAYOUTS" [level=4]
- paragraph:
  - text: In the
  - strong: Payouts
  - text: section, you can view your payouts and manage
  - link "manual":
    - /url: "#manual-payouts"
  - text: and
  - link "automatic":
    - /url: "#auto-payouts"
  - text: payouts.
- paragraph:
  - text: The payouts list shows your most recent payouts, click
  - strong: Load More
  - text: to display additional lines. To change which payouts are displayed, click
  - strong: Filter
  - text: . In the pop-up window, you can select a different time frame (past 7, 30, 90, and 365 days), select a specific currency, and set a minimum or maximum amount.
- paragraph:
  - img "Payouts section in the BigCommerce Payments dashboard"
- heading "AUTOMATIC PAYOUTS" [level=4]
- paragraph:
  - text: You can enable automatic payouts from your BigCommerce Payments balance to a linked bank account or PayPal account. To begin, click
  - strong: Set up auto payments
  - text: in the upper-right of the dashboard or at the top of the
  - strong: Payouts
  - text: section.
- paragraph:
  - img "Set up auto payouts highlighted in the BigCommerce Payments dashboard"
- paragraph:
  - text: In the pop-up window, select a payout frequency. By default, automatic payouts are transferred to your PayPal account. To switch to a bank account, click
  - strong: Change
  - text: and link a new account or select an existing one.
- paragraph:
  - text: Note that your entire balance transfers when using automatic payouts. To transfer specific values, perform a
  - link "manual payout":
    - /url: "#manual-payout"
  - text: .
- paragraph:
  - img "Auto payout setup pop-up window"
- text: 
- paragraph:
  - strong: Refunds are issued from your BigCommerce Payments balance.
  - text: Payouts may reduce your available balance below the amount to be refunded. Before
  - link "performing a refund":
    - /url: /s/article/Processing-Refunds
  - text: ", check the Balance dashboard to ensure that you have sufficient funds."
- heading "MANUAL PAYOUTS" [level=4]
- paragraph:
  - text: You can perform manual payouts from your BigCommerce Payments balance to a linked bank account. To begin, click
  - strong: Payout Now
  - text: in the upper-right of the dashboard or at the top of the
  - strong: Payouts
  - text: section.
- paragraph:
  - img "Payout Now highlighted in the BigCommerce Payments dashboard"
- paragraph:
  - text: In the pop-up window, click the
  - strong: pencil
  - text: icon to enter the payout amount. Select
  - strong: Fast
  - text: to receive the payout in minutes (
  - link "fees apply":
    - /url: "#fees"
  - text: ) or
  - strong: Standard
  - text: to receive the payout in up to
  - strong: three business days
  - text: . If your bank does not offer Fast Payout, you’ll need to link a new one or select
  - strong: Standard
  - text: .
- paragraph:
  - text: To change the destination bank account, click
  - strong: Change
  - text: and link a new account or select an existing one. Note that only bank accounts are eligible for manual payout; to transfer your balance to a PayPal account, set up
  - link "automatic payouts":
    - /url: "#auto-payouts"
  - text: .
- paragraph:
  - img "Payout Now pop-up window"
- text: 
- paragraph:
  - strong: Refunds are issued from your BigCommerce Payments balance.
  - text: Payouts may reduce your available balance below the amount to be refunded. Before
  - link "performing a refund":
    - /url: /s/article/Processing-Refunds
  - text: ", check the Balance dashboard to ensure that you have sufficient funds."
