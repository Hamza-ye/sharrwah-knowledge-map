- heading "Selling Everywhere with Channel Manager" [level=1]
- heading "What We'll Cover" [level=2]
- list:
  - listitem:
    - link "Channel types":
      - /url: "#types"
  - listitem:
    - link "Channel availability":
      - /url: "#availability"
  - listitem:
    - link "Requirements":
      - /url: "#requirements"
  - listitem:
