- paragraph: Once you have connected your PayPal Business account to a BigCommerce Payments account, you can customize your customer’s payment experience.
- heading "ACTIONS" [level=4]
- paragraph:
  - text: The
  - strong: Actions
  - text: section allows you to see real-time alerts for your BigCommerce Payments account. Tasks, such as completing your profile, linking a bank account, Know Your Customer (KYC) status, and fund holds will be displayed here.
- paragraph:
  - img "Actions section of BigCommerce Payments settings"
- paragraph:
  - text: Just above the
  - strong: Actions
  - text: area is a link to access the
  - link "Balance dashboard":
    - /url: "#balance-dashboard"
  - text: in the BigCommerce control panel, as well links to your account’s portal pages on PayPal’s website where you can manage payment disputes, view insights, and view reports.
- paragraph:
  - text: For more information about disputes and PayPal’s Resolution Center, PayPal’s
  - link "merchant guide on dispute transactions":
    - /url: https://www.paypal.com/us/brc/article/customer-disputes-claims-chargebacks-bank-reversals
  - text: .
- paragraph:
  - img "Links to Balance dashboard and account portal pages"
- heading "ACCOUNT" [level=4]
- paragraph:
  - img "Account section of BigCommerce Payments settings"
- list:
  - listitem:
    - strong: Live account
    - text: — When connected, your live account email address and Merchant ID are displayed.
    - list:
      - listitem:
        - text: To remove the connected account, click
        - strong: Disconnect live account
        - text: .
  - listitem:
    - strong: Test account
    - text: — When connected, your sandbox account email address and Merchant ID are displayed.
    - list:
      - listitem:
        - text: To connect your test account, click
        - strong: Set up test account
        - text: .
      - listitem:
        - text: To switch to a different connected account, click
        - strong: Change PayPal sandbox account
        - text: .
      - listitem:
        - strong: Test mode
        - text: — Check to simulate transactions without processing real payments.
        - list:
          - listitem:
            - strong: Note that enabling test mode pauses transactions on your live account.
- heading "CARDS" [level=4]
- paragraph:
  - text: Under
  - strong: Payment Methods
  - text: ", the"
  - strong: Cards
  - text: section lets you manage your credit/debit card and Faslane by PayPal accelerated checkout settings.
- paragraph:
  - text: Click
  - strong: Configure
  - text: to expand each feature’s available options.
- paragraph:
  - img "Cards section of BigCommerce Payments settings"
- list:
  - listitem:
    - strong: Enable credit/debit card payments through PayPal
    - text: — Check to enable credit/debit card payments at checkout.
    - list:
      - listitem:
        - text: If you have multiple
        - link "payment gateways":
          - /url: /s/article/Available-Payment-Gateways
        - text: set up for a currency, we recommend only using one to accept credit/debit payments.
  - listitem:
    - strong: Display name
    - text: — Enter how the payment method is labeled at checkout, customer invoices, and order details.
  - listitem:
    - strong: Enable Fastlane by PayPal
    - text: — Check to enable
    - link "Fastlane by PayPal":
      - /url: "#fastlane"
    - text: ", accelerating checkout for"
    - link "guest shoppers":
      - /url: /s/article/Guest-Customers-and-Checkout
    - text: .
    - list:
      - listitem:
        - text: Note that Fastlane cannot be enabled when the
        - emphasis: Customers must have or create an account to checkout
        - text: option is enabled in your
        - link "Optimized-One Page Checkout settings":
          - /url: /s/article/Optimized-Single-Page-Checkout
        - text: .
      - listitem:
        - strong: Default delivery method
        - text: — Shoppers are taken directly to the
        - strong: Payment
        - text: step at checkout with your
        - link "Default shipping option":
          - /url: /s/article/Optimized-Single-Page-Checkout
        - text: preselected.
        - list:
          - listitem:
            - text: Shoppers can click
            - strong: Edit
            - text: next to the
            - strong: Shipping
            - text: step to choose a different method.
      - listitem:
        - strong: Select delivery method
        - text: — Shoppers are directed to the
        - strong: Shipping
        - text: step, allowing them to select a shipping method after signing into their Fastlane account.
  - listitem:
    - strong: Use Fastlane by PayPal’s privacy setting
    - text: — Check to display the Fastlane logo below the email address field on the checkout page. Clicking the logo displays a disclaimer and a link to Fastlane’s privacy statement.
    - list:
      - listitem:
        - text: When unchecked, the selected
        - emphasis: Guest shopper consent to privacy policy
        - text: option in your
        - link "Checkout settings":
          - /url: /s/article/Optimized-Single-Page-Checkout
        - text: will apply.
  - listitem:
    - strong: Customize Fastlane’s appearance
    - text: — Check to optionally customize how Fastlane appears on your checkout page.
- text: 
- paragraph:
  - strong: Not sure which privacy display option is right for your business?
  - text: We highly recommend consulting your legal advisor to ensure you are displaying the necessary information at checkout.
  - strong: Note that our support team is not qualified to give advice on regional privacy requirements.
