<script>
  window.onload = (event) => {

        const isBigcommerceUser = (element) => {
            return element?.innerHTML?.toLowerCase()?.includes('bigcommerce');
        };

        const getAgentName = (element) => {
            return {
                firstName: element?.innerHTML?.split(' ')[0],
                lastName: element?.innerHTML?.split(' ')[1]
            }
        };

        const removeAllListeners = (element) => {
            const newElement = element.cloneNode( true );
            element.parentNode.replaceChild( newElement, element );
        };

        const removeAttributes = (element) => {
            while( element.attributes.length > 0 ) {
                element.removeAttribute( element.attributes[0].name );
            }
        };

        const removeAgentLastNameFromImageTitle = (element, lastName) => {
            if( !lastName ) return;

            const imgTag = element.querySelector('.slds-avatar img');
            imgTag.title = imgTag.title.replace( ' ' + lastName, '' );
        };

        function handleAgentsName() {
            const nameContainers = document.querySelectorAll('.forceCommunityForceCommunityFeed .forceChatterFeedItemHeader .cuf-preamble .cuf-entityLinkId');
            for (const nameContainer of nameContainers) {
                const userNameLink = nameContainer.children[0];

                if( !userNameLink ) continue; // was already processed
                if( !isBigcommerceUser( nameContainer.nextSibling ) ) continue; // leave customer name as it is

                const spanWithUserFullName = userNameLink.querySelector( '.cuf-entityLink .uiOutputText' );
                const { firstName, lastName } = getAgentName( spanWithUserFullName );

                // remove hover modal from avatar and remove last name from Agent Name from avatar title
                const headerContainer = nameContainer.closest('.slds-post__header');
                const avatarContaner = headerContainer.querySelector('.slds-media__figure.entityLinkFeedItemImageHover');
                removeAgentLastNameFromImageTitle( avatarContaner, lastName );
                removeAttributes( avatarContaner.querySelector('.cuf-entityLinkId') );
                removeAllListeners( avatarContaner );

                // remove clickable agent name link and remove last name from Agent Name
                nameContainer.replaceWith( firstName );
            }
        }

        // increase interval time at runtime
        let timer = 50;
        let startTime = new Date();

        recurringCheck();

        function changeTimer() {
            const timeElapsed = new Date() - startTime;
            if( timeElapsed < 5000 ) {
                timer = 50;
            } else if( timeElapsed < 10000 ) {
                timer = 100;
            } else {
                timer = 250;
            }
        }

        function recurringCheck() {
            handleAgentsName();
            changeTimer();
            setTimeout(recurringCheck, timer);
        }
  };
</script>

<script>
(function () {
  if (window.top !== window.self) return; 
  var FRAME_ID = 'ssmFrame';
  var ALLOW = 'fullscreen; autoplay; encrypted-media; picture-in-picture';

  function hasFullscreen(el){
    return el && (el.hasAttribute('allowfullscreen') ||
      ((el.getAttribute('allow')||'').toLowerCase().includes('fullscreen')));
  }
  function setAttrs(el){
    el.setAttribute('allow', ALLOW);
    el.setAttribute('allowfullscreen','');
    el.setAttribute('webkitallowfullscreen','');
    el.setAttribute('mozallowfullscreen','');
  }
  function upgrade(el){
    if (!el || hasFullscreen(el)) return;
    var c = el.cloneNode(false);
    c.id = el.id; c.src = el.src; c.style.cssText = el.style.cssText;
    setAttrs(c);
    el.parentNode.replaceChild(c, el);
  }

  var f = document.getElementById(FRAME_ID);
  if (f) upgrade(f);

  var mo = new MutationObserver(function(muts){
    for (const m of muts){
      for (const n of m.addedNodes){
        if (n.nodeType!==1) continue;
        if (n.id===FRAME_ID){ upgrade(n); return; }
        const q = n.querySelector?.('#'+FRAME_ID);
        if (q){ upgrade(q); return; }
      }
    }
  });
  mo.observe(document.documentElement,{childList:true,subtree:true});
})();
</script>
<!-- END: Creation-time fullscreen preflight -->

<!-- START: Page sizing for banner + sticky footer -->
<script>
(function () {
  const headerSel = '#themeHeader';
  const footerSel = 'footer.cBrThemeFooter, .footer.cBrThemeFooter';
  const bannerSel = '.announcement-block';
  const FALLBACK_FOOTER = 277;

  function px(n){ return Math.max(0, Math.round(n || 0)); }

  function recalc() {
    const shell  = document.getElementById('ssmFrameShell');
    const header = document.querySelector(headerSel);
    const footer = document.querySelector(footerSel);
    if (!shell) return;

    const headerBottom = header ? header.getBoundingClientRect().bottom : 0;
    let footerH = 0;
    if (footer) {
      const r = footer.getBoundingClientRect();
      footerH = (r && r.height) ? r.height : FALLBACK_FOOTER;
    }

    shell.style.top    = px(headerBottom) + 'px';
    shell.style.bottom = px(footerH) + 'px';
  }

  function watchBanner() {
    const b = document.querySelector(bannerSel);
    if (b) {
      new MutationObserver(() => requestAnimationFrame(recalc))
        .observe(b, { attributes: true, attributeFilter: ['class','style'] });
    } else {
      const addObs = new MutationObserver(() => {
        const bb = document.querySelector(bannerSel);
        if (bb) { watchBanner(); addObs.disconnect(); recalc(); }
      });
      addObs.observe(document.body, { childList: true, subtree: true });
    }
  }

  function init() {
    recalc();
    const ro = ('ResizeObserver' in window) ? new ResizeObserver(recalc) : null;
    const header = document.querySelector(headerSel);
    const footer = document.querySelector(footerSel);
    if (ro && header) ro.observe(header);
    if (ro && footer) ro.observe(footer);

    footer?.addEventListener('mouseenter', recalc, { passive: true });
    footer?.addEventListener('mouseleave', recalc, { passive: true });
    footer?.addEventListener('transitionend', recalc, { passive: true });

    watchBanner();
    window.addEventListener('resize', recalc);
    window.addEventListener('orientationchange', recalc);
    document.addEventListener('click', () => setTimeout(recalc, 0), true);
  }

  window.addEventListener('load', init);
  window.recalc = recalc;
})();
</script>
<!-- END: Page sizing for banner + sticky footer -->

<!-- START: Wistia HC fullscreen (GLOBAL, UNTOUCHED) -->
<script>
(function () {
  function allowFullscreenOnWrappers(root) {
    root.querySelectorAll('iframe').forEach(fr=>{
      const cur=(fr.getAttribute('allow')||'').toLowerCase();
      if(!cur.includes('fullscreen'))fr.setAttribute('allow',(cur?cur+'; ':'')+'fullscreen');
      if(!fr.hasAttribute('allowfullscreen'))fr.setAttribute('allowfullscreen','');
    });
  }
  function normalizeWistiaSrc(url){
    try{
      const u=new URL(url,location.href);
      if(u.hostname.endsWith('wistia.net')&&u.pathname.includes('/embed/iframe/')){
        u.searchParams.delete('web_component');
        u.searchParams.set('videoFoam','true');
        u.searchParams.set('seo','true');
      }
      return u.toString();
    }catch(e){return url;}
  }
  function patchWistiaFrame(f){
    let changed=false;
    const want=['autoplay','fullscreen','picture-in-picture'];
    const curAllow=(f.getAttribute('allow')||'').toLowerCase();
    const missing=want.filter(t=>!curAllow.includes(t));
    if(missing.length){
      f.setAttribute('allow',(curAllow?curAllow+'; ':'')+missing.join('; '));
      changed=true;
    }
    if(!f.hasAttribute('allowfullscreen')){
      f.setAttribute('allowfullscreen','');
      changed=true;
    }
    const orig=f.src;
    const next=normalizeWistiaSrc(orig);
    if(next!==orig){ f.src=next; f.dataset.wistiaPatched='1'; return; }
    if(changed&&!f.dataset.wistiaPatched){ f.dataset.wistiaPatched='1'; f.src=f.src; }
  }
  function run(root=document){
    allowFullscreenOnWrappers(root);
    root.querySelectorAll('iframe[src*="fast.wistia.net/embed/iframe/"]').forEach(patchWistiaFrame);
  }
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',()=>run(),{once:true});
  } else { run(); }
  window.addEventListener('load',()=>run(),{once:true});
  const mo=new MutationObserver(muts=>{
    for(const m of muts){
      if(m.type==='childList'){
        m.addedNodes.forEach(n=>{
          if(n.nodeType===1){
            if(n.tagName==='IFRAME'){
              allowFullscreenOnWrappers(document);
              if(n.src&&n.src.includes('fast.wistia.net/embed/iframe/'))patchWistiaFrame(n);
            }
            n.querySelectorAll?.('iframe').forEach(fr=>{
              allowFullscreenOnWrappers(document);
              if(fr.src&&fr.src.includes('fast.wistia.net/embed/iframe/'))patchWistiaFrame(fr);
            });
          }
        });
      }
    }
  });
  mo.observe(document.documentElement,{childList:true,subtree:true});
})();
</script>

<script>
(function(){
  const PATH=/^\/s\/foundations(?:\/|$)/i;
  if(!PATH.test(location.pathname||'')) return;

  const SEL='footer.cBrThemeFooter, .footer.cBrThemeFooter';
  const EXPANDED='277px', COLLAPSED='40px';
  function imp(el, prop, val){ try{ el.style.setProperty(prop, val, 'important'); }catch(e){} }

  function applySticky(f){
    if(!f || f.dataset.bcStickyBound) return;
    f.dataset.bcStickyBound='1';

    imp(f,'position','fixed');
    imp(f,'left','0'); imp(f,'right','0'); imp(f,'bottom','0');
    imp(f,'width','100%');
    imp(f,'height',COLLAPSED);
    imp(f,'overflow','hidden');
   imp(f,'z-index','900');
    imp(f,'transition','height .3s ease');

    function recalcSafe(){ try{ if(typeof recalc==='function') recalc(); }catch(e){} }
    function expand(){ imp(f,'height',EXPANDED); recalcSafe(); }
    function collapse(){ imp(f,'height',COLLAPSED); recalcSafe(); }

    f.addEventListener('mouseenter', expand, {passive:true});
    f.addEventListener('mouseleave', collapse, {passive:true});
    f.addEventListener('transitionend', recalcSafe, {passive:true});
    f.addEventListener('click', e=>{
      if(!matchMedia('(hover: hover)').matches){
        if(f.style.height===EXPANDED) collapse(); else expand();
        e.stopPropagation();
      }
    });
  }

  function init(){
    const f=document.querySelector(SEL);
    if(f){ applySticky(f); return; }
    const mo=new MutationObserver(()=>{
      const ff=document.querySelector(SEL);
      if(ff){ applySticky(ff); mo.disconnect(); }
    });
    mo.observe(document.documentElement,{childList:true,subtree:true});
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',init,{once:true});
  } else { init(); }
})();
</script>

<script>
(function(){
  const PATH=/^\/s\/foundations(?:\/|$)/i;

  function padScrollContainer(){
    if(!PATH.test(location.pathname||'')) return;
    // Apply to the actual scrolling element (html or body depending on theme)
    const sc = document.scrollingElement || document.documentElement;
    sc.style.setProperty('padding-bottom','40px','important');

    // Also apply to common wrappers just in case a wrapper scrolls
    ['.main-content','.body-inner','.wrapper-for-sticky-footer-structure','main'].forEach(sel=>{
      document.querySelectorAll(sel).forEach(el=>{
        el.style.setProperty('padding-bottom','40px','important');
      });

  }

<style id="themeCSS"></style><style id="customCSS">.slds-grid_align-center, .slds-grid--align-center{
    margin-bottom: 100px !important;
}
/* OOTB Tile Menu Updates */
.bg-white-skew{
    margin-top:25px !important;
}
/* End */

.visible {
    display:block !important;
}

.messageText { white-space: pre-wrap; }

/* To resolve the page layout issues when changing languages */
.row.row--pad {
   display: flex;
   flex-flow: row wrap;
}
.column-md-12.column-lg-6.column--pad.m-bottom-25 {
   display: flex;
   justify-content: center; 
}
/* For the login */
.cBrUserMenu .login {
   white-space: nowrap;
}

}

    box-shadow: 0 4px 10px 0 rgb(35 46 105 / 10%);

.slds-modal .slds-modal__container .detail {
    font-size: 16px;
}

.cuf-feedElement.cuf-feedItem[data-type="QuestionPost"]+.forceChatterFeedback .bottomBar:before {
     content: "Please do not share private information, such as your Support PIN, customer data, negotiated pricing rates, or any personally identifiable information regarding yourself or others.";

/* Footer collapse / expand (sticky footer) */
body.edu-page-foundations footer.cBrThemeFooter,

  position: fixed !important;
  left: 0 !important;
  right: 0 !important;
  bottom: 0 !important;
  height: 40px !important;
  overflow: hidden !important;
  z-index: 10000 !important;
  transition: height .3s ease !important;
}
body.edu-page-foundations footer.cBrThemeFooter:hover,
body.edu-page-foundations footer.cBrThemeFooter:focus-within,
body.edu-page-foundations .footer.cBrThemeFooter:hover,
body.edu-page-foundations .footer.cBrThemeFooter:focus-within {
  height: 277px !important;
}

/* Reserve space for the collapsed sticky footer on Foundations pages (default) */
body.edu-page-foundations .empty-block-for-sticky-footer {
  display: block !important;
  height: 40px;      /* match collapsed footer height */
  flex-shrink: 0;    /* if parent is a flex container */
}

/* Root /s/foundations only (no #ssmFrameShell): hide spacer */
html[data-path="foundations"][data-ssm-shell="absent"] body.edu-page-foundations .empty-block-for-sticky-footer {
  display: none !important;
  height: 0 !important;
  margin: 0 !important;
  padding: 0 !important;
}

/* Apply to multiple common containers to be robust to template changes */
html[data-path="foundations"][data-ssm-shell="absent"] body.edu-page-foundations,

html[data-path="foundations"][data-ssm-shell="absent"] body.edu-page-foundations .main-content,

.comm-page-article .article__body iframe.wistia_embed {
  display: block !important;
  vertical-align: top !important;
