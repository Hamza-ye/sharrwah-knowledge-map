  - region "How to use this tool":
    - paragraph:
      - text: To view the current requirements for your connected accounts, enter your configuration using the following form. Use the
      - strong: Requirement update
      - text: dropdown to see updated requirements for a current or upcoming requirement update. The
      - strong: Capabilities
      - text: dropdown only includes capabilities that are compatible with the selected configuration. To compare your current requirements with the requirements for a different configuration or upcoming update, select the
      - strong: Setup B
      - text: tab and enter the different configuration or update. Then turn on the
      - strong: Compare
      - text: toggle.
    - paragraph:
