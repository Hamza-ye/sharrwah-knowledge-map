    - heading "KYC verification" [level=4]:
      - text: KYC verification
      - button
    - paragraph: "European regulations require Stripe to verify the identity of certain persons associated with connected accounts. The following entities must provide verifiable KYC information:"
    - list:
      - listitem: Legal entity (for individuals and sole proprietor entities)
    - paragraph:
      - text: Learn more about
      - link "Identity verification for connected accounts":
        - /url: /connect/identity-verification#business-structure
      - text: .
    - paragraph:
      - text: "Stripe initially verifies identity using the information the account provides:"
      - code: first_name
      - text: ","
      - code: last_name
      - text: ","
      - code: dob
      - text: ", and"
      - code: address
      - text: . In applicable countries,
      - code: nationality
      - text: is also required, and
      - code: id_number
      - text: "is available as an optional field for verification. If verification fails, or if there are possible concerns about sanctions, you see the following additional requirement fields on the account:"
    - table:
      - rowgroup:
        - row "Field Usage":
          - columnheader "Field"
          - columnheader "Usage"
      - rowgroup:
