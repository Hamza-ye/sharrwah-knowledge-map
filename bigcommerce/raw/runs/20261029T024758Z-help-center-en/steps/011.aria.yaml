- heading "FAQ" [level=3]
- paragraph:
  - strong: Why don’t I see a certain channel?
- paragraph:
  - text: The channels that you see in Channel Manager are automatically shown based on your store’s country and currency settings. If you don’t see a particular channel, that could be because it is not available in your
  - link "country":
    - /url: /s/article/Store-Profile-Settings
  - text: ", or for your store’s"
  - link "default currency":
    - /url: /s/article/Managing-Currencies
  - text: . Some channels are only available to US stores using USD currency. See our support documentation for the channel for requirements.
- paragraph: If you’re sure your settings are compatible but you still aren’t seeing a certain channel, please contact our support team.
- paragraph:
  - strong: Why am I receiving an error message of "Loading Data Error"?
- paragraph:
  - text: If you encounter this error when accessing Channel Manager, ensure your user account has the Create Channels, Edit Channels, and Delete Channels
  - link "permissions":
    - /url: /s/article/User-Permissions
  - text: .
