    - listitem: Capabilities and information requirements
- article:
  - heading "Required verification information" [level=1]
  - heading "Identify current and future information requirements that connected accounts must provide based on their business, location, and requested capabilities." [level=2]
  - toolbar "Actions":
    - button "Ask about this page"
    - separator
    - button "Set up agent"
  - button "How to use this tool"
  - region "How to use this tool":
    - paragraph:
      - text: To view the current requirements for your connected accounts, enter your configuration using the following form. Use the
      - strong: Requirement update
      - text: dropdown to see updated requirements for a current or upcoming requirement update. The
      - strong: Capabilities
      - text: dropdown only includes capabilities that are compatible with the selected configuration. To compare your current requirements with the requirements for a different configuration or upcoming update, select the
      - strong: Setup B
      - text: tab and enter the different configuration or update. Then turn on the
      - strong: Compare
      - text: toggle.
    - paragraph:
      - text: See the
      - link "Connect integration guide":
        - /url: /connect/interactive-platform-guide
      - text: to learn more about connected account configurations.
  - button "View upcoming changes needed in Europe"
  - region "View upcoming changes needed in Europe":
    - paragraph:
      - text: Configure
      - strong: Setup A
      - text: to your current setup for accounts in Europe. Then repeat for
      - strong: Setup B
      - text: ", selecting Europe in the"
      - strong: Requirement update
      - text: field. Use the
      - strong: Compare
      - text: toggle to view differences.
    - paragraph:
      - text: Updates for Europe are subject to change.
      - link "Learn more about upcoming changes":
        - /url: https://support.stripe.com/questions/europe-verification-requirement-updates-for-connected-accounts
      - text: in Europe.
