- paragraph:
  - strong: Does PayPal support Level 2 and Level 3 data fields?
- paragraph:
  - text: Yes, Level 2 and Level 3 data fields are supported for corporate and purchase credit card transactions placed by commercial shoppers. See PayPal's
  - link "documentation":
    - /url: https://developer.paypal.com/docs/checkout/advanced/customize/processing/
  - text: for more information on supported card networks and data field mapping. Note that Level 2 and Level 3 cost optimization benefits are not applicable to debit cards.
- paragraph:
  - strong: Which Level 2 and Level 3 data fields are collected by PayPal?
- paragraph:
  - text: See PayPal’s
  - link "documentation":
    - /url: https://developer.paypal.com/docs/checkout/advanced/customize/processing/
  - text: for a list of required fields in order for transactions to be processed as Level 2 or Level 3. However, the card network and cardholder issuing bank are the final authority on determining whether a transaction qualifies for Level 2 or Level 3 processing.
- heading "TROUBLESHOOTING AND PAYMENT DISPUTES" [level=4]
- paragraph:
  - strong: What does the “Something’s gone wrong” error message mean?
- paragraph:
  - text: In some instances, payment issues are indicated through a generic error message that displays at checkout. Additional details are not able to be displayed if the processor doesn’t provide them when the payment fails. For a list of common errors and troubleshooting steps, see PayPal’s
  - link "Why was my payment declined?":
    - /url: https://www.paypal.com/us/cshelp/article/why-was-my-payment-declined-help419
- paragraph:
  - text: If a shopper receives this error when using a quick pay button at the top of the checkout or on product or cart pages, you may need to adjust the
  - link "button behavior":
    - /url: "#wallet-button-experience"
  - text: . When
  - emphasis: Pay Now
  - text: is selected, PayPal wallet is limited to 10 shipping options during checkout, including
  - link "BOPIS options":
    - /url: https://docs.bigcommerce.com/developer/docs/integrations/platform-solutions/buy-online-pick-up-in-store/overview
  - text: . If you offer more than 10 shipping and pickup options, select
  - emphasis: Redirect to checkout
  - text: instead.
- paragraph:
  - strong: How are payment disputes handled?
- paragraph:
  - text: Log in to your PayPal account and visit the
  - link "Resolution Center":
    - /url: https://www.paypal.com/resolutioncenter
  - text: .
- paragraph:
  - strong: How do I resolve "The requested action could not be performed, semantically incorrect, or failed business validation" errors?
- paragraph:
  - text: These errors in the
  - link "store logs":
    - /url: /s/article/Using-Store-Logs
  - text: are generally due to issues with your account credentials. To resolve, you must disconnect your current configuration and reconnect the PayPal integration.
- paragraph:
  - text: Go to
  - link "Settings › Payments":
    - /url: http://login.bigcommerce.com/deep-links/settings/payment
    - strong: Settings
    - text: ›
    - strong: Payments
  - text: and select the appropriate currency from the drop-down list. Click
  - strong: Online Payment Methods
  - text: ", then click the toggle switch next to"
  - strong: PayPal
  - text: .
- paragraph:
  - img "Toggle switch next to PayPal"
- paragraph:
  - text: Once disconnected, go back through the PayPal
  - link "setup flow":
    - /url: "#setup"
  - text: and connect the desired account.
- paragraph:
  - strong: What does the “Duplicate Invoice ID detected. To avoid a potential duplicate transaction your account setting requires that Invoice Id be unique for each transaction” error message mean?
- paragraph:
  - text: If you are starting a new BigCommerce store and are connecting an existing PayPal account that has past transactions, you will need to change your store's
  - link "Starting Order Number":
    - /url: /s/article/Order-ID
  - text: . By default, the store's starting order number is "100".
- paragraph: If you have an existing PayPal Invoice ID of "100", transactions will fail with an error message like "Duplicate Invoice ID detected. To avoid a potential duplicate transaction your account setting requires Invoice ID to be unique for each transaction."
- paragraph: To avoid this, you'll need to update your store’s Starting Order Number to a number higher than any of your existing PayPal Invoice IDs.
- paragraph: Once resolved, the issue should not affect any customers thereafter. If one of your customers has received the above error (prior to you resolving it), they will need to clear their cart and start over before they can successfully check out.
- paragraph:
  - strong: Why aren't my guest customers able to see the PayPal Checkout, PayPal Pay Later button, and Pay Later messaging on the cart page?
- paragraph:
  - text: If the PayPal Checkout, Pay Later button, and messaging is missing for guest customers only, it could be due to your store's customer settings in
  - link "Settings › Checkout":
    - /url: http://login.bigcommerce.com/deep-links/settings/payment
    - strong: Settings
    - text: ›
    - strong: Checkout
  - text: . Guest customers will not be able to access PayPal from the cart if either
  - emphasis: Customers must have or create an account to check out
  - text: or
  - emphasis: Require existing accounts to sign in
  - text: is enabled. See
  - link "Optimized One-Page Checkout":
    - /url: /s/article/Optimized-Single-Page-Checkout
  - text: for more information.
- paragraph:
  - strong: Why are the PayPal Pay Later messaging settings not appearing in my control panel?
- paragraph:
  - text: If your store does not meet the
  - link "requirements":
    - /url: "#https://docs.google.com/document/d/1UHeArGN2CaHypCKLzTPC4ZH4O0iVYuHejfu9u5YA5h8/edit#pay-later-requirements"
  - text: or is using a theme that does not support PayPal Pay Later messaging banners, such as an older
  - link "Stencil theme":
    - /url: /s/article/Stencil-Themes
  - text: or a
  - link "Blueprint theme":
    - /url: /s/article/Blueprint-Themes
  - text: ", Pay Later messaging settings will not display."
- paragraph:
  - strong: How do I contact PayPal’s Support team?
- paragraph:
  - text: Visit PayPal’s
  - link "Contact Us":
    - /url: https://www.paypal.com/us/cshelp/contact-us
  - text: page to get in touch with PayPal’s Support team.
