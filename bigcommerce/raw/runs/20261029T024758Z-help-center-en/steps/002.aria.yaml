  - /url: "#requirements"
- heading "Requirements" [level=3]
- list:
  - listitem:
    - text: Your store’s
    - link "checkout type":
      - /url: /s/article/Optimized-Single-Page-Checkout
    - text: must be
    - emphasis: Optimized One-Page Checkout
    - text: or
    - emphasis: Custom Checkout
    - text: .
  - listitem:
    - text: To set up and manage PayPal, you must have the
    - strong: Manage Payments
    - text: and
    - strong: Manage Settings
    - link "permissions":
      - /url: /s/article/User-Permissions
    - text: enabled on your user account.
  - listitem:
    - text: Your store must be in a supported country.
    - list:
      - listitem:
        - text: All countries
        - link "supported by PayPal":
          - /url: https://www.paypal.com/webapps/mpp/country-worldwide
        - text: are supported by BigCommerce, except India and Israel.
  - listitem:
    - text: You must have an existing or create a new
    - link "PayPal business account":
      - /url: https://www.paypal.com/unifiedonboarding/entry
    - text: .
