- heading "Store Profile Settings" [level=1]
- heading "What We'll Cover" [level=2]
- list:
  - listitem:
    - link "How it works":
      - /url: "#how"
  - listitem:
    - link "Requirements":
      - /url: "#requirements"
  - listitem:
