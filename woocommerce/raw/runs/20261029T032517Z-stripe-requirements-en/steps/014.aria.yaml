    - heading "Additional information" [level=2]
    - heading "Additional tax information" [level=4]:
      - text: Additional tax information
      - button
    - paragraph:
      - text: If Stripe can’t verify the
      - code: company.tax_id
      - text: ", upload a copy of"
      - link "an IRS Letter 147C document or an IRS SS-4 confirmation letter":
        - /url: https://support.stripe.com/questions/using-irs-documentation-as-reference-when-entering-business-name-and-tax-id-number-tin-for-us-based-businesses
      - text: using the
      - link "company.verification.document.front":
        - /url: /api/accounts/object#account_object-company-verification-document-front
      - text: parameter. The document must include the connected account’s
      - code: company.name
      - text: and
      - code: company.tax_id
      - text: .
    - heading "Supported business structures" [level=4]:
      - text: Supported business structures
      - button
    - paragraph:
      - text: Optionally, you can provide information on the
      - link "legal structure":
        - /url: /connect/identity-verification#business-structure
      - text: of your connected account’s business using the
      - link "company.structure":
        - /url: /api/accounts/create#create_account-company-structure
      - text: parameter.
    - paragraph: "Stripe supports the following business structures for privately held companies:"
    - list:
      - listitem:
        - code: multi_member_llc
      - listitem:
        - code: single_member_llc
      - listitem:
        - code: private_partnership
      - listitem:
        - code: private_corporation
      - listitem:
        - code: unincorporated_association
    - paragraph:
      - text: Stripe supports the following business structures for publicly traded companies. If you assign either of these structures to the business, then the
      - link "representative":
        - /url: "#additional-company-card-representative-us"
      - text: doesn’t need to be an owner or an executive, and you don’t need to provide information on additional owners.
    - list:
      - listitem:
        - code: public_corporation
      - listitem:
        - code: public_partnership
    - heading "Tax reporting information" [level=4]:
      - text: Tax reporting information
      - button
    - paragraph:
      - text: By default, the requirements for
      - code: transfers
      - text: don’t collect all information at the appropriate thresholds to file IRS Form 1099-K or Form 1099-MISC. If your business has US federal 1099 filing requirements and plans to file these through Stripe, request the
      - link "appropriate tax reporting capability":
        - /url: /connect/account-capabilities?accounts-namespace=v1#tax-reporting
      - text: and make sure to collect the
      - link "necessary information":
        - /url: /connect/required-verification-information-taxes
      - text: from your users.
    - heading "Threshold information" [level=4]:
      - text: Threshold information
      - button
    - paragraph:
      - text: In addition to the onboarding requirements, payouts require that you provide your connected account’s
      - code: company.tax_id
      - text: (EIN) before its charges reach a certain threshold. The threshold is either 10,000 USD or 3,000 USD, depending on your industry and Stripe’s review of your platform profile. If Stripe can’t verify your connected account’s EIN before it reaches the threshold, we disable payouts.
