    - heading "Additional information" [level=2]
    - heading "Processing live charges and receiving payouts" [level=4]:
      - text: Processing live charges and receiving payouts
      - button
    - paragraph:
      - text: In the UAE, company documents such as the
      - link "Trade License":
        - /url: /api/accounts/create#create_account-documents-company_license
      - text: and
      - link "Proof of Bank Account":
        - /url: /api/accounts/create#create_account-documents-bank_account_ownership_verification
      - text: as well as relevant identity documents must be verified before a connected account can start processing live charges and receiving
      - link "payouts":
        - /url: /payouts
      - text: . For all businesses except sole establishments and free zone establishments, the
      - link "Memorandum of Association":
        - /url: /api/accounts/create#create_account-documents-company_memorandum_of_association
      - text: must be verified as well.
    - heading "Uploading identity documents" [level=4]:
      - text: Uploading identity documents
      - button
    - paragraph: "For the company representative, beneficial owners and executives, we require the following identity documents for verification:"
    - list:
      - listitem: "Passport: all individuals"
      - listitem: "Emirates ID: UAE nationals & UAE residents"
      - listitem: "Residence visa: foreign nationals who are resident in the UAE"
    - paragraph:
      - text: The Emirates ID can be provided in the parameter called
      - link "verification.document":
        - /url: /api/persons/create#create_person-verification-document
      - text: . Passports and residence visas should be provided under a separate parameter called
      - link "documents":
        - /url: /api/persons/create#create_person-documents
      - text: .
    - heading "Keeping up to date with expired verification documents" [level=4]:
      - text: Keeping up to date with expired verification documents
      - button
    - paragraph:
      - text: In the UAE, Stripe is required to keep up to date with a company’s
      - link "Trade License":
        - /url: /api/accounts/update#update_account-documents-company_license
      - text: in addition to the primary identity document of the company’s representative, beneficial owners and executives. The primary identity document is either the Emirates ID for UAE nationals and residents, otherwise it’s an individual’s
      - link "Passport":
        - /url: /api/persons/update#update_person-documents-passport
      - text: . Companies have up to 28 days after the expiration date of these documents to provide an updated version. Expired documents appear under
      - link "company requirements":
        - /url: /api/accounts/object#account_object-requirements-currently_due
      - text: or
      - link "individual requirements":
        - /url: /api/persons/object#person_object-requirements-currently_due
      - text: and marked as currently due for 2 weeks before capabilities become disabled.
    - heading "Ultimate Beneficial Owners" [level=4]:
      - text: Ultimate Beneficial Owners
      - button
    - paragraph:
      - text: Stripe is required to verify all the
      - link "beneficial owners":
        - /url: https://support.stripe.com/questions/beneficial-owner-and-director-definitions
      - text: of a business. These are the individuals who own 25% or more of the primary business. If a
      - link "holding company":
        - /url: https://support.stripe.com/questions/beneficial-ownership-by-a-trust-holding-company-or-other-legal-entity
      - text: has 25% or more ownership of the business, then the Memorandum of Association of this holding company as well that of the primary business must be uploaded. These documents must show the persons where
      - link "relationship.owner":
        - /url: /api/persons/object#person_object-relationship-owner
      - text: is set to true.
    - heading "Additional information on the company representative" [level=4]:
      - text: Additional information on the company representative
      - button
    - paragraph:
      - text: This connected account needs to be activated by a person, known as the company representative, with significant responsibility to control, manage, or direct the organization and is authorized by the organization to agree to Stripe’s terms. The representative must either be
      - link "an owner or an executive":
        - /url: https://support.stripe.com/questions/beneficial-owner-and-director-definitions
      - text: ", which you specify by setting"
      - link "relationship.owner":
        - /url: /api/persons/object#person_object-relationship-owner
      - text: to
      - code: "true"
      - text: or
      - link "relationship.executive":
        - /url: /api/persons/object#person_object-relationship-executive
      - text: to
      - code: "true"
      - text: . For a sole establishment or free zone establishment, the account must be activated by the owner of the business.
    - heading "VAT Information" [level=4]:
      - text: VAT Information
      - button
    - paragraph:
      - text: Stripe doesn’t charge UAE VAT on Stripe fees to customers located in the UAE, where a valid UAE VAT ID has been provided. Local UAE VAT self-assessment obligations might be triggered upon receipt of a monthly
      - link "invoice":
        - /url: /api/invoices
      - text: from Stripe. Stripe does charge UAE VAT at 5% on Stripe fees to customers located in the UAE, where a valid UAE VAT ID hasn’t been provided.
    - heading "Power of Attorney" [level=4]:
      - text: Power of Attorney
      - button
    - paragraph:
      - text: If the company representative doesn’t appear on the company’s Trade License or the Memorandum of Association, then you must upload a
      - link "Power of Attorney":
        - /url: /api/persons/update#update_person-documents-company_authorization
      - text: that shows that the company representative has the authority to act on behalf of the company or a notarized letter of authorization.
    - heading "Supported business structures" [level=4]:
      - text: Supported business structures
      - button
    - paragraph:
      - text: In the UAE, the only possible business type is
      - code: company
      - text: and the following
      - link "business structures":
        - /url: /connect/identity-verification#business-structure
      - text: "are accepted:"
    - list:
      - listitem:
        - code: sole_establishment
      - listitem:
        - code: free_zone_establishment
      - listitem:
        - code: llc
      - listitem:
        - code: free_zone_llc
