- paragraph:
  - text: The
  - link "Settings":
    - /url: http://login.bigcommerce.com/deep-links/settings-list
    - strong: Settings
  - text: page is a centralized location for many key functions of your store. From here, you can configure and manage multiple features ranging from your store’s basic information, to payment and shipping methods, up through more advanced tools, such as API accounts.
- paragraph: This article provides an overview of the groupings and individual sections of the Settings page, as well as links to related articles containing more detail.
- link:
  - /url: "#requirements"
- heading "Requirements" [level=3]
- list:
  - listitem:
    - text: To view and manage your store’s settings, the
    - strong: Manage Settings
    - link "permission":
      - /url: /s/article/User-Permissions
    - text: must be enabled on your user account.
  - listitem: Depending on the area being managed, you may need additional permissions. See the relevant linked articles for specific requirements.
