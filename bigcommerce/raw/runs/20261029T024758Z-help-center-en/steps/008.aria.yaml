- paragraph: Your BigCommerce invoices can be found in the Account Dashboard. They contain line items for your BigCommerce store plan, Open Payment Provider and plan overage fees, additional storefront charges, and Unified Billing apps subscriptions. Generated invoices are sent to the email address listed as your Billing Contact.
- link:
  - /url: "#requirements"
