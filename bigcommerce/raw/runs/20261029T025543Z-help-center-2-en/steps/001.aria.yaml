          - /url: https://www.bigcommerce.com/pricing/
        - text: .
      - listitem:
        - strong: Enable real-time account updater
        - text: — When stored credit cards are enabled, check to enable
        - link "real-time account updater":
          - /url: https://www.paypal.com/us/cshelp/article/what-is-real-time-account-updater-and-what-do-i-need-to-do-to-prepare-my-integration--ts2271
        - text: ", an optional paid service that automatically updates stored card information, such as new numbers, new expiration dates, and closed accounts."
        - list:
          - listitem:
            - text: Real-time account updater must first be activated in your PayPal account
            - link "Payment Preferences":
              - /url: https://www.paypal.com/businessmanage/account/paymentPreferences
            - text: .
          - listitem: Only stored Mastercard and Visa cards are supported.
          - listitem: Real-time account updater cannot be used with stored PayPal accounts.
      - listitem:
        - strong: Enable automated card delete
        - text: — When real-time account updater is enabled, check to automatically delete closed customer cards from a customer’s list of saved payment methods.
  - listitem:
    - strong: Stored PayPal Accounts
    - text: — When
    - link "PayPal Checkout":
      - /url: "#digital-wallets"
    - text: is enabled, check to allow customers to
    - link "save their PayPal account credentials":
      - /url: /s/article/Enabling-Stored-Payment-Methods
    - text: on your storefront for quicker checkout.
    - list:
      - listitem:
        - text: Your store must be on a
        - link "Growth plan or higher":
          - /url: https://www.bigcommerce.com/pricing/
        - text: .
      - listitem:
        - text: Note that
        - link "Pay Later":
          - /url: "#bnpl"
        - text: is disabled when stored PayPal accounts are enabled
  - listitem:
    - strong: Require CVV for manual orders
    - text: — Check to require CVV/CVV2/CVSD code during
    - link "manual order creation":
      - /url: /s/article/Creating-a-Manual-Order
    - text: in the BigCommerce control panel.
    - list:
      - listitem:
        - text: Note that this setting
        - strong: must be
        - text: enabled to process manual orders using credit cards through BigCommerce Payments.
- heading "POST PURCHASE & OPERATIONS" [level=4]
- paragraph:
  - text: When enabled, post-purchase settings allow order details like item names, product images, and shipping tracking numbers to be automatically shared with PayPal. This allows customers to track their orders in the
  - link "PayPal app":
    - /url: https://www.paypal.com/us/digital-wallet
  - text: or use the automated dispute resolution process, should an issue occur.
  - strong: Note that only orders using BigCommerce Payments will be synced.
- paragraph:
  - img "Post-Purchase & Operations section in BigCommerce Payments settings"
- list:
  - listitem:
    - strong: Sync order statuses
    - text: — Check to share order actions and statuses in BigCommerce with PayPal.
