- heading "Changing Your Default Currency" [level=3]
- paragraph:
  - text: To change your store's default currency, you will first need to add the currency that you want to be the new default, if it’s not already present in your store. Once this is done, go to
  - link "Settings › Currencies":
    - /url: http://login.bigcommerce.com/deep-links/settings/currencies
    - strong: Settings
    - text: ›
    - strong: Currencies
  - text: ", and click"
  - strong: Action
  - text: ›
  - strong: Set as default
  - text: next to the desired currency. You can also do this while editing the currency.
- paragraph:
  - img "Set as default highlighted on the Managing Currencies page"
- link:
  - /url: "#faq"
- heading "FAQ" [level=3]
- paragraph:
  - strong: How do I set up a storefront-specific default currency with multi-storefront?
- paragraph:
  - text: By default, a
  - link "multi-storefront":
    - /url: /s/article/Multi-Storefront
  - text: store will use the default currency enabled in
  - strong: Settings
  - text: ›
  - strong: Currencies
  - text: . To assign a storefront-specific default currency, go to
  - strong: Channel Manager
  - text: and click a storefront name to access its settings page. In
  - strong: Currencies
  - text: ", click on the Action menu and select"
  - strong: Set as Channel default currency
  - text: .
- paragraph:
  - img "Go to the storefront's Currency settings and select Set as Channel default currency."
- paragraph:
  - strong: How do I assign currencies to my storefront channels?
- paragraph:
  - text: If you have
  - link "multiple storefronts":
    - /url: /s/article/Multi-Storefront
  - text: ", you can select the currencies that appear for each storefront. Open the"
  - strong: Channels
  - text: menu next to a currency and select
  - strong: Manage channels
  - text: . Select the desired storefronts for the currency and click
  - strong: Apply
  - text: .
- paragraph:
  - img "The Manage Channels modal for a currency, with two storefronts selected"
