- paragraph: Multi-storefront payment settings allow you to configure the payment methods that appear on each of your different storefronts. This is useful for multi-brand, multi-segment, or multi-region use cases where you might want to show unique payment methods per storefront, or the same payment methods with settings unique to each storefront.
- paragraph:
  - img "Payments page displaying the Multi-storefront payment methods experience."
- link:
  - /url: "#howitworks"
- heading "How It Works" [level=3]
- paragraph: A payment provider can have multiple payment configurations, which allows the same payment provider to be set up multiple times using different merchant accounts, currencies, and settings in a single store. Once created, payment configurations are manually assigned to their intended channels. Configurations are unassigned by default, preventing them from appearing on unintended storefronts.
- paragraph: "To help explain how they might be used, below are some possible use cases for payment configurations:"
- heading "Multi-region" [level=4]
- list:
  - listitem: Use one merchant account with one payment provider to service multiple geographies in multiple currencies.
  - listitem: Use multiple merchant accounts with one payment provider to service multiple geographies in multiple currencies.
  - listitem: Use one merchant account per provider with multiple payment providers to service multiple geographies in multiple currencies.
- heading "Multi-brand" [level=4]
- list:
  - listitem: Use one merchant with one payment provider to service multiple brands in the same geography with the same currency.
  - listitem: Use multiple merchant accounts with one payment provider to service multiple brands in the same geography with the same currency.
  - listitem: Use multiple merchant accounts with multiple payment providers to service multiple brands in multiple currencies.
- heading "Multi-segment" [level=4]
- list:
  - listitem: Use one merchant account with one payment provider to service multiple segments in the same geography in the same currency.
  - listitem: Use multiple merchant accounts with multiple payment providers to service multiple segments in the same geography in the same currency.
