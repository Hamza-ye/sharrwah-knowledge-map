- heading "Optimized One-Page Checkout (OOPC)" [level=4]
- list:
  - listitem:
    - link "Out-of-the-box checkout":
      - /url: /s/article/Optimized-Single-Page-Checkout
    - text: for native BigCommerce storefronts
  - listitem: Optimized to drive high conversion rates
  - listitem: Minor styling and display customizations
  - listitem:
    - text: Checkout URL — mystore.com/
    - strong: checkout
    - list:
      - listitem: The checkout page is a URL path that comes after the storefront root domain
- heading "Open Checkout" [level=4]
- list:
  - listitem:
    - link "Customize the native BigCommerce storefront checkout":
      - /url: https://docs.bigcommerce.com/docs/storefront/cart-checkout/open-checkouts/guide
    - text: for greater control over your checkout experience
  - listitem: Acts as a starter kit for a custom checkout, without the need to build a checkout from scratch
  - listitem: Built with React and compiles into a static JavaScript bundle
  - listitem:
    - text: Checkout URL — mystore.com/
    - strong: checkout
    - list:
      - listitem: The checkout page is a URL path that comes after the storefront root domain
- heading "Redirected Checkout" [level=4]
- list:
  - listitem:
    - text: Redirects shoppers from your
    - link "Headless":
      - /url: https://docs.bigcommerce.com/docs/storefront/headless
    - text: or
    - link "Composable":
      - /url: https://docs.bigcommerce.com/docs/storefront
    - text: storefront to your BigCommerce storefront checkout page
  - listitem: Unlocks the full BigCommerce checkout experience, including hosted wallets
  - listitem: Customize your checkout layout through Stencil framework or Checkout SDK
  - listitem:
    - text: Checkout URL —
    - strong: checkout
    - text: .mystore.com/
    - strong: checkout
  - listitem:
    - text: The BigCommerce storefront domain must be served from a subdomain of the root domain
    - list:
      - listitem: The checkout page is a URL path that comes after the storefront root domain
- heading "Embedded Checkout" [level=4]
- list:
  - listitem: The BigCommerce storefront checkout page is embedded via an iframe, keeping shoppers on your headless storefront
  - listitem:
    - text: Recommended for simple headless setups, such as
    - link "BigCommerce for Wordpress":
      - /url: /s/article/BigCommerce-for-WordPress
  - listitem:
    - text: Supported by many
    - link "payment gateways":
      - /url: /s/article/Available-Payment-Gateways
    - text: ", but not compatible with all digital wallets"
  - listitem:
    - text: Minor
    - link "styling and display customizations":
      - /url: /s/article/Optimized-Single-Page-Checkout
  - listitem:
    - text: Checkout URL —
    - strong: checkout
    - text: .mystore.com
    - list:
      - listitem: The BigCommerce storefront domain must be served from a subdomain of the root domain
      - listitem: The embedded checkout page’s URL is not visible to shoppers
- heading "Custom Headless Checkout" [level=4]
- list:
  - listitem:
    - text: Full control over your headless storefront checkout using
    - link "BigCommerce Cart and Checkout APIs":
      - /url: https://docs.bigcommerce.com/docs/storefront/cart-checkout/guide/graphql-storefront
  - listitem: Keeps shoppers on your headless storefront without the need for a redirect
  - listitem:
    - text: Processes payments using the
    - link "Payments API":
      - /url: https://docs.bigcommerce.com/docs/store-operations/payments
  - listitem:
    - text: Checkout URL — mystore.com/
    - strong: checkout
    - list:
      - listitem: The checkout page is a URL path that comes after the storefront root domain
- link:
  - /url: "#faq"
- heading "FAQ" [level=3]
- paragraph:
  - strong: Do I need a developer?
- paragraph:
  - text: A developer is
  - strong: highly recommended
  - text: if you want to explore custom checkouts or headless storefronts. You can find a list of BigCommerce certified developers in our
  - link "Partner Directory":
    - /url: https://partners.bigcommerce.com/directory/
  - text: .
- paragraph:
  - strong: Are the different checkout configurations limited to certain plans?
- paragraph: No, the checkout configurations listed above are available to all store plans.
- paragraph:
  - strong: Why does the Redirected and Embedded checkout URL need to be a subdomain of the storefront root domain?
- paragraph: Shoppers will encounter security errors and the checkout page will not load properly if the headless storefront domain doesn’t match the BigCommerce storefront domain.
- paragraph:
  - text: You can configure your store’s
  - link "checkout domain":
    - /url: /s/article/Domain-Settings-for-Headless-Storefronts
  - text: in Channel Manager or by upserting the URL
  - link "via API":
    - /url: https://docs.bigcommerce.com/docs/rest-management/channels/site-checkout-url#upsert-a-site%CA%BCs-checkout-url
  - text: .
- paragraph:
  - strong: What checkout configurations are available for stores using Multi-Storefront?
- paragraph:
  - text: Stores with
  - link "more than one storefront":
    - /url: /s/article/Single-Storefront-vs-Multi-Storefront
  - text: can use any of the checkout configurations listed above. In addition, several checkout settings can be configured
  - link "uniquely per storefront":
    - /url: /s/article/Multi-Storefront
  - text: .
- paragraph:
  - strong: Can I control the www redirect for my headless channel's unique checkout URL?
- paragraph:
  - text: Yes, you can manage the setting via the
  - strong: Storefront SEO
  - link "API endpoint":
    - /url: https://docs.bigcommerce.com/docs/rest-management/settings/storefront-seo#update-storefront-seo-settings
  - text: .
