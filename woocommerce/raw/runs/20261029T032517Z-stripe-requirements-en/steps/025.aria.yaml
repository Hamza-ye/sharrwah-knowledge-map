    - heading "Additional information on the individual" [level=4]:
      - text: Additional information on the individual
      - button
    - paragraph:
      - text: Depending on the situation, you might need to collect a scan of an
      - link "ID document":
        - /url: /connect/handling-api-verification#acceptable-verification-documents
      - text: ", an address document, or both to enable payouts. That can happen if Stripe can’t verify the individual or if there are possible concerns about"
      - link "sanctions":
        - /url: /connect/risk-management/best-practices#sanctions-concerns
      - text: . In some cases, depending on various calculated risk factors, Stripe can use Simplified Due Diligence and request only one document for verification at a later time.
    - paragraph:
      - text: Collect ID information using the
      - link "individual.verification.document.front":
        - /url: /api/accounts/update#update_account-individual-verification-document-front
      - text: and
      - link "individual.verification.document.back":
        - /url: /api/accounts/update#update_account-individual-verification-document-back
      - text: parameters, and address information using the
      - link "verification.additional_document.front":
        - /url: /api/persons/object#person_object-verification-additional_document-front
      - text: and
      - link "verification.additional_document.back":
        - /url: /api/persons/object#person_object-verification-additional_document-back
      - text: parameters.
    - heading "Onboarding as a government entity" [level=4]:
