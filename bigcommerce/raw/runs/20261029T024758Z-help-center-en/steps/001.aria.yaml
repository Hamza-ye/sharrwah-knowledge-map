    - text: for future transactions.
  - listitem:
    - strong: Recurring Payments
    - text: —
    - link "Recurring or subscription payments":
      - /url: /s/article/Setting-up-Recurring-Billing
    - text: are supported.
  - listitem:
    - strong: MSF Payments
    - text: — Supports
    - link "multiple payment configurations":
      - /url: /s/article/Multi-Storefront-Payment-Methods
    - text: .
