- paragraph:
  - text: To get started, go to
  - link "Settings › Payments":
    - /url: http://login.bigcommerce.com/deep-links/settings/payment
    - strong: Settings
    - text: ›
    - strong: Payments
  - strong: .
- paragraph:
  - text: Multi-storefront payment settings are enabled from the banner at the top of the page by clicking
  - strong: Switch to the new Payment Settings page
  - text: . You can switch back to the previous experience at any time.
- paragraph:
  - img "Banner with button to switch to the new payments page highlighted."
- paragraph: Once enabled, the page will show all of your currently connected payment methods and their respective payment configurations.
- heading "Adding New Payment Configurations" [level=4]
- paragraph:
  - text: Create a new configuration by clicking
  - strong: Add Payment Configuration
  - text: . If your provider
  - link "supports multiple accounts":
    - /url: "#supported-providers"
  - text: ", you can repeat these steps to add additional configurations per currency."
- paragraph:
  - img "Add Payment Configuration button highlighted."
- paragraph:
  - text: On the next page, select a currency from the drop-down list, click the
  - strong: Embedded
  - text: or
  - strong: Open
  - text: tab, then expand
  - strong: Offline Payment Methods
  - text: ","
  - strong: Online Payment Methods
  - text: ", or"
  - strong: Digital Wallets
  - text: .
- paragraph:
  - img "Currency drop-down, Embedded and Open tabs, and Additional Providers lists highlighted."
- text: 
- paragraph:
  - strong: What is an Open Payment Provider fee?
  - text: For stores on
  - link "self-serve plans":
    - /url: https://www.bigcommerce.com/pricing/
  - text: ", orders processed using offline payment methods and payment providers that are not on our"
  - link "Embedded Payment Provider list":
    - /url: /s/article/Available-Payment-Gateways
  - text: are assessed an Open Payment Provider fee. Orders processed through Embedded Payment Providers and Performance plan stores operating under contracted terms are not subject to this fee.
- paragraph:
  - text: Click
  - strong: Add
  - text: next to your desired payment method.
- paragraph:
  - img "Add button highlighted next to a payment provider."
- paragraph:
  - text: On the payment configuration page, you can update the selected currency and specify a
  - strong: Configuration name
  - text: . Enter any required account credentials, such as API keys, and set up any desired provider-specific settings.
- paragraph:
  - img "Currency drop-down and Configuration name field within payment method settings."
- paragraph:
  - text: For individual provider setup information, see
  - link "Available Payment Gateways":
    - /url: /s/article/Available-Payment-Gateways
  - text: ", which contains a list of payment gateways and links to their documentation."
- paragraph:
  - text: When you’re done, click
  - strong: Save
  - text: .
- text: 
- paragraph:
  - strong: "Configuration name vs Display name:"
  - emphasis: Configuration name
  - text: is an internal label to help you identify different payment configurations in the control panel and does not display on the storefront.
  - emphasis: Display name
  - text: is a method or provider-specific setting and is displayed on the storefront checkout page. Use clear display names such as “Credit/Debit Cards” or “Local Payment Methods” on payment provider settings to guide customers as they complete checkout.
- heading "Managing Storefront Channel Visibility" [level=4]
- paragraph: After creating configurations, you will see them listed on the payments settings page.
- paragraph:
  - text: Note that configurations
  - strong: are not
  - text: automatically visible on storefronts, but instead are manually assigned. This prevents them from mistakenly appearing on unintended channels.
- paragraph:
  - text: To assign a payment configuration to a storefront, click
  - strong: Manage Channel Visibility
  - text: and select it from the drop-down list.
- paragraph:
  - img "Manage Channel Visibility drop-down highlighted."
- paragraph:
  - text: On the payment configurations pop-up window, check the box next to the ones you want to appear on this storefront, then click
  - strong: Assign
  - text: .
- paragraph:
  - img "Configuration checkboxes and Assign button highlighted on the configuration assignment popup window."
- paragraph:
  - text: On the Payments page, you can view which storefronts a configuration is assigned to by clicking the
  - strong: "Visible on # channel(s)"
  - text: drop-down under the configuration name.
- paragraph:
  - img "Channel visibility drop-down highlighted."
- paragraph:
  - text: Edit or delete a configuration from the options on the
  - strong: Action
  - text: menu (
  - strong: ⋯
  - text: ).
- paragraph:
  - img "Configuration Action menu highlighted."
- paragraph:
  - text: You can also view payment configurations and manage their visibility directly through individual storefront channel settings by going to
  - strong: Channels
  - text: ›
  - strong: Channel Manager
  - text: ›
  - strong: "[Storefront name]"
  - text: ›
  - strong: Payments
  - text: .
- paragraph:
  - img "Channel Payments list."
