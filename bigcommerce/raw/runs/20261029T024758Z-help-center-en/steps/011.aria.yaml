- heading "Managing a Channel" [level=4]
- paragraph:
  - text: If you need to change or edit any settings for a channel (such as settings you set up when you first connected the channel), you can do this from the Channel Manager overview page. Click the
  - strong: ⋯
  - text: next to the channel and select
  - strong: Edit Settings
  - text: .
