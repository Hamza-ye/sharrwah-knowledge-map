- heading "TRANSACTION SETTINGS" [level=4]
- paragraph:
  - img "Transaction Settings section of BigCommerce Payments settings"
- list:
  - listitem:
    - strong: Transaction type
    - text: — Select
    - emphasis: Authorize and capture
    - text: to automatically charge customers or
    - emphasis: Authorize only
    - text: to manually capture funds. To learn more, see
    - link "Manually Capturing Transactions (Authorize Only)":
      - /url: /s/article/Manually-Capturing-Transactions-Authorize-Only
    - text: .
    - list:
      - listitem:
        - text: Note that certain
        - link "digital wallet":
          - /url: "#digital-wallets"
        - text: and
        - link "Buy Now, Pay Later":
          - /url: "#bnpl"
        - text: transactions use
        - emphasis: Authorize and capture
        - text: regardless of this setting.
  - listitem:
    - strong: Use 3D Secure
    - text: — Check to enable
    - link "3D Secure":
      - /url: /s/article/3D-Secure
    - text: ", an extra layer of security that prompts shoppers to enter a password for their credit/debit card and"
    - link "Fastlane payments":
      - /url: "#fastlane"
    - text: during checkout.
    - list:
      - listitem:
        - strong: Strong Customer Authentication when required
        - text: — Select this option to only enforce
        - link "Strong Customer Authentication":
          - /url: https://developer.paypal.com/reference/guidelines/psd2-compliance/sca/
        - text: (SCA) based on local regulations.
      - listitem:
        - strong: Strong Customers Authentication always
        - text: — Select this option to enforce SCA on all credit/debit card and Fastlane transactions.
  - listitem:
