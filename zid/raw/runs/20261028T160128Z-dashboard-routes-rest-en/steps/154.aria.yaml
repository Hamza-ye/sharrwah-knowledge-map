  - paragraph:
    - text: MISpay allows merchants to use buy now and pay later service in their stores. By choosing MISpay, customers can easily split payments — just pay one part of the amount immediately and the rest over the next month.
    - strong:
      - text: For more information, please visit our
      - link "Business Platform":
        - /url: https://www.mispay.co/partners
  - paragraph:
    - paragraph: Payment Options
    - paragraph: MISPay is your growth partner. Always stay on top of your payments by managing customer purchases with MISPay.
    - paragraph: Why MISPay is the right choice for you?
    - list:
      - listitem: Our products have been certified as Shariyah compliant by the Shariyah Review Bureau.
      - listitem: Give your customers the ultimate flexibility when paying and turn your customers into loyal customers.
      - listitem: Give your customers the ability to buy what they love today with a seamless and intuitive shopping experience.
      - listitem: You always get paid within the typical payment settlement, your customers pay at a later date. It doesn’t get simpler.
      - listitem: We will continually drive new customers to you from our app, website, and other channels.
      - listitem: We assume credit and fraud risk, so you can focus on running a successful business.
