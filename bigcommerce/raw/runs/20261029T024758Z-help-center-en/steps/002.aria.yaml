- paragraph: The PayPal payment gateway is a unified payments integration that allows you to accept payments in over 100 currencies from 325 million active customers across 200 markets.
- paragraph: "PayPal offers several features to optimize checkout conversion and grow your business:"
- list:
  - listitem:
    - link "local payment methods":
      - /url: "#apm"
    - text: and
    - link "PayPal Pay Later":
      - /url: "#pay-later"
    - text: to expand your global customer base and encourage larger purchases
  - listitem:
    - link "Fastlane by PayPal":
      - /url: "#fastlane"
    - text: provides guest shoppers a fast, passwordless checkout solution
  - listitem: stored credit cards and PayPal accounts
  - listitem: real-time Account Updater to automatically refresh stored card information when it expires
  - listitem: risk management tools to prevent fraud and minimize chargebacks
  - listitem: Level 2 and 3 data collection for commercial transactions
- text: 
- paragraph:
  - strong: This article contains information for the standalone PayPal payment gateway.
  - text: For information about the PayPal alternative payment method, see
  - link "PayPal":
    - /url: /s/article/PayPal
  - text: .
