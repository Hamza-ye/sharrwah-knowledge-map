- heading "AUTO-MIGRATION TO BIGCOMMERCE PAYMENTS" [level=4]
- text: 
- paragraph:
  - strong: This section only pertains to stores that automatically migrated to BigCommerce Payments after receiving communications from BigCommerce and PayPal.
  - text: If you did not receive a notification from PayPal regarding an automatic migration, your store is unaffected and you can refer to the FAQ sections from
  - link "General":
    - /url: "#general"
  - text: and below.
- paragraph:
  - strong: What is the difference between PayPal Checkout integration on BigCommerce and BigCommerce Payments, powered by PayPal?
- paragraph:
  - text: Your current integration,
  - link "PayPal Checkout on BigCommerce":
    - /url: /s/article/Connecting-with-PayPal
  - text: is a standalone PayPal integration that allows you to receive payments to your PayPal account. As part of this migration you would move to BigCommerce Payments, powered by PayPal, which is a native payment solution built directly into the BigCommerce platform.
- paragraph:
  - text: BigCommerce Payments allows you to accept major payment methods, including PayPal, Pay Later, Venmo*, credit and debit cards, and more, while managing your payments operation from your BigCommerce control panel. This includes a dedicated
  - link "Balance dashboard":
    - /url: "#balance-dashboard"
  - text: to track your funds and payouts, tools to handle refunds and disputes, and automatic order syncing with PayPal for streamlined reporting and customer communication.
- paragraph: "*Not available in the United Kingdom."
- paragraph:
  - strong: I'm currently using PayPal Checkout on BigCommerce. Do I have to switch to BigCommerce Payments?
- paragraph: The migration to BigCommerce Payments is being rolled out in waves. If your account is selected, your payment processing will automatically move to BigCommerce Payments on a scheduled date unless you choose to opt out. You will receive an email from PayPal with your migration date and instructions on how to opt out if you prefer to stay on your current setup.
- paragraph:
  - strong: If I opt out of auto-migration, can I set up BigCommerce Payments later?
- paragraph:
  - text: Yes. If you opt out of the migration, you can
  - link "set up BigCommerce Payments":
    - /url: "#setup"
  - text: at any time from your BigCommerce control panel under
  - strong: Settings › Payments
  - text: .
- paragraph:
  - text: Note that stores that are migrated to BigCommerce Payments are subject to the fees
  - link "listed here":
    - /url: "#migration-fees"
  - text: . Stores that set up BigCommerce Payments at a later date follow the fee structure listed in the FAQ under
  - link "Pricing and Fees":
    - /url: "#fees"
  - text: .
- paragraph:
  - strong: What happens to my existing PayPal account if I migrate to BigCommerce Payments?
- paragraph: When you move to BigCommerce Payments, a brand new PayPal platform account dedicated to your BigCommerce store is created and will handle all settlement from your BigCommerce store going forward. The BigCommerce Payments account is automatically linked to your PayPal Business account, which remains fully operational, and you retain full access to it.
- paragraph:
  - text: You can view your BigCommerce Payments account through your
  - link "Balance dashboard":
    - /url: "#balance-dashboard"
  - text: . You can also access it by
  - link "logging in to your PayPal account":
    - /url: https://www.paypal.com/signin
  - text: ", clicking your business name in the upper left, and in the pop-up window, clicking on your BigCommerce Payments account under"
  - strong: Platform accounts
  - text: .
- paragraph:
  - strong: Will the migration cause any disruption to my store?
- paragraph: Your store will continue to accept payments throughout the migration process, and your customers' checkout experience will not be interrupted. Once the migration is complete, all new transactions will be processed through your BigCommerce Payments account.
- paragraph:
  - text: If you decide to migrate to BigCommerce Payments and change your mind before the migration date and want to be excluded,
  - link "contact BigCommerce Support":
    - /url: https://support.bigcommerce.com/s/#contact
  - text: .
- paragraph:
  - strong: What fees apply after I migrate to BigCommerce Payments?
- paragraph: Your fees will not change and will remain the same as what you are charged today for PayPal and cards.
- paragraph:
  - text: Your rates will not change for at least
  - strong: 6 months
  - text: after migration. After this period, and for net new merchants, payments processed through BigCommerce Payments will follow the fee structure listed in the FAQ under
  - link "Pricing and Fees":
    - /url: "#fees"
  - text: .
- paragraph:
  - text: Payments processed through your existing PayPal account outside of BigCommerce will continue to follow standard
  - link "PayPal merchant fees":
    - /url: https://www.paypal.com/us/business/paypal-business-fees
  - text: .
- paragraph:
  - strong: Can I still use my existing PayPal account independently after migrating to BigCommerce Payments?
- paragraph: Yes. Your existing PayPal Business account remains fully functional. You can continue to use it for invoicing, in-store payments, or any other PayPal services. The new BigCommerce Payments platform account only handles the transactions coming through your BigCommerce store.
- paragraph:
  - strong: Where will my past transaction history and reporting be available after the migration?
- paragraph:
  - text: Your past account activity from PayPal Checkout on BigCommerce will remain accessible in your
  - link "PayPal dashboard":
    - /url: https://www.paypal.com/myaccount/home
  - text: .
- paragraph:
  - text: Going forward, you'll manage your BigCommerce Payments orders, payouts, refunds, and disputes from the BigCommerce control panel. You can also access your BigCommerce Payments transaction activity by
  - link "logging in to your PayPal account":
    - /url: https://www.paypal.com/signin
  - text: ", clicking your business name in the upper left, and in the pop-up window, clicking on your BigCommerce Payments account under"
  - strong: Platform accounts
  - text: .
- paragraph:
  - strong: How will I receive communications about my BigCommerce Payments integration?
- paragraph: Once you're on BigCommerce Payments, any updates, changes, or notices related to your integration will come from BigCommerce.
- paragraph:
  - strong: Who should I contact for support with my BigCommerce Payments integration?
- paragraph:
  - text: If you have questions about your BigCommerce Payments integration, need help with your setup, or would like to discontinue the service,
  - link "contact the BigCommerce support team":
    - /url: https://support.bigcommerce.com/s/#contact
  - text: .
- heading "GENERAL" [level=4]
- paragraph:
  - strong: What is the difference between PayPal Checkout integration on BigCommerce and BigCommerce Payments, powered by PayPal?
- paragraph:
  - link "PayPal Checkout on BigCommerce":
    - /url: /s/article/Connecting-with-PayPal
  - text: is a standalone PayPal integration that allows you to receive payments to your PayPal account. BigCommerce Payments, powered by PayPal, is a native payment solution built directly into the BigCommerce platform.
- paragraph:
  - text: BigCommerce Payments allows you to accept major payment methods, including PayPal, Pay Later, Venmo, credit and debit cards, and more, while managing your payments operation from your BigCommerce control panel. This includes a dedicated
  - link "Balance dashboard":
    - /url: "#balance-dashboard"
  - text: to track your funds and payouts, tools to handle refunds and disputes, and automatic order syncing with PayPal for streamlined reporting and customer communication.
- paragraph:
  - strong: What is the difference between a BigCommerce Payments account and a PayPal Business account?
- paragraph: When you connect BigCommerce Payments, a brand new PayPal platform account dedicated to your BigCommerce store is created. The BigCommerce Payments account is automatically linked to your PayPal Business account.
- paragraph: "These are two distinct accounts:"
- list:
  - listitem: Your existing PayPal Business account remains fully intact and operational. Nothing about it changes.
  - listitem: Your new BigCommerce Payments account is what processes and settles all transactions made through your BigCommerce store going forward.
- paragraph:
  - text: You can view your BigCommerce Payments account through your
  - link "Balance dashboard":
    - /url: "#balance-dashboard"
  - text: . You can also access it by
  - link "logging in to your PayPal account":
    - /url: https://www.paypal.com/signin
  - text: ", clicking your business name in the upper left, and in the pop-up window, clicking on your BigCommerce Payments account under"
  - strong: Platform accounts
  - text: .
- text: 
- paragraph:
  - strong: "Note:"
  - text: For new BigCommerce Payments accounts, initial payments are held for
  - strong: up to 21 days
  - text: before being available for payout. For more information, see PayPal’s
  - link "New PayPal account – payments on hold and accessing your money quicker":
    - /url: https://www.paypal.com/us/cshelp/article/new-paypal-account-%E2%80%93-payments-on-hold-and-accessing-your-money-quicker-help848
  - text: .
- paragraph:
  - strong: I linked the wrong PayPal account. How do I switch my configuration to the correct account?
- paragraph: To switch the PayPal account that is linked to BigCommerce Payments, you must disconnect your current configuration and reconnect the BigCommerce Payments integration.
- paragraph:
  - text: To disconnect BigCommerce Payments, go to
  - link "Settings › Payments":
    - /url: http://login.bigcommerce.com/deep-links/settings/payment
    - strong: Settings › Payments
  - text: and select the appropriate currency from the drop-down list. Under the
  - strong: Embedded
  - text: tab, click
  - strong: Online Payment Methods
  - text: ", then click the toggle switch next to BigCommerce Payments."
- paragraph:
  - img "Toggle switch next to BigCommerce Payments"
- paragraph:
  - text: Once disconnected, go back through the
  - link "BigCommerce Payments setup flow":
    - /url: "#setup"
  - text: and link the desired account.
- paragraph:
  - strong: Where do I get my 1099-K tax form?
- paragraph:
  - text: Access your US 1099-K and other tax forms in your account’s portal. For details, see PayPal’s
  - link "How do I find, download or request a correction to my 1099":
    - /url: https://www.paypal.com/us/cshelp/article/how-do-i-find-download-or-request-a-correction-to-my-1099-help546
  - text: and click the
  - strong: Business
  - text: tab.
- heading "ACCOUNT ELIGIBILITY" [level=4]
- paragraph:
  - strong: What countries are supported?
- paragraph:
  - text: BigCommerce Payments supports United Kingdom and United States-based stores and
  - link "requires a UK or US-based PayPal business account":
    - /url: "#requirements"
  - text: .
- paragraph:
  - strong: What currencies are supported?
- paragraph: "Our integration supports the following currencies:"
- table:
  - rowgroup:
    - row "AUD DKK ILS NZD SGD":
      - cell "AUD"
      - cell "DKK"
      - cell "ILS"
