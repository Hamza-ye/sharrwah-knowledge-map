- heading "Connecting with BigCommerce Payments" [level=1]
- heading "What We'll Cover" [level=2]
- list:
  - listitem:
    - link "BigCommerce Payments features":
      - /url: "#features"
  - listitem:
    - link "Requirements":
      - /url: "#requirements"
  - listitem:
    - link "Setting up BigCommerce Payments":
      - /url: "#setup"
  - listitem:
    - link "Settings":
      - /url: "#settings"
  - listitem:
    - link "Fastlane by PayPal":
      - /url: "#fastlane"
  - listitem:
    - link "PayPal Pay Later":
      - /url: "#pay-later"
  - listitem:
    - link "Balance dashboard":
      - /url: "#balance-dashboard"
  - listitem:
    - link "FAQ":
      - /url: "#faq"
- paragraph: BigCommerce Payments, a native solution powered by PayPal, enables BigCommerce merchants to seamlessly accept various payment methods, including cards, PayPal, Venmo, Pay Later options, and popular digital wallets. Shoppers benefit from a unified checkout experience, and funds are conveniently managed within a dedicated Balance dashboard directly inside BigCommerce.
- link:
  - /url: "#features"
- heading "BigCommerce Payments Features" [level=3]
- paragraph: "BigCommerce Payments allows you to:"
- list:
  - listitem: manage your funds balances.
  - listitem: keep track of your accounts from a single login.
  - listitem: offer many popular payment methods.
  - listitem: use additional tools to help you grow your business.
  - listitem: sell securely with a brand your customers trust.
- link:
  - /url: "#requirements"
- heading "Requirements" [level=3]
- list:
  - listitem:
    - text: Your store must be on a
    - link "Core, Growth, or Scale plan":
      - /url: https://www.bigcommerce.com/pricing/
    - text: .
    - list:
      - listitem:
        - text: Select Performance plan stores may be eligible to enable BigCommerce Payments.
        - link "Check your store's control panel":
          - /url: "#setup"
        - text: for availability.
  - listitem:
    - text: Your store’s
    - link "checkout type":
      - /url: /s/article/Optimized-Single-Page-Checkout
    - text: must be
    - emphasis: Optimized One-Page Checkout
    - text: or
    - emphasis: Custom Checkout
    - text: .
  - listitem:
    - text: Your store must
    - link "be located":
      - /url: /s/article/Store-Profile-Settings
    - text: in the United Kingdom or the United States.
  - listitem:
    - text: Your new or existing
    - link "PayPal Business account":
      - /url: https://www.paypal.com/unifiedonboarding/entry?country.x=US&locale.x=en_US
    - text: must be UK or US-based.
  - listitem:
    - text: To set up and manage payment methods, the
    - strong: Manage Payments
    - text: and
    - strong: Manage Settings
    - link "permissions":
      - /url: /s/article/User-Permissions
    - text: must be enabled on your user account.
- link:
  - /url: "#setup"
- heading "Setting up BigCommerce Payments" [level=3]
- paragraph:
  - text: To connect BigCommerce Payments with your store, go to
  - link "Settings › Payments":
    - /url: http://login.bigcommerce.com/deep-links/settings/payment
    - strong: Settings › Payments
  - text: ", and select a"
  - link "supported currency":
    - /url: "#eligibility"
  - text: from the drop-down list. Under the
  - strong: Embedded
  - text: tab, expand
  - strong: Online Payment Methods
  - text: and click
  - strong: Set up
  - text: next to
  - emphasis: BigCommerce Payments
  - text: .
- paragraph:
  - img "Set up button next to BigCommerce Payments"
- paragraph:
  - text: On the next page, click
  - strong: Set up
  - text: to begin the onboarding flow.
- paragraph:
  - text: When you connect BigCommerce Payments, a brand new PayPal platform account dedicated to your BigCommerce store is created. The BigCommerce Payments account is automatically linked to your PayPal Business account. See
  - link "our FAQ":
    - /url: "#faq-bcp-account"
  - text: for more details.
- list:
  - listitem:
    - strong: Set up faster and easier
    - text: — Select to use details from an existing PayPal Business account to create and link a new BigCommerce Payments account.
  - listitem:
    - strong: Add info on your own
    - text: — Select to create new PayPal Business and BigCommerce Payments accounts and link them together.
- paragraph:
  - img "Options to link an existing PayPal Business account with BigCommerce Payments or create a new one"
- link:
  - /url: "#settings"
