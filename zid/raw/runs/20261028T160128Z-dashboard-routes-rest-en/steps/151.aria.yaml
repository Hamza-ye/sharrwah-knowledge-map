  - heading "Enable the gift of giving" [level=4]
  - paragraph: Create new experiences for your customers to seamlessly gift your products. Customers can add personalized messages and gift cards. This creates a new channel for product distribution that you can effectively measure and market.
  - paragraph: Customize gift cards to reflect your store's identity
  - paragraph: Flexible gift sending options
  - paragraph: Gift card customizations, your brand, your style, their message.
  - button "Activate gifting"
  - img
  - heading "Main advantages" [level=6]
  - img
  - paragraph: What is gifting?
  - separator
  - paragraph: Gifting lets your customers buy a product on behalf of someone else, add a personalized message and a branded gift card, and have it delivered as a gift.
  - img
  - paragraph: Gift add-ons for every occasion
  - separator
  - paragraph: Customize the card design and fields, and let customers write their message or upload their own design.
  - img
  - paragraph: Do I have full control over gifting?
  - separator
  - paragraph: You decide where gifting appears across the store, which card fields customers can fill in, and which products and categories are available as gifts.
  - img
  - paragraph: What will your customers gain from gifting?
  - text: Soon
  - separator
  - paragraph: Customers can personalize a gift card with their own message, choose how the gift is delivered, and send products to the people they care about without leaving your store.
