- banner:
  - link "Settings":
    - /url: /manage/microapps/settings-list-ui
  - heading "Localization" [level=1]
- main:
  - main:
    - complementary:
      - link "Country":
        - /url: /manage/microapps/localization-settings-ui#root_country
      - link "Storefront Languages":
        - /url: /manage/microapps/localization-settings-ui#root_storefrontLanguages
      - link "Physical dimensions":
        - /url: /manage/microapps/localization-settings-ui#root_measurement
      - link "Date and timezone":
        - /url: /manage/microapps/localization-settings-ui#root_dateTimezone
    - heading "Country" [level=2]
    - group:
      - text: Default country
      - paragraph: Determines available payment options.
      - combobox "Default country" [expanded]: Saudi Arabia
      - button "toggle menu"
      - listbox:
        - option "Saudi Arabia" [selected]
    - heading "Storefront Languages" [level=2]
    - table:
      - rowgroup:
        - row "Channel Type Default language Additional languages Actions":
          - columnheader "Channel"
          - columnheader "Type"
          - columnheader "Default language"
          - columnheader "Additional languages"
          - columnheader "Actions"
      - rowgroup:
        - row "Capture Test Store NA Stencil English (en) NA Actions":
          - cell "Capture Test Store NA"
          - cell "Stencil"
          - cell "English (en)"
          - cell "NA"
          - cell "Actions":
            - button "Actions":
              - img "Actions"
    - heading "Physical dimensions" [level=2]
    - heading "1,234.00 KGS/Centimeters" [level=3]
    - paragraph: Physical dimension format presented to shoppers. Length and weight entered for a product will be autoconverted into this format.
    - button "Hide format settings"
    - button "Set standard formats for United Kingdom"
    - group:
      - text: Weight measurement
      - combobox "Weight measurement": Kilograms (KGS)
      - button "toggle menu"
      - listbox
      - text: Length measurement
      - combobox "Length measurement": Centimeters
      - button "toggle menu"
      - listbox
      - text: Thousands token
      - textbox "Thousands token": ","
      - text: Decimal token
      - textbox "Decimal token": .
      - text: Decimal places
      - combobox "Decimal places": "2"
      - button "toggle menu"
      - listbox
      - text: Factoring dimension
      - combobox "Factoring dimension": Product depth
      - button "toggle menu"
      - listbox
    - heading "Date and timezone" [level=2]
    - heading "24th Jul 2020 @ 3:49 AM, (GMT +00:00)" [level=3]
    - button "Hide format settings"
    - button "Set standard formats for United Kingdom"
    - group:
      - text: Store local timezone
      - combobox "Store local timezone": Western Europe Time, London, Lisbon, Casablanca (GMT)
      - button "toggle menu"
      - listbox
      - checkbox "Enable daylight savings time correction"
      - text: Enable daylight savings time correction Date format
      - combobox "Date format": 24th Jul 2020
      - button "toggle menu"
      - listbox
      - text: Extended date and time format
      - combobox "Extended date and time format": 24th Jul 2020 @ 3:49 AM
      - button "toggle menu"
      - listbox
- group:
  - button "Save"
  - button "Cancel"
- button "Open Resource Center"