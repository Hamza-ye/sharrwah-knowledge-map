- heading "Basic Tax Setup" [level=1]
- heading "What We'll Cover" [level=2]
- list:
  - listitem:
    - link "Terminology":
      - /url: "#terms"
  - listitem:
    - link "Requirements":
      - /url: "#requirements"
  - listitem:
    - link "Getting started":
      - /url: "#getting-started"
  - listitem:
    - link "Tax classes":
      - /url: "#tax-class"
  - listitem:
    - link "Tax zones":
      - /url: "#tax-zone"
  - listitem:
    - link "Tax rates":
      - /url: "#tax-rate"
  - listitem:
    - link "Common tax situations":
      - /url: "#examples"
  - listitem:
    - link "FAQ":
      - /url: "#faq"
- paragraph:
  - text: Part of running a business is calculating and collecting sales tax. Tax collection requirements will differ depending on your local, state, and federal laws, and we recommend using an
  - link "automatic tax setup":
    - /url: /s/article/Automatic-Tax-Setup
  - text: if you are in a supported area.
- paragraph: "However, you may want to use the basic tax setup for a variety of reasons, including:"
- list:
  - listitem: your location is outside of our automatic tax providers’ supported areas
  - listitem:
    - text: in combination with an automatic tax provider, using
    - link "provider targeting":
      - /url: /s/article/Automatic-Tax-Setup
  - listitem:
    - text: as
    - link "fallback tax":
      - /url: /s/article/Tax-Overview
  - listitem: if you have simple tax liability
- paragraph: The basic tax setup allows for you to define the tax rates for the different regional zones that you are required to collect in. The sales tax will be applied at checkout after the customer has entered their address.
- paragraph:
  - text: Below, we’ve provided detailed instructions on setting up tax zones (where you charge) and tax rates (how much you charge). Be sure to use this in conjunction with your store’s
  - link "tax settings":
    - /url: /s/article/Tax-Overview/#tax-settings
  - text: .
- text: 
- paragraph:
  - strong: Need help with taxes?
  - text: The instructions in this article assume you already know the tax requirements necessary for running your business online. We highly recommend contacting your accountant or local tax authority to ensure you are charging tax properly for your store.
  - strong: Note that our support team is not qualified to give tax advice.
- link:
  - /url: "#terms"
- heading "Terminology" [level=3]
- paragraph: "Before you start setting up basic taxes, you will need to determine the following:"
- list:
  - listitem:
    - strong: What do you need to charge tax on?
    - text: It can be different product types, shipping, or services like gift wrapping. This will determine your
    - strong: tax classes
    - text: .
  - listitem:
    - strong: Where do you need to charge taxes?
    - text: It can be countries, states, cities, and even counties. This will determine your
    - strong: tax zones
    - text: .
  - listitem:
    - strong: Who do you need to charge for taxes?
    - text: Do you anticipate any tax-exempt customers? This will determine if you need to create a tax-exempt
    - strong: customer group
    - text: .
  - listitem:
    - strong: What rates do you need to charge?
    - text: This determines the
    - strong: tax rates
    - text: ", which are assigned by zone and tax class."
  - listitem:
    - strong: How do you want prices to be displayed with taxes?
    - text: This is usually based on your customer’s location and their local preferences, such as displaying prices exclusive of tax for US customers and inclusive of tax for Australian customers.
- heading "Example Case" [level=4]
- paragraph: "Here is an example of a hypothetical store’s tax settings. They need to:"
- list:
  - listitem: Charge only on orders placed with a Tennessee billing address
  - listitem: Use tax-exclusive pricing (pricing is shown without tax added in)
  - listitem:
    - text: "Set up tax rates on two different product types:"
    - list:
      - listitem: 4% on perishable goods
      - listitem: 7% on non-perishable goods
  - listitem: Set up a 0% tax rate for tax-exempt customers
- paragraph: "They would need to use the following setup to address each of these aspects:"
- list:
  - listitem:
    - strong: Charge only on orders placed with a Tennessee billing address
    - text: — set up a Tennessee
    - link "tax zone":
      - /url: "#tax-zone"
  - listitem:
    - strong: Use tax-exclusive pricing
    - text: — select “Display prices exclusive of tax” on the Tennessee zone's
    - link "tax display settings":
      - /url: "#zone-price-display"
  - listitem:
    - strong: Different tax rates between perishable and non-perishable goods
    - text: — set up a “perishable goods” tax class and a “non-perishable goods”
    - link "tax class":
      - /url: "#tax-class"
    - text: ", then set the"
    - link "tax rate":
      - /url: "#tax-rate"
    - text: for both classes in the Tennessee zone.
  - listitem:
    - strong: Set up 0% rate for tax-exempt customers
    - text: — set up a
    - link "tax-exempt customer group":
      - /url: /s/article/How-do-I-have-customers-with-a-tax-exempt-status
    - text: with all rates set to 0%
- link:
  - /url: "#requirements"
- heading "Requirements" [level=3]
- list:
  - listitem:
    - text: To view and manage tax settings, you must have the
    - strong: Manage Tax Settings
    - link "permission":
      - /url: /s/article/User-Permissions
    - text: enabled on your user account.
  - listitem:
    - text: To view and edit products, you must have the
    - strong: Manage Products
    - text: ","
    - strong: Edit Products
    - text: ","
    - strong: Product Options
    - text: ", and"
    - strong: Manage Brands
    - text: permissions enabled on your user account.
  - listitem:
    - text: To view and manage customer accounts and
    - link "customer groups":
      - /url: /s/article/Customer-Groups
    - text: ", you must have the"
    - strong: Read Channels
    - text: ","
    - strong: Manage Customers
    - text: ","
    - strong: Edit Customers
    - text: ","
    - strong: Manage Categories
    - text: ", and"
    - strong: Customer Groups
    - text: permissions enabled on your user account.
    - list:
      - listitem:
        - text: Customer groups are only available for stores on a
        - link "Growth plan or higher":
          - /url: https://www.bigcommerce.com/essentials/pricing/
        - text: .
- link:
  - /url: "#getting-started"
- heading "Getting Started" [level=3]
- paragraph:
  - text: Once you have an idea of the tax requirements you need, you can begin setting up tax. Go to
  - link "Settings › Tax":
    - /url: http://login.bigcommerce.com/deep-links/settings/tax
    - strong: Settings
    - text: ›
    - strong: Tax
  - text: ", and click"
  - strong: Edit
  - text: next to
  - emphasis: Basic Tax
  - text: .
- paragraph:
  - img "The Edit button highlighted next to Basic Tax"
- paragraph: We recommend beginning your tax setup in the following order. Keep in mind that you can always test your orders and tweak your settings if needed.
- paragraph:
  - strong: "1."
  - text: Create all
  - link "tax classes":
    - /url: "#tax-class"
  - text: you need for your different product types. Once created, they will show up in other parts of the tax configurations.
- paragraph:
  - strong: "2."
  - text: Create and configure your
  - link "tax zones":
    - /url: "#tax-zone"
  - text: ", then specify the"
  - link "tax rates":
    - /url: "#tax-rate"
  - text: for each zone.
- paragraph:
  - strong: "3."
  - text: We recommend doing a
  - link "test order":
    - /url: /s/article/Testing-Shipping-Tax-and-Payment-Settings
  - text: for each tax scenario you need to address to make sure everything is working as intended.
- link:
  - /url: "#tax-class"
- heading "Tax Classes" [level=3]
- paragraph: Tax classes are classifications for products and other line items that may need different tax rates charged. For example, your state may require you to tax perishable goods and non-perishable goods at different rates, or you may be required to tax shipping or gift wrapping.
- paragraph: This is achieved by creating different tax classes for each group. Any tax classes you create are added to all of your zones, where you can assign them the appropriate rate. Any unused classes in a zone can be set to a rate of 0%.
- paragraph:
  - text: To view, add, or edit tax classes, click
  - strong: Edit
  - text: next to
  - emphasis: Basic Tax
  - text: ", then click on the"
  - strong: Tax classes
  - text: tab.
- paragraph:
  - img "The Edit button highlighted next to Basic Tax"
- paragraph: We've included some tax classes automatically. If you are selling products that require different tax rates, such as perishable and non-perishable goods, you can create those tax classes here.
- paragraph:
  - img "Tax class labels, including the default tax class."
- paragraph:
  - text: To create a new tax class, click the
  - strong: +
  - text: button. You can also delete tax classes by clicking the
  - strong: "-"
  - text: button. However, we recommend keeping all tax classes and just
  - link "assigning them a rate":
    - /url: "#tax-rate"
  - text: of 0% if you won't be using them.
- heading "Assigning Tax Classes to Products" [level=4]
- paragraph: Once the tax classes are configured, you will need to update your products to indicate which tax class they belong to. For example, you would update your perishable products to your newly created “Perishable Goods” tax class.
- paragraph:
  - text: BigCommerce automatically assigns all products to the
  - strong: Default Tax Class
  - text: . To assign a different tax class,
  - link "edit the product":
    - /url: /s/article/Adding-Products-v3
  - text: . Click
  - strong: Pricing
  - text: on the left side navigation, then select a class from the
  - strong: Tax Class
  - text: drop-down menu.
- paragraph:
  - img "Selecting the default tax class while editing a product"
- paragraph:
  - text: If you have several products, we recommend
  - link "updating them in bulk":
    - /url: https://support.bigcommerce.com/s/article/Editing-Existing-Products-via-Import#importing
  - text: by editing the
  - strong: Tax Class
  - text: column in the CSV import file.
- heading "Shipping and Gift Wrapping Tax Classes" [level=4]
- paragraph:
  - text: By default, your store will have
  - strong: Shipping
  - text: and
  - strong: Gift Wrapping
  - text: tax classes. These are for merchants who are required to collect taxes on shipping or gift wrapping. Even if you are not collecting tax for these,
  - strong: do not delete them
  - text: .
- paragraph:
  - text: If you are
  - strong: not
  - text: required to collect taxes on these,
  - link "set the tax rate":
    - /url: "#tax-rate"
  - text: to 0% in all of your zones.
- paragraph:
  - text: In your store's
  - link "tax settings":
    - /url: /s/article/Tax-Overview
  - text: ", there are fields for specifying the"
  - strong: Shipping tax class
  - text: ","
  - strong: Handling tax class
  - text: ", and"
  - strong: Gift Wrapping tax class
  - text: . Ensure that these field values are set to their corresponding tax classes. If they are set to something else, your shipping, handling, and gift wrapping taxes will be charged at the rate specified for that other class.
- paragraph:
  - img "example of shipping, handling, and gift wrapping tax classes"
- paragraph: Once you have set up your tax classes, they will appear in the tax zones you create in the next step.
- link:
  - /url: "#tax-zone"
- heading "Tax Zones" [level=3]
- list:
  - listitem:
    - link "Default zone":
      - /url: "#default-tax-zone"
  - listitem:
    - link "Adding zones":
      - /url: "#adding-zones"
  - listitem:
    - link "Tax zone display settings":
      - /url: "#zone-price-display"
  - listitem:
    - link "Editing and copying zones":
      - /url: "#editing-copying-zones"
  - listitem:
    - link "Deleting zones":
      - /url: "#deleting-zones"
- paragraph:
  - text: To charge different rates for different geographic locations, you will create one or more
  - strong: tax zones
  - text: . A tax zone specifies the geographical area where a group of tax rates apply. Set whether the tax zone geographical area applies to a customer’s billing address, shipping or pickup address, or your store’s shipping origin address in your
  - link "tax settings":
    - /url: /s/article/Tax-Overview
  - text: .
- paragraph:
  - img "tax setting for calculating taxes based on shipping, billing or store address"
- paragraph:
  - text: To view your tax zones, go to
  - link "Settings › Tax":
    - /url: http://login.bigcommerce.com/deep-links/settings/tax
    - strong: Settings
    - text: ›
    - strong: Tax
  - text: ", click"
  - strong: Edit
  - text: next to
  - emphasis: Basic Tax
  - text: ", then click on the"
  - strong: Tax Rates and zones
  - text: tab.
- paragraph:
  - img "screenshot of tax zones overview page"
- paragraph: "You will see any current tax zones and an overview of their settings:"
- list:
  - listitem:
    - strong: Zone type
    - text: — how the zone is defined. Zones can be based on country, state, or postal code.
  - listitem:
    - strong: Price display
    - text: — whether the zone’s price display setting is tax inclusive or tax exclusive
  - listitem:
    - strong: Status
    - text: — whether the zone is currently active on the store or not
- heading "Default Zone" [level=4]
- paragraph:
  - text: All stores contain a
  - strong: Default Zone
  - text: ", which applies a 0% tax rate to any regions not set up in another zone."
  - strong: Do not set up tax rates in this zone.
  - text: Unless you have nexus everywhere in the world, you will want to keep this as an “everywhere I don’t need to charge taxes in” zone.
- heading "Adding Zones" [level=4]
- paragraph:
  - text: To add a new tax zone, click
  - strong: Add a Tax Zone
  - text: .
- paragraph:
  - img "Highlighted Add a Tax Zone button."
- paragraph: On the next page, complete the fields to set up the geographical area, which customers the zone applies to, and display settings for your new zone.
- paragraph:
  - img "screenshot of fields to fill in when adding a new tax zone"
- list:
  - listitem:
    - strong: Tax zone name
    - text: — set the name internal of this tax zone. We recommend naming it after the geographic region it represents.
  - listitem:
    - strong: This tax zone is based on one or more
    - text: — select whether the zone represents one or more countries, subdivisions (such as state or province), or postal codes. Postal codes can be used together in a zone for city or county taxes.
  - listitem:
    - strong: Tax zone applies to
    - text: — apply to all customers or limit to one or more customer groups. To include guest customers, assign a
    - link "default customer group":
      - /url: /s/article/Customer-Groups
    - text: . Only available for stores on a
    - link "Growth plan or higher":
      - /url: https://www.bigcommerce.com/essentials/pricing/
    - text: .
  - listitem:
    - strong: Enable this tax zone
    - text: — toggle this checkbox to enable or disable the tax zone
- heading "Tax Zone Display Settings" [level=4]
- text: 
- paragraph:
  - strong: Using an automatic tax provider?
  - text: Tax zone display settings configured here will still apply in your store if an automatic tax provider is enabled.
- paragraph: While adding or editing a tax zone, you can configure how the pricing will display on your storefront.
- paragraph:
  - text: If you have
  - link "geolocation":
    - /url: https://support.bigcommerce.com/s/article/Tax-Overview#behavior
  - text: enabled or a shopper enters their address, the prices displayed in product listing, product detail, cart, and checkout pages will use the
  - link "tax display settings":
    - /url: https://support.bigcommerce.com/s/article/Tax-Overview#display
  - text: of the relevant tax zone.
- paragraph:
  - text: Note that you must set up all of the required tax zones for geolocation to correctly display prices to shoppers on your storefront. See
  - link "Tax Overview":
    - /url: https://support.bigcommerce.com/s/article/Tax-Overview#behavior
  - text: for more information and recommendations.
- paragraph:
  - img "inclusive/exclusive pricing display setting and options to display both pricing on category and brand pages"
- list:
  - listitem:
    - strong: How are prices displayed on your storefront
    - text: — select to display prices as either inclusive or exclusive of tax
  - listitem:
    - strong: Show prices both including and excluding tax
    - text: — select to display both inclusive and exclusive pricing on product listing pages (such as category and brand pages) and product detail pages (product pages). While this setting is optional, it can be valuable for pricing transparency to shoppers.
- paragraph:
  - text: Once you’ve finished with modifying the settings, click
  - strong: Save
  - text: to add or update the tax zone.
- text: 
- paragraph:
  - strong: Responsive Tax Display Settings
  - text: — If you’ve selected to use tax zone display settings for “Prices on Invoices” in
  - link "Tax Settings":
    - /url: /s/article/Tax-Overview/#tax-settings
  - text: ", order invoices will reflect the display settings for the tax zone that the customer falls under. This means that customers will see their invoices formatted to match the tax display on the cart and checkout. For example, a US customer will see prices exclusive of tax on invoices, whereas a UK customer will see prices inclusive of tax, provided that the store has these settings enabled in their respective tax zones."
- heading "Editing and Copying Zones" [level=4]
- paragraph:
  - text: To edit a tax zone, click on the
  - strong: Action
  - text: menu next to the zone, then select
  - strong: Edit settings
  - text: . You can make a copy of a tax zone and its rates by selecting
  - strong: Duplicate zone
  - text: . This can be useful when you are setting up multiple tax zones that will be similar to each other.
- paragraph:
  - img "Select Copy on the Action menu to make a copy of the tax zone."
- heading "Deleting Zones" [level=4]
- paragraph:
  - text: To delete tax zones, check the box next to its name, then click the
  - strong: Trash
  - text: icon in the top navigation. Click
  - strong: OK
  - text: to confirm, and the zones will be removed.
- paragraph:
  - text: Note that the
  - strong: Default zone
  - text: ", used for any location outside of your other tax zones, cannot be deleted."
- paragraph:
  - img "Select the zone, then click the trash can icon to delete the zone"
- paragraph:
  - text: You can also select
  - strong: Delete
  - text: from the
  - strong: Action
  - text: menu.
- paragraph:
  - img "Select Delete from the Action menu."
- link:
  - /url: "#tax-rate"
- heading "Tax Rates" [level=3]
- paragraph: Once a tax zone is created, you can add rates to it. Tax rates are the percentages at which products or services are taxed. You may charge multiple tax rates within a zone. For example, if you have a city zone, you may need to set up a set of city-based tax rates in addition to a set of state-based tax rates.
- paragraph:
  - img "example of city and state tax rates in one tax zone"
- paragraph:
  - text: After you have created a tax zone, click the
  - strong: Tax rates
  - text: tab to add, delete, or edit tax rates. You can also select
  - strong: Edit rates
  - text: from the
  - strong: Action
  - text: menu next to a particular zone when viewing the list of tax zones.
- paragraph:
  - img "Select Edit Rates."
- paragraph:
  - text: When adding or editing a rate, you will need to specify a
  - strong: Tax rate name
  - text: and enter a rate for each tax class. Name the tax rate something that represents which tax you are charging, like
  - emphasis: City Tax
  - text: or
  - emphasis: Federal Tax
  - text: . If you do not need to charge tax for a particular tax class, enter
  - strong: "0"
  - text: for the rate.
- paragraph:
  - img "screenshot of tax rate fields"
- heading "Tax Calculation Priority" [level=4]
- paragraph:
  - text: In some circumstances, you will need to apply multiple rates to a single tax zone. For example, you may need to charge both city and state, or both provincial and federal sales taxes. If you have a tax zone that has more than one rate, you need to set the
  - strong: Calculation Priority
  - text: .
- paragraph:
  - text: Tax rates in a zone that share the same priority will be added together. Tax rates in a zone that have different priorities will be compounded in order of priority, where the lowest number has the highest priority. So for example, if you had to charge a GST rate on top of a PST rate, you would give PST a priority of
  - strong: "0"
  - text: and GST a priority of
  - strong: "1"
  - text: .
- paragraph:
  - img "screenshot of calculation priority field for tax rate"
- paragraph:
  - text: Tax rates can be deleted using the same methods for
  - link "deleting tax zones":
    - /url: "#deleting-zones"
  - text: — by selecting the rate, then clicking the
  - strong: Trash
  - text: icon in the top navigation, or by selecting
  - strong: Delete
  - text: from the
  - strong: Action menu.
- link:
  - /url: "#examples"
- heading "Common Tax Situations" [level=3]
- list:
  - listitem:
    - link "State/Province with a single tax rate":
      - /url: "#single-rate"
  - listitem:
    - link "Country with a single inclusive tax rate":
      - /url: "#inclusive-rate"
  - listitem:
    - link "State/Province with multiple tax rates":
      - /url: "#multiple-rates"
  - listitem:
    - link "Zone based on postal codes":
      - /url: "#postal-codes"
  - listitem:
    - link "Using wildcards":
      - /url: "#wildcards"
- paragraph: Below we've included a few examples of how to set up zones, classes, and rates for everyday situations.
- heading "State/Province with a Single Tax Rate" [level=4]
- paragraph: First, we'll create a zone based on a state with a single tax rate. In our example, we're using Texas.
- paragraph:
  - strong: "1."
  - text: In the basic tax settings area, click on the
  - strong: Tax rates and zones
  - text: tab, then click
  - strong: Add a tax zone
  - text: .
- paragraph:
