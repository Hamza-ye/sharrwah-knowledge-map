- heading "GENERAL" [level=4]
- paragraph:
  - strong: What is PayPal Commerce Platform?
- paragraph: PayPal Commerce Platform, also known as PayPal Complete Payments (PPCP), is another name for PayPal's dedicated payment gateway, used to distinguish it from other PayPal solutions supported by BigCommerce. In most instances, it is simply referred to as PayPal.
- paragraph:
  - strong: Why am I being asked to update the PayPal integration?
- paragraph:
  - text: After enabling certain features in your PayPal settings, an
  - strong: Update
  - text: button may appear at the top of the tab, along with a list of features dependent on the update. This button refreshes the integration and enables the new features on your storefront.
- paragraph:
  - img "Connect PayPal Sandbox button"
- paragraph:
  - strong: I connected the wrong PayPal account. How do I switch my configuration to the correct account?
- paragraph: To switch PayPal accounts, you must disconnect your current configuration and reconnect the PayPal integration.
- paragraph:
  - text: To disconnect PayPal, go to
  - link "Settings › Payments":
    - /url: http://login.bigcommerce.com/deep-links/settings/payment
    - strong: Settings
    - text: ›
    - strong: Payments
  - text: and select the appropriate currency from the drop-down list. Expand
  - strong: Online payment methods
  - text: ", then click the toggle switch next to"
  - strong: PayPal
  - text: .
- paragraph:
  - img "Toggle switch next to PayPal"
- paragraph:
  - text: Once disconnected, go back through the PayPal
  - link "setup flow":
    - /url: "#setup"
  - text: and connect the desired account.
- heading "PRICING AND FEES" [level=4]
- paragraph:
  - strong: What fees are associated with PayPal?
- paragraph:
  - text: PayPal has no monthly fees, but charges a per-transaction fee based on your region. Additionally, the
  - link "Real-time Account Updater":
    - /url: "#stored-credit-cards"
  - text: is a paid feature in your PayPal business account. To learn more, go to
  - link "PayPal Merchant Fees":
    - /url: https://www.paypal.com/us/webapps/mpp/merchant-fees
  - text: and locate the rates in your region.
- heading "ACCOUNT ELIGIBILITY" [level=4]
- paragraph:
  - strong: What currencies and countries does PayPal support?
- paragraph: "You can review a list of supported currencies and countries in PayPal’s documentation:"
- list:
  - listitem:
    - link "Supported currencies":
      - /url: https://developer.paypal.com/api/rest/reference/currency-codes/
  - listitem:
    - link "Supported countries":
      - /url: https://developer.paypal.com/api/rest/reference/country-codes/
- paragraph:
  - strong: What items are restricted for merchants to sell?
- paragraph:
  - text: You can review a list of restricted items on PayPal’s
  - link "Acceptable Use Policy":
    - /url: https://www.paypal.com/us/legalhub/paypal/acceptableuse-full
  - text: .
- heading "TRANSACTIONS" [level=4]
- paragraph:
  - strong: After I create an account, what is the waiting period before I can process transactions?
- paragraph: Once you link your PayPal account to BigCommerce, you can begin transacting right away.
- paragraph:
  - strong: How long until the funds are transferred to my bank?
- paragraph:
  - text: Funds are deposited immediately into your PayPal account. You can request a withdrawal to your bank at any time, using an
  - link "Instant Transfer":
    - /url: https://www.paypal.com/us/cshelp/article/what-bank-accounts-and-debit-cards-are-eligible-for-instant-transfer-help397
  - text: or Standard Transfer (1-3 business days).
- paragraph:
  - strong: Does PayPal send email notifications to me or my customers?
- paragraph: Yes, both you and your customers will receive emails when transactions are received and for disputes or chargebacks.
- heading "REFUNDS" [level=4]
- paragraph:
  - strong: How soon after a transaction can I perform a refund?
- paragraph: Once a payment is captured, there is no delay before you can issue a refund.
- paragraph:
  - strong: Are there any fees for chargebacks/refunds?
- paragraph:
  - text: You can read about PayPal’s policies on
  - link "chargebacks and refunds":
    - /url: https://www.paypal.com/us/legalhub/paypal/useragreement-full#refunds-reversals-chargebacks
  - text: in the PayPal User Agreement.
- heading "ADDITIONAL FEATURES" [level=4]
- paragraph:
  - strong: Are there any fraud filtering options available?
- paragraph:
  - text: You can review PayPal’s
  - link "Seller Protection Policy":
    - /url: https://www.paypal.com/us/legalhub/paypal/seller-protection
  - text: for Merchants to understand how they help protect your online sales, minimize claims and chargebacks and help prevent merchant fraud.
- paragraph:
  - strong: Does PayPal support delayed or manual capture payments?
- paragraph:
  - text: Yes, PayPal supports manual capture when using the
  - emphasis: Authorize only
  - link "Transaction type":
    - /url: "#account-info"
  - text: .
- paragraph:
  - strong: Does PayPal support multicurrency?
- paragraph:
  - text: Yes, multicurrency is supported. To learn more about adding and configuring currencies, see
  - link "Managing Currencies":
    - /url: /s/article/Managing-Currencies
  - text: .
- paragraph:
  - strong: Can I connect a single PayPal account to multiple BigCommerce storefront channels?
- paragraph:
  - text: Yes, PayPal supports
  - link "Multi-Storefront":
    - /url: /s/article/Multi-Storefront-Payment-Methods
  - text: . You can either connect a single PayPal account to multiple channels or create multiple PayPal accounts and assign them to their respective storefront channels. There is no limit to the amount of PayPal configurations that can be created per currency.
- paragraph:
  - strong: Does PayPal support stored cards and recurring payments?
- paragraph:
  - text: Yes, PayPal supports stored credit cards and PayPal accounts for streamlined checkout with subsequent orders. Note that this feature is only available to stores on a
  - link "Growth plan or higher":
    - /url: https://www.bigcommerce.com/pricing/
  - text: .
- paragraph:
  - text: PayPal is compatible with the
  - link "Payments API":
    - /url: https://docs.bigcommerce.com/developer/docs/admin/checkout-and-cart/payments/overview
  - text: ", and can be used in conjunction with"
  - link "subscription/recurring billing apps":
    - /url: https://www.bigcommerce.com/apps/categories/payments-security/recurring-billing-subscriptions/
  - text: or custom development to create subscription models with stored credit cards. Real-time Account Updater further enhances the recurring billing experience by ensuring that expired and recently changed stored card information is up-to-date.
- paragraph:
  - strong: Can I display PayPal Pay Later messaging banners on my storefront without enabling the Pay Later button?
- paragraph:
  - text: Yes. The
  - link "Pay Later button":
    - /url: "#paypal-wallet"
  - text: and
  - link "Pay Later messaging":
    - /url: "#pay-later-messaging"
  - text: are separate features that operate independently of each other. While the button provides a quick and easy way to access Pay Later, shoppers can still choose the option at checkout.
- paragraph:
  - strong: How do I add payment buttons to my product pages?
- paragraph:
  - text: If you are using
  - link "Cornerstone":
    - /url: /s/article/Cornerstone-Theme-Manual
  - text: 6.6.1 or newer and have not
  - link "customized your theme files":
    - /url: /s/article/Stencil-Themes
  - text: ", you can enable payment buttons for PayPal Checkout and"
  - link "Venmo":
    - /url: /s/article/Venmo
  - text: on product pages. In
  - link "Page Builder":
    - /url: /s/article/Page-Builder
  - text: navigate to
  - strong: Theme Styles › Products
  - text: ", scroll down to"
  - emphasis: Display settings
  - text: and check the box next to
  - emphasis: Show quick payment buttons
  - text: .
- paragraph:
  - img "The Show quick payment buttons setting"
- paragraph:
  - text: If you are using a different theme, or you have customized your Cornerstone theme files, your theme will require
  - link "additional customization":
    - /url: https://docs.bigcommerce.com/developer/docs/storefront/stencil/themes/checkout-enhancements/wallet-buttons
  - text: in order to support product page payment buttons.
- paragraph:
  - text: For assistance with applying these customizations to your theme files, we recommend reaching out to a BigCommerce Partner by visiting our
  - link "Partner Directory":
    - /url: https://partners.bigcommerce.com/directory/
  - text: or submitting an
  - link "Agency Design Request":
    - /url: https://www.bigcommerce.com/partners/agency-design-request/
  - text: .
- paragraph:
  - strong: Can I customize the appearance of my PayPal payment buttons?
- paragraph:
  - text: If you are using
  - link "Cornerstone":
    - /url: /s/article/Cornerstone-Theme-Manual
  - strong: 6.13.0 or newer
  - text: ", you can configure your theme’s"
  - link "Payment buttons settings":
    - /url: /s/article/Cornerstone-Theme-Manual
  - text: to customize your PayPal Checkout, PayPal Pay Later, and Venmo buttons on storefront product pages, cart page, the top of the checkout page, and the Payment step of checkout.
- paragraph:
  - strong: How can I place payment buttons at the top of my checkout page?
- paragraph:
  - text: You can place payment buttons at the top of checkout by checking
  - emphasis: Show wallet buttons at the top of checkout
  - text: located under
  - link "Settings › Checkout":
    - /url: http://login.bigcommerce.com/deep-links/settings/checkout
    - strong: Settings
    - text: ›
    - strong: Checkout
  - text: . Note that buttons will appear above the Customer step for guest shoppers only.
- paragraph:
  - strong: What is the customer experience with PayPal’s package tracking service?
- paragraph: Customers who use the PayPal app will be able to track packages in the app and receive push notifications with live shipping updates. This will be provided automatically for customers who shop at your store and pay with PayPal. Customers can also add packages manually by entering a tracking number.
- paragraph:
  - strong: Can I turn off package tracking and still sync order details, to retain benefits like shorter hold times and seller protection eligibility?
- paragraph: Yes, you can. Package tracking is offered as a separate, optional benefit that can be turned toggled off/on without affecting any other setting.
- paragraph:
  - strong: Which alternative payment methods (APMs) are available with PayPal?
- paragraph: "The following payment methods can be enabled in PayPal. The appropriate payment method will display to the shopper on checkout based on the shopper's IP address and transaction currency. Keep in mind the following considerations:"
- list:
  - listitem:
    - text: Alternative payment method transactions are
    - emphasis: Authorize and capture
    - text: only, regardless of the
    - link "Transaction type":
      - /url: "#account-info"
    - text: option selected for PayPal.
    - list:
      - listitem: Delayed capture is not supported.
  - listitem:
    - link "Recurring or subscription payments":
      - /url: /s/article/Enabling-Stored-Payment-Methods
    - text: are not supported..
- paragraph: To learn more about the prerequisites and setup steps for an APM, click the corresponding link in the list below.
