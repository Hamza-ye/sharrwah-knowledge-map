- paragraph: The specific line items that appear on your invoice are determined by factors such as your store plan, the payment gateways you have enabled, and your installed apps. These factors also influence invoice frequency.
- paragraph: Every store will receive invoices for their store’s plan, whether monthly or annually. Additional charges may also appear in the same invoice or a separate invoice. For example, a store may be invoiced annually, but receive monthly invoices for an app subscription.
- paragraph: "Line item information is organized into the following columns on the invoice:"
- paragraph:
  - img "BigCommerce Invoice with a Core store annual line item"
- list:
  - listitem:
    - strong: Store ID
    - text: — The numeric ID of the store related to the line item.
    - list:
      - listitem:
        - text: For steps on locating your store’s ID, see “Locating Your Billing Cycle” on
        - link "Changing Your Store's Plan":
          - /url: /s/article/How-do-I-upgrade-my-stores-plan
        - text: .
  - listitem:
    - strong: Charge Name
    - text: — The description of the line item.
  - listitem:
    - strong: Service Period
    - text: — The timeframe relevant to the line item.
    - list:
      - listitem: For a store plan, this indicates the monthly or yearly billing cycle.
  - listitem:
    - strong: UOM
    - text: — The unit of measurement or explanation of values in the
    - strong: Qty
    - text: field.
  - listitem:
    - strong: Qty
    - text: — The number of units related to the line item.
    - list:
      - listitem: For fees, this indicates the amount subject to the specific fee.
  - listitem:
    - strong: Gross Charge
    - text: — The amount before discounts.
  - listitem:
    - strong: Discount Amt
    - text: — The amount of any applied discounts.
  - listitem:
    - strong: Net Charge
    - text: — The amount after subtracting the
    - strong: Discount Amt
    - text: from the
    - strong: Gross Charge
    - text: .
- heading "PLAN LINE ITEMS" [level=4]
- paragraph: Whether your store is billed monthly or annually, you will receive an invoice each billing cycle.
- paragraph:
  - emphasis: Example monthly plan invoice
- paragraph:
  - img "BigCommerce Invoice with a Scale store monthly line item"
- paragraph:
  - emphasis: Example yearly plan invoice
- paragraph:
  - img "BigCommerce Invoice with a Core store annual line item"
- heading "ADDITIONAL STOREFRONT LINE ITEMS" [level=4]
- paragraph:
  - text: When you purchase an additional storefront for your store, it is added to your invoice as a line item. Multiple non-default storefronts are combined into a single
  - emphasis: Additional Storefront
  - text: line item.
- paragraph:
  - text: Each storefront uses the same billing cycle as your store plan. See “Purchasing a Storefront Seat” in
  - link "Enabling Multi-Storefront":
    - /url: /s/article/Enabling-Multi-Storefront
  - text: to learn more.
- paragraph:
  - img "BigCommerce Invoice with GMV Overage Fee and Open Payment Provider Fee line items"
- heading "FEE LINE ITEMS" [level=4]
- paragraph:
  - text: Open Payment Provider and plan overage fees are billed monthly in arrears as separate line items. For more information on these fees and their calculations, see
  - link "About BigCommerce Pricing":
    - /url: /s/article/Pricing
  - text: .
- paragraph:
  - img "BigCommerce Invoice with GMV Overage Fee and Open Payment Provider Fee line items"
- heading "APP SUBSCRIPTION LINE ITEMS" [level=4]
- paragraph:
  - text: BigCommerce partners
  - link "participating in Unified Billing":
    - /url: https://www.bigcommerce.com/apps/categories/?compatibleWith=unified-billing
  - text: use BigCommerce Payment APIs to charge for app purchases and subscriptions. These app charges will appear on your BigCommerce invoices.
- paragraph:
  - img "BigCommerce Invoice with app subscription line item"
- heading "CREDIT LINE ITEMS" [level=4]
- paragraph:
  - text: In some instances a credit may be applied to your invoice. These line items will appear as a negative value and are not a charge. They are subtracted from your
  - strong: Net Charge
  - text: amount when calculating your total due.
- paragraph:
  - img "BigCommerce Invoice with credit line items"
- heading "STATEMENT OF ACCOUNT" [level=4]
- paragraph:
  - text: The
  - strong: Statement of Account
  - text: section on the second page of your invoice lists all invoices currently open on your account.
- paragraph:
  - img "BigCommerce Invoice with Statement of Account entries"
- heading "RELATED TRANSACTIONS" [level=4]
- paragraph:
  - text: The
  - strong: Transactions related to this Invoice
  - text: section on the last page of your invoice details payment attempts made towards your line item charges. These attempts are usually made automatically using the payment method on file in the Account Dashboard.
- paragraph:
  - text: If the payment was not successful or your store is located in India, the payment must be made manually. For payment steps, see
  - link "Paying an Invoice":
    - /url: "#paying"
  - text: .
- paragraph:
  - img "BigCommerce Invoice with transaction line item"
- link:
  - /url: "#paying"
- heading "Paying an Invoice" [level=3]
- text: 
- paragraph:
  - strong: Merchants in India must pay their invoice manually.
  - text: If your business is located in India, you will be sent an email reminder on your billing date with a link to complete your payment.
- paragraph: BigCommerce store charges are automatically paid using the payment method on file in the Account Dashboard. However, there may be instances where the payment fails, requiring invoices to be paid manually.
- text: 
- paragraph:
  - strong: BigCommerce staff will never ask for your payment information.
  - text: Our support team cannot edit the payment method in your account. Use the steps below to enter your payment information and pay an invoice.
- paragraph:
  - strong: "1."
  - text: Log into the Account Dashboard by navigating to
  - link "manage.bigcommerce.com":
    - /url: http://manage.bigcommerce.com
  - text: .
- paragraph:
  - strong: "2."
  - text: In the Account Dashboard, click
  - strong: Account
  - text: and select
  - emphasis: Payment method
  - text: from the drop-down menu.
- paragraph:
  - img "Payment method highlighted in Account drop-down menu"
- paragraph:
  - strong: "3."
  - text: Click
  - strong: Edit
  - text: to select and enter new payment details. The methods available to pay your invoice can vary depending on your store’s plan and region.
- paragraph:
  - img "Edit payment methods"
- paragraph:
  - strong: "4."
  - text: Click
  - strong: Save
  - text: . Note that this method will now be used to automatically pay charges for future billing cycles.
- paragraph:
  - strong: "5."
  - text: Click
  - strong: Pay Now
  - text: to complete the payment. If you encounter any issues, see
  - link "Troubleshooting Payment Errors":
    - /url: "#errors"
  - text: .
- text: 
- paragraph:
  - strong: Did you know?
  - text: Using PayPal to pay your BigCommerce subscription can help prevent interruption of service due to an expired credit or debit card. PayPal may offer flexible payment options for settling your PayPal invoice.
  - link "Contact their team":
    - /url: https://www.paypal.com/us/cshelp/contact-us
  - text: to see what options may be available to you.
