- heading "FAQ" [level=3]
- paragraph:
  - strong: How can I change the currency symbol and decimal format of my store’s prices?
- paragraph:
  - text: Your store’s currency display settings can be changed by editing your enabled currencies in
  - link "Settings › Currencies":
    - /url: http://login.bigcommerce.com/deep-links/settings/currencies
    - strong: Settings
    - text: ›
    - strong: Currencies
  - text: . For more information, see our article on
  - link "Managing Currencies":
    - /url: /s/article/Managing-Currencies
  - text: .
- paragraph:
  - strong: Can I apply physical dimension settings on a per-product basis?
- paragraph: No, settings like measurement units and factoring dimension are applied globally. However, you can include measurements in different units within a product’s description.
