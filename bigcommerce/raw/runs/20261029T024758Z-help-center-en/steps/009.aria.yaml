- paragraph:
  - text: The Account Dashboard is where store owners manage their BigCommerce account. From the Dashboard you can
  - link "manage account details":
    - /url: "#update-account"
  - text: ","
  - link "change your store’s plan":
    - /url: /s/article/How-do-I-upgrade-my-stores-plan
  - text: ","
  - link "update payment methods":
    - /url: "#update-payment"
  - text: ", view your"
  - link "Open Payment Provider fee summary":
    - /url: "#opp-summary"
  - text: ","
  - link "view and pay invoices":
    - /url: /s/article/How-do-I-make-a-payment-on-my-account
  - text: ","
  - link "purchase":
    - /url: /s/article/Purchasing-a-Domain
  - text: and
  - link "manage domains":
    - /url: /s/article/Changing-Domains
  - text: ", and"
  - link "purchase and manage SSL certificates":
    - /url: /s/article/BigCommerce-SSL-Certificate
  - text: .
