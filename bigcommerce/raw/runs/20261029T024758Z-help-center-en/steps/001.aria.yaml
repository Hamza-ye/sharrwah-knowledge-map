- link:
  - /url: "#apm"
- heading "Alternative Payment Methods and Digital Wallets" [level=3]
- paragraph: Alternative Payment Methods (APMs) are payment options that often do not require a major credit card scheme such as Visa or Mastercard. Shoppers in many regions prefer local APMs at checkout, making them a valuable tool for international selling.
- paragraph: "Offered through a supporting payment gateway, APMs can include payment types such as:"
- list:
  - listitem: bank transfers
  - listitem: “buy now, pay later” (BNPL)
  - listitem: cash payments
  - listitem: digital wallets
  - listitem: direct debit
  - listitem: mobile payments
- paragraph: Digital wallet APMs allow shoppers to complete purchases by signing into a third-party account, bypassing the need to create a separate account or re-enter payment information. This streamlines the checkout experience, boosts conversion rates, and provides a better mobile shopping experience.
- paragraph:
  - text: Note that the Amazon Pay, Apple Pay, and Google Pay digital wallets have a unique setup experience and are found under the
  - strong: Digital Wallets
  - text: section of
  - strong: Settings › Payments
  - text: .
- paragraph:
  - text: For a full list of available APMs, digital wallets, and their supported gateways, see
  - link "Introduction to Alternative Payment Methods":
    - /url: /s/article/Intro-to-APMs
  - text: .
- link:
  - /url: "#accelerated-checkout"
- heading "Accelerated Checkout Solutions" [level=3]
- paragraph: Accelerated Checkout solutions remove friction from checkout by offering a passwordless checkout experience. When using an Accelerated Checkout, shoppers are prompted to securely save their information with the provider.
- paragraph: Once they have an account, shoppers receive a one-time passcode to their mobile device whenever they enter their email address at checkout, and the Accelerated Checkout solution automatically fills in their address and payment information for a single-click checkout.
- paragraph: Since Accelerated Checkout profiles are supported on any online store using the solution, offering this payment option can assure shoppers that their payments will be speedy and secure. This can encourage repeat purchases and increase your conversion rate.
- paragraph: "The following Accelerated Checkout solutions are available in BigCommerce:"
- list:
  - listitem:
    - strong: Stripe Link
    - text: — Supported by the Stripe payment gateways; offer a streamlined checkout experience for any shopper with a Link profile.
  - listitem:
    - strong: Fastlane by PayPal
    - text: —
    - link "Fastlane by PayPal":
      - /url: /s/article/Fastlane-by-PayPal
    - text: provides merchants with a fast, passwordless checkout solution for guest shoppers.
- link:
  - /url: "#faq"
- heading "FAQ" [level=3]
- paragraph:
  - strong: Where do I manage my funds?
- paragraph:
  - text: You will control and direct funds in your merchant account with your merchant service provider. Usually, this is where you will connect to your bank account or
  - link "perform refunds":
    - /url: /s/article/Processing-Refunds
  - text: external to BigCommerce.
- paragraph:
  - strong: What is a hosted payment gateway?
- paragraph: Hosted payment gateways navigate shoppers away from your checkout to the payment service provider’s page. After entering their payment details and completing the transaction, they are redirected back to your storefront.
- paragraph: "Hosted payment gateways:"
- list:
  - listitem: Afterpay
  - listitem: Amazon Pay
  - listitem: BitPay
  - listitem: Klarna
  - listitem: Mercado Pago
  - listitem: Opayo
  - listitem: Optty
  - listitem: Serve First
  - listitem: Sezzle
- paragraph:
  - text: Note that hosted gateways are not compatible with
  - link "Embedded Checkout":
    - /url: https://docs.bigcommerce.com/developer/docs/admin/checkout-and-cart/embedded-checkout/overview
  - text: on headless storefronts. In addition, most APMs and digital wallets do not support Embedded Checkout as they redirect shoppers to a hosted payment page.
- paragraph: "APMs and digital wallets that support Embedded Checkout:"
- list:
  - listitem: Google Pay
  - listitem: PayPal Pay Later
- paragraph:
  - strong: Do any payment gateways support Level 2 and Level 3 data?
- paragraph:
  - text: Yes, several gateways support the use of Level 2 and Level 3 data. For more information, see
  - link "Using Level 2 and Level 3 Data in BigCommerce":
    - /url: /s/article/Using-Level-2-and-Level-3-Data-in-BigCommerce
  - text: .
- paragraph:
  - strong: Do any payment gateways support the selling of regulated products, such as firearms, e-cigs, or CBD?
- paragraph:
  - text: The following gateways
  - strong: may
  - text: allow the sale of regulated items. Before selling any items, check with your payment gateway to make sure your products are permitted in their terms of service.
- list:
  - listitem:
    - link "Bankful":
      - /url: https://bankful.com/
  - listitem:
    - link "NMI":
      - /url: https://www.nmi.com/
  - listitem:
    - link "Sezzle":
      - /url: https://sezzle.com/
  - listitem:
    - link "USA ePay":
      - /url: https://help.usaepay.info/
    - text: "*"
  - listitem:
    - link "Worldpay":
      - /url: https://worldpay.payment-processors.com/
- paragraph:
  - text: "*You must use"
  - link "Paysafe":
    - /url: https://www.paysafe.com/us-en/
  - text: as your Merchant Services Provider (MSP).
- paragraph:
  - strong: Are there other payment processors outside of payment gateways?
- paragraph:
  - text: Yes, you can find additional payment processors on our
  - link "App Marketplace":
    - /url: https://www.bigcommerce.com/apps/categories/payments-security/payment-processors-gateways/
  - text: . Note that Open Payment Provider fees may apply. For more details, see
  - link "About BigCommerce Pricing":
    - /url: /s/article/Pricing
  - text: .
- paragraph:
  - strong: How will I know if changes are made to my payment methods in the control panel?
- paragraph:
  - text: When a payment method is enabled, disabled, or has settings updated, a notification will appear in the
  - link "control panel dashboard":
    - /url: /s/article/Getting-Started-with-the-New-Control-Panel
  - text: .
- paragraph:
  - img "Notifications in the control panel dashboard"
- paragraph:
  - text: You can also see records of changes to your payment methods in the
  - link "Staff Action Logs":
    - /url: /s/article/Using-Store-Logs
  - text: .
