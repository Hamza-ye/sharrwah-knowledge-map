- heading "FAQ" [level=3]
- paragraph:
  - strong: How do I create a new trial if I already have a BigCommerce account?
- paragraph:
  - text: Create your new store from the
  - link "Account Dashboard":
    - /url: /s/article/Account-Dashboard
  - text: by following the steps in
  - link "Adding a New Trial Store to an Existing Account":
    - /url: "#add-to-existing"
  - text: .
- paragraph:
  - strong: Do I need to follow the onboarding checklist in the dashboard?
- paragraph:
  - text: The checklist presents recommended store setup tasks based on the information you provided during trial creation, but you are not required to follow each step in order to launch your store. If you want to handle setup differently or you are already familiar with launching a BigCommerce store, click
  - strong: take me to the dashboard
  - text: at the bottom of the checklist.
- paragraph:
  - img "The take me to the dashboard link that hides onboarding steps and displays the trial dashboard"
- paragraph:
  - strong: I just created a new trial store, but I can’t log in. What should I do?
- paragraph:
  - text: If your login credentials aren’t working with your newly created trial store,
  - link "contact our support team":
    - /url: https://support.bigcommerce.com/s/#contact
  - text: .
- paragraph:
  - strong: Can I process live payments on a trial store?
- paragraph:
  - text: No, you cannot enable
  - link "payment gateways":
    - /url: /s/article/Available-Payment-Gateways
  - text: or
  - link "alternative payment methods":
    - /url: /s/article/Intro-to-APMs
  - text: until you have purchased a paid plan. However, you can test your trial store’s checkout page by enabling
  - link "offline payments":
    - /url: /s/article/Offline-Payment-Methods
  - text: or the
  - link "BigCommerce test payment gateway":
    - /url: /s/article/Testing-Shipping-Tax-and-Payment-Settings
  - text: .
- paragraph:
  - strong: Why aren’t shoppers receiving emails from my trial store?
- paragraph:
  - text: During your trial period,
  - link "transactional":
    - /url: /s/article/Customizing-Emails
  - text: and
  - link "abandoned cart":
    - /url: /s/article/Using-the-Abandoned-Cart-Saver
  - text: emails are sent to the store owner when the corresponding storefront event is triggered, such as creating a customer account or placing an order. You can use the
  - strong: Trial email recipients
  - text: setting in
  - link "Settings › Security & Privacy":
    - /url: http://login.bigcommerce.com/deep-links/settings/security
    - strong: Settings
    - text: ›
    - strong: Security & Privacy
  - text: to designate additional control panel users as recipients.
- paragraph:
  - img "The Trial email recipients setting with the store owner selected as a recipient"
- paragraph:
  - text: When you
  - link "upgrade to a paid plan":
    - /url: /s/article/How-do-I-upgrade-my-stores-plan
  - text: ", your storefront emails will be sent to shoppers automatically when triggered."
